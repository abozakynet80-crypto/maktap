<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز شبكات المرافق - محافظة المنيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f3f6fb;
    --card:#ffffff;
    --border:#e3e8f0;
    --ink:#1b2635;
    --sub:#6b7688;
    --brand:#0d6e6e;
    --brand-dark:#095656;
    --brand-light:#e6f4f4;
    --accent:#2f6fed;
    --good:#1e9e6b;
    --good-bg:#e8f8f1;
    --warn:#c9852b;
    --warn-bg:#fdf2e2;
    --bad:#d6483f;
    --bad-bg:#fceceb;
    --radius:14px;
    --shadow:0 2px 10px rgba(20,30,60,.06), 0 1px 2px rgba(20,30,60,.05);
  }
  html[data-theme="dark"]{
    --bg:#131c26;
    --card:#1b2632;
    --border:#2b3949;
    --ink:#eaf0f6;
    --sub:#93a2b5;
    --brand:#17a2a2;
    --brand-dark:#3fc4c4;
    --brand-light:#173636;
    --accent:#5b8dff;
    --good:#33c288;
    --good-bg:#173328;
    --warn:#e2a247;
    --warn-bg:#332711;
    --bad:#ea6259;
    --bad-bg:#3a1f1d;
    --shadow:0 2px 14px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3);
  }
  html[data-theme="dark"] body{background:var(--bg);}
  html[data-theme="dark"] .field input, html[data-theme="dark"] .field select, html[data-theme="dark"] .field textarea{background:#141d27;color:var(--ink);}
  html[data-theme="dark"] .field input:disabled{background:#20303f;color:var(--sub);}
  html[data-theme="dark"] .btn-outline{background:var(--card);color:var(--ink);}
  html[data-theme="dark"] ::-webkit-scrollbar{width:10px;height:10px;}
  html[data-theme="dark"] ::-webkit-scrollbar-track{background:var(--bg);}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#33465a;border-radius:8px;}
  html{transition:background-color .2s ease;}
  body, .topbar, .tabs, .card, .auth-card, .form-card{transition:background-color .2s ease,border-color .2s ease,color .2s ease;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  button, input, select, textarea{font-family:inherit;}
  button{cursor:pointer;}
  #app-root{min-height:100vh;display:flex;flex-direction:column;}

  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
  .brand-block{text-align:center;margin-bottom:28px;}
  .brand-block .logo-circle{
    width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:32px;font-weight:800;
    box-shadow:var(--shadow);
  }
  .brand-block h1{font-size:22px;margin:0 0 4px;font-weight:800;}
  .brand-block p{color:var(--sub);margin:0;font-size:14px;}
  .auth-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;width:100%;max-width:400px;border:1px solid var(--border);}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .load-text{margin-top:14px;color:var(--sub);font-size:14px;}

  .form-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;width:100%;max-width:440px;border:1px solid var(--border);}
  .form-card h2{margin:0 0 4px;font-size:19px;}
  .form-card .hint{color:var(--sub);font-size:13px;margin-bottom:20px;}
  .field{margin-bottom:16px;text-align:right;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .field input[type=text], .field input[type=tel], .field input[type=password], .field select, .field input[type=email], .field input[type=number], .field textarea{
    width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;background:#fbfcfe;color:var(--ink);transition:.15s;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brand);background:#fff;}
  .field input:disabled{background:#eef1f6;color:var(--sub);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:9px;border:none;font-weight:700;font-size:14px;transition:.15s;}
  .btn-primary{background:var(--brand);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-primary:disabled{background:#a9c3c3;cursor:not-allowed;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--brand);color:var(--brand);}
  .btn-danger{background:var(--bad);color:#fff;}
  .btn-danger:hover{background:#b83a32;}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn-block{width:100%;}
  .btn-auto{width:auto;}
  .error-text{color:var(--bad);font-size:13px;margin-top:8px;}

  .topbar{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 22px;position:sticky;top:0;z-index:20;}
  .topbar .left{display:flex;align-items:center;gap:12px;}
  .topbar .logo-circle{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none;}
  .topbar .title{font-weight:800;font-size:15.5px;line-height:1.2;}
  .topbar .subtitle{font-size:11.5px;color:var(--sub);}
  .topbar .right{display:flex;align-items:center;gap:12px;}
  .user-chip{display:flex;align-items:center;gap:8px;}
  .user-chip .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .user-chip .u-name{font-size:13.5px;font-weight:700;}
  .user-chip .u-dept{font-size:11px;color:var(--sub);}

  /* الساعة الرقمية */
  .digital-clock{
    display:flex;align-items:baseline;gap:6px;background:var(--brand-light);color:var(--brand-dark);
    padding:7px 14px;border-radius:10px;font-weight:800;border:1px solid var(--border);
    font-variant-numeric:tabular-nums;letter-spacing:.5px;
  }
  .digital-clock .dc-time{font-size:16px;}
  .digital-clock .dc-period{font-size:10.5px;font-weight:700;opacity:.85;}
  .digital-clock .dc-date{font-size:10px;color:var(--sub);font-weight:700;margin-right:4px;border-right:1px solid var(--border);padding-right:8px;}
  @media(max-width:700px){ .digital-clock .dc-date{display:none;} }
  .message-alert-wrap{position:relative;flex:none;}
  .message-alert-badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:50%;min-width:18px;height:18px;padding:0 4px;border:2px solid var(--card);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .message-alert-popup{position:absolute;top:46px;right:0;width:280px;max-width:80vw;background:var(--card);border:1px solid var(--brand);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;z-index:70;cursor:pointer;animation:messagePopIn .2s ease-out;}
  .message-alert-popup .map-title{font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .message-alert-popup .map-body{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .message-alert-popup .map-hint{font-size:10.5px;color:var(--brand);margin-top:6px;}
  @keyframes messagePopIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

  /* زر تبديل المظهر */
  .icon-btn{
    width:38px;height:38px;border-radius:9px;border:1.5px solid var(--border);background:var(--card);
    display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;flex:none;color:var(--ink);
  }
  .icon-btn:hover{border-color:var(--brand);}

  /* الإشعارات */
  .notif-wrap{position:relative;}
  .notif-badge{
    position:absolute;top:-4px;left:-4px;background:var(--bad);color:#fff;border-radius:50%;
    min-width:18px;height:18px;font-size:10.5px;display:flex;align-items:center;justify-content:center;
    font-weight:800;padding:0 3px;border:2px solid var(--card);
  }
  .notif-dropdown{
    position:absolute;top:46px;left:0;width:330px;max-width:88vw;background:var(--card);border:1px solid var(--border);
    border-radius:12px;box-shadow:var(--shadow);z-index:60;overflow:hidden;
  }
  .notif-dropdown .nd-head{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800;font-size:13.5px;}
  .notif-dropdown .nd-list{max-height:360px;overflow-y:auto;}
  .notif-item{padding:12px 14px;border-bottom:1px solid var(--border);}
  .notif-item:last-child{border-bottom:none;}
  .notif-item.unread{background:var(--brand-light);}
  .notif-item .ni-title{font-weight:700;font-size:13px;margin-bottom:3px;}
  .notif-item .ni-body{font-size:12.5px;color:var(--sub);}
  .notif-item .ni-time{font-size:10.5px;color:var(--sub);margin-top:5px;}
  .notif-empty{padding:26px 14px;text-align:center;color:var(--sub);font-size:13px;}

  /* كروت الداشبورد الرئيسية */
  .dash-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
  .dash-card{
    border:none;border-radius:14px;padding:18px 16px;text-align:right;color:#fff;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;min-height:100px;box-shadow:var(--shadow);transition:.15s;
  }
  .dash-card:hover{transform:translateY(-2px);}
  .dash-card .dc-icon{font-size:24px;}
  .dash-card .dc-title{font-weight:800;font-size:14.5px;}
  .dash-card .dc-desc{font-size:11.5px;opacity:.9;}
  .dash-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .dash-stat-card{
    border-radius:14px;padding:16px;text-align:center;border:1.5px solid var(--border);background:var(--card);
    cursor:pointer;transition:.15s;
  }
  .dash-stat-card:hover{border-color:var(--brand);transform:translateY(-2px);}
  .dash-stat-card .num{font-size:26px;font-weight:800;}
  .dash-stat-card .lbl{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px;}
  .dash-section-title{font-size:14px;font-weight:800;color:var(--sub);margin:0 0 12px;}

  .tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto;position:sticky;top:57px;z-index:19;}
  .tab-btn{padding:13px 16px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap;}
  .tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);}

  /* شريط جانبي للأقسام على شاشات الكمبيوتر (قابل للإظهار/الإخفاء) */
  .sidebar-toggle-btn{display:none;}
  .app-body{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;}
  @media(min-width:901px){
    .sidebar-toggle-btn{display:inline-flex;}
    .app-body{flex-direction:row;align-items:flex-start;}
    .tabs{
      flex-direction:column;align-items:stretch;gap:2px;
      width:236px;flex:none;overflow-x:visible;
      border-bottom:none;border-left:1px solid var(--border);
      padding:14px 12px;position:sticky;top:57px;
      height:calc(100vh - 57px);overflow-y:auto;
      transition:width .18s ease,padding .18s ease,opacity .18s ease,border-color .18s ease;
    }
    .tabs .tab-btn{
      text-align:center;border:1px solid var(--border);border-radius:9px;padding:11px 14px;width:100%;background:var(--card);
    }
    .tabs .tab-btn.active{background:var(--brand-light);border-color:var(--brand);}
    .tabs.sidebar-collapsed{
      width:0;padding-left:0;padding-right:0;border-color:transparent;opacity:0;overflow:hidden;pointer-events:none;
    }
    .container{max-width:none;margin:0;}
  }

  .container{max-width:1100px;margin:0 auto;width:100%;padding:22px 18px 60px;flex:1;}
  .grid{display:grid;gap:18px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media(max-width:760px){.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
  .card h3{margin:0 0 14px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
  .card .card-sub{color:var(--sub);font-size:12.5px;margin-top:-10px;margin-bottom:14px;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:700;}
  .pill-good{background:var(--good-bg);color:var(--good);}
  .pill-warn{background:var(--warn-bg);color:var(--warn);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);}
  .pill-neutral{background:#eef1f6;color:var(--sub);}

  .time-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .time-row:last-child{border-bottom:none;}
  .time-row .lbl{color:var(--sub);font-size:13px;}
  .time-row .val{font-weight:800;font-size:16px;}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;background:#fff;}
  th{color:var(--sub);font-weight:700;font-size:12px;background:#fafbfd;}
  .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:70vh;}
  .table-wrap table{border:none;}

  .col-action{position:sticky;right:0;z-index:3;min-width:210px;box-shadow:-6px 0 8px -6px rgba(20,30,60,.25);}
  thead .col-action{z-index:5;}
  tr.row-done td{background:var(--good-bg);}
  tr.row-done .col-action{background:var(--good-bg);}
  .action-stack{display:flex;align-items:center;gap:6px;}
  .btn-enter{background:var(--brand);color:#fff;}
  .btn-enter:hover{background:var(--brand-dark);}
  .btn-entered{background:var(--good);color:#fff;}

  .stat-box{background:var(--brand-light);border-radius:12px;padding:16px;text-align:center;}
  .stat-box-warn2{background:var(--warn-bg);}
  .stat-box-warn2 .num{color:var(--warn);}
  .card-muted{background:var(--bg);}
  .stat-box .num{font-size:26px;font-weight:800;color:var(--brand-dark);}
  .stat-box .lbl{font-size:12px;color:var(--sub);margin-top:2px;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}

  .task-input-row{display:flex;gap:8px;margin-bottom:8px;}
  .task-input-row input{flex:1;padding:11px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;}
  .remove-x{background:var(--bad-bg);color:var(--bad);border:none;border-radius:7px;width:34px;flex:none;font-weight:800;font-size:15px;}
  .task-chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-light);color:var(--brand-dark);padding:4px 10px;border-radius:16px;font-size:12px;margin:2px 4px 2px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,25,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-box{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;}
  .modal-box h3{margin:0 0 6px;font-size:17px;}
  .modal-box .modal-sub{color:var(--sub);font-size:13px;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn{flex:1;}

  .badge-dept{padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700;background:#eef1f6;color:var(--ink);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);z-index:200;max-width:90vw;text-align:center;}
  .toast.err{background:var(--bad);}
  .toast.ok{background:var(--good);}

  .subtab-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .subtab-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;color:var(--sub);}
  .subtab-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--sub);}
  .empty-state .emoji{font-size:34px;margin-bottom:8px;}

  .progress-bar{height:8px;background:#eef1f6;border-radius:6px;overflow:hidden;}
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:6px;transition:.3s;}

  .leader-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .leader-row:last-child{border-bottom:none;}
  .leader-rank{width:26px;height:26px;border-radius:50%;background:#eef1f6;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
  .leader-rank.top1{background:#ffd76a;color:#7a5600;}
  .leader-rank.top2{background:#d9e2ee;color:#3c4a5f;}
  .leader-rank.top3{background:#e8c39e;color:#6b3f16;}
  .leader-name{font-weight:700;font-size:13.5px;flex:1;}
  .leader-dept{font-size:11px;color:var(--sub);}
  .leader-nums{font-size:12.5px;color:var(--sub);font-weight:700;white-space:nowrap;}

  .link-btn{background:none;border:none;color:var(--brand);font-weight:700;font-size:12.5px;padding:0;}
  .muted{color:var(--sub);}
  .flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .small-note{font-size:12px;color:var(--sub);background:#fafbfd;border:1px dashed var(--border);border-radius:8px;padding:10px 12px;}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filter-bar input[type=text], .filter-bar select, .filter-bar input[type=date], .filter-bar input[type=month]{padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:13.5px;background:#fbfcfe;}
  .filter-bar input[type=text]{flex:1;min-width:190px;}
  .filter-bar-oneline{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
  .filter-bar-oneline select, .filter-bar-oneline input{flex-shrink:0;}
  .filter-bar-oneline input[type=text]{flex-shrink:1;min-width:140px;}

  .sticky-table thead th{position:sticky;top:0;z-index:4;}
  .sticky-table td:first-child, .sticky-table th:first-child{position:sticky;right:0;z-index:3;box-shadow:-6px 0 8px -6px rgba(20,30,60,.15);}
  .sticky-table thead th:first-child{z-index:6;}
  .dept-group-row td{background:var(--brand-light)!important;color:var(--brand-dark);font-weight:800;font-size:12.5px;padding:8px 10px;position:sticky;right:0;top:37px;z-index:2;}

  .file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .file-row:last-child{border-bottom:none;}
  .file-row .f-info{flex:1;min-width:0;}
  .file-row .f-name{font-weight:700;font-size:13.5px;cursor:pointer;color:var(--accent);word-break:break-all;}
  .file-row .f-name:hover{text-decoration:underline;}
  .file-row .f-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}

  .emp-stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;height:272px;}
  .emp-stat-card .es-name{font-weight:800;font-size:14px;margin-bottom:2px;flex:none;}
  .emp-stat-card .es-dept{font-size:11.5px;color:var(--sub);margin-bottom:10px;flex:none;}
  .emp-stat-card .es-centers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
  .emp-stat-card .es-centers .badge-dept{font-size:10.5px;padding:2px 7px;}
  .emp-stat-card .stat-row{margin-bottom:0;gap:6px;flex:none;}
  .emp-stat-card .stat-box{padding:8px 4px;border-radius:9px;}
  .emp-stat-card .stat-box .num{font-size:18px;}
  .emp-stat-card .stat-box .lbl{font-size:10px;}
  .emp-stat-card .es-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .emp-stat-card .es-centers-list{border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);margin:2px 0 10px;padding:2px 4px;flex:1 1 auto;overflow-y:auto;min-height:0;}
  .emp-stat-card .es-empty-note{flex:1 1 auto;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;margin-bottom:10px;}
  .emp-stat-card{border-top:4px solid var(--sub);transition:.15s;}

  .task-mini-list{display:flex;flex-direction:column;gap:5px;padding:2px 0;}
  .task-mini-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:12.5px;line-height:1.5;}
  .task-mini-row .tm-num{color:var(--sub);font-weight:700;flex:none;}
  .task-mini-row .tm-text{font-weight:600;}
  .task-mini-row .tm-count{background:var(--good-bg);color:var(--good);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;}
  .task-mini-row .tm-time{color:var(--sub);font-size:11px;}
  tr.row-no-ach{opacity:.6;}
  .emp-stat-card.perf-good{border-top-color:var(--good);}
  .emp-stat-card.perf-warn{border-top-color:var(--warn);}
  .emp-stat-card.perf-bad{border-top-color:var(--bad);}
  .emp-stat-card.perf-none{border-top-color:var(--border);}
  .emp-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:stretch;}

  /* ===== مشاريع العمل ===== */
  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .project-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;}
  .project-card:hover{transform:translateY(-2px);border-color:var(--brand);}
  .project-cover{height:145px;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:46px;overflow:hidden;position:relative;}
  .project-card-locked{cursor:not-allowed;opacity:.72;}
  .project-lock-badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.45);border-radius:8px;padding:3px 7px;font-size:14px;}
  .project-cover img{width:100%;height:100%;object-fit:cover;}
  /* عرض الصورة كاملة بدون قص */
  .project-cover.has-img,.project-detail-cover.has-img{height:auto;min-height:0;display:block;font-size:0;background:#0f172a;}
  .project-cover.has-img img,.project-detail-cover.has-img img{width:100%;height:auto;max-height:340px;object-fit:contain;display:block;margin:0 auto;}
  .project-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .project-title{font-weight:800;font-size:15px;}
  .project-desc{font-size:12.5px;color:var(--sub);line-height:1.6;min-height:40px;}
  .project-meta{display:flex;gap:6px;flex-wrap:wrap;color:var(--sub);font-size:11.5px;}
  .project-progress{height:8px;background:#eef1f6;border-radius:6px;overflow:hidden;}
  .project-progress>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:6px;}
  .project-detail-cover{height:210px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:64px;}
  .project-detail-cover img{width:100%;height:100%;object-fit:cover;}
  .project-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  .project-task-row{border-bottom:1px solid var(--border);padding:11px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .project-task-row:last-child{border-bottom:none;}
  .project-task-main{min-width:0;flex:1;}
  .project-task-title{font-weight:800;font-size:13.5px;}
  .project-task-meta{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.6;}
  .project-member-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
  .project-member-row:last-child{border-bottom:none;}
  .project-member-name{font-weight:700;font-size:13px;}
  .performance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0;}
  .performance-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .performance-panel h3{font-size:15px;margin:0 0 12px;}
  .performance-score{font-size:28px;font-weight:800;color:var(--brand-dark);}
  .performance-bar{height:9px;background:#eef1f6;border-radius:6px;overflow:hidden;margin-top:8px;}
  .performance-bar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:6px;}
  @media(max-width:760px){.project-panels{grid-template-columns:1fr;}.project-detail-cover{height:160px;}}

  .center-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafbfd;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .center-chip .cc-name{font-weight:700;font-size:13.5px;}
  .center-chip .cc-count{font-size:11.5px;color:var(--sub);}
  .center-chip select{min-width:200px;}

  /* ==== طلبات الاستيفاء ==== */
  .btn-istifa{background:#f6b93b;color:#5b3d00;}
  .btn-istifa:hover{background:#e8a71f;}
  tr.row-istifa td{background:#fff8e6;}
  tr.row-istifa .col-action{background:#fff8e6;}

  /* ==== نوتة المهام اليومية ==== */
  .notebook-card{border-top:4px solid var(--brand);}
  .note-rows{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:8px;}
  @media(min-width:760px){.note-rows{grid-template-columns:1fr 1fr;}}
  .note-row{background:#fbfcfe;border:1.5px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;}
  .note-row .n-top{display:flex;gap:6px;align-items:stretch;}
  .note-row .n-text{flex:1;min-width:0;min-height:32px;max-height:140px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13.5px;background:#fff;resize:none;overflow:hidden;line-height:1.4;font-family:inherit;}
  .note-row .n-count-wrap{display:flex;align-items:center;gap:5px;flex:none;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:0 8px;}
  .note-row .n-count-wrap .n-count-lbl{font-size:11px;color:var(--sub);flex:none;}
  .note-row .n-count{width:38px;flex:none;padding:6px 2px;border:none;font-size:13.5px;background:transparent;text-align:center;}
  .note-row .n-count:focus{outline:none;}
  .note-row .n-text:focus{outline:none;border-color:var(--brand);}
  .note-row .n-count-wrap:focus-within{border-color:var(--brand);}
  .note-row .n-save{width:100%;}
  .saved-task{display:flex;align-items:center;gap:8px;background:var(--good-bg);border:1px solid #cdeadd;border-radius:10px;padding:9px 12px;margin-bottom:7px;}
  .saved-task .st-num{width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex:none;}
  .saved-task .st-text{flex:1;font-size:13.5px;font-weight:700;color:#14664a;word-break:break-word;white-space:normal;}
  .saved-task .st-count{background:#fff;border:1px solid #cdeadd;color:var(--good);border-radius:14px;padding:2px 10px;font-size:12px;font-weight:800;flex:none;}
  .saved-task .st-time{font-size:11px;color:var(--sub);flex:none;}
  .st-del{background:none;border:none;color:var(--bad);font-size:17px;font-weight:800;flex:none;line-height:1;}
  .motiv-banner{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(135deg,var(--brand-light),#eef4ff);border:1px solid #d9e7f7;border-radius:12px;padding:12px 14px;margin-bottom:14px;}
  .motiv-banner .mb-emoji{font-size:26px;flex:none;line-height:1.2;}
  .motiv-banner .mb-title{font-weight:800;font-size:14px;}
  .motiv-banner .mb-sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .badge-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .ach-badge{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:3px 11px;font-size:11.5px;font-weight:700;color:#a9b2c0;}
  .ach-badge.on{background:#fff8e6;border-color:#f0d089;color:#8a6200;}

  /* ===== قسم توزيع المهام ===== */
  .task-card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .task-card .tc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .task-card .tc-title{font-weight:800;font-size:15px;}
  .task-card .tc-desc{font-size:13px;color:var(--sub);margin-top:4px;white-space:pre-wrap;}
  .task-card .tc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--sub);}
  .recur-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;}
  .recur-daily{background:var(--brand-light);color:var(--brand-dark);}
  .recur-once{background:#eef1f6;color:var(--sub);}
  html[data-theme="dark"] .recur-once{background:#26313f;color:var(--sub);}
  .attach-link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:700;}
  .attach-link:hover{text-decoration:underline;}
  .assignee-list{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;padding:8px;background:var(--bg);}
  html[data-theme="dark"] .assignee-list{background:#141d27;}
  .assignee-chk{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer;}
  .assignee-chk input{margin:0;}
  .task-close-form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .task-close-form textarea{width:100%;padding:9px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;resize:vertical;min-height:56px;background:#fbfcfe;color:var(--ink);}
  html[data-theme="dark"] .task-close-form textarea{background:#141d27;}
  .assignee-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .assignee-status-row:last-child{border-bottom:none;}

  /* ===== إصلاحات المظهر الداكن: عناصر كانت بخلفية بيضاء/فاتحة ثابتة ===== */
  html[data-theme="dark"] th, html[data-theme="dark"] td{background:var(--card);color:var(--ink);}
  html[data-theme="dark"] .modal-box{background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.55);}
  html[data-theme="dark"] .subtab-btn{background:var(--card);color:var(--sub);}
  html[data-theme="dark"] .subtab-btn.active{color:var(--brand-dark);}
  html[data-theme="dark"] .field input:focus, html[data-theme="dark"] .field select:focus, html[data-theme="dark"] .field textarea:focus{background:#141d27;color:var(--ink);}
  html[data-theme="dark"] .filter-bar input, html[data-theme="dark"] .filter-bar select{background:#141d27;color:var(--ink);}
  html[data-theme="dark"] tr.row-istifa td, html[data-theme="dark"] tr.row-istifa .col-action{background:#332711;}
  html[data-theme="dark"] .note-row{background:#141d27;}
  html[data-theme="dark"] .note-row .n-text{background:#141d27;color:var(--ink);}
  html[data-theme="dark"] .note-row .n-count-wrap{background:#141d27;color:var(--ink);}
  html[data-theme="dark"] .saved-task{border-color:#1e4636;}
  html[data-theme="dark"] .saved-task .st-text{color:#7fe0b8;}
  html[data-theme="dark"] .saved-task .st-count{background:#141d27;border-color:#1e4636;}
  html[data-theme="dark"] .motiv-banner{background:linear-gradient(135deg,var(--brand-light),#182236);border-color:var(--border);}
  html[data-theme="dark"] .ach-badge{background:var(--card);border-color:var(--border);color:#6d7c8f;}
  html[data-theme="dark"] .ach-badge.on{background:#332711;border-color:#5c4a1c;color:#e2c069;}
  html[data-theme="dark"] .dept-group-row td{background:var(--brand-light)!important;color:var(--brand-dark);}
  html[data-theme="dark"] .pill-neutral{background:#26313f;color:var(--sub);}
  html[data-theme="dark"] .badge-dept{background:#26313f;color:var(--ink);}
  html[data-theme="dark"] .field input:disabled{background:#20303f;color:var(--sub);}
  html[data-theme="dark"] th{background:#141d27;color:var(--sub);}
  html[data-theme="dark"] .progress-bar{background:#26313f;}
  html[data-theme="dark"] .leader-rank{background:#26313f;color:var(--sub);}
  html[data-theme="dark"] .small-note{background:#141d27;color:var(--sub);}
  html[data-theme="dark"] .center-chip{background:#141d27;}

  /* ===== قسم المراسلات ===== */
  .msg-shell{display:flex;height:75vh;min-height:520px;max-height:75vh;direction:rtl;}
  .msg-sidebar{width:280px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;direction:rtl;overflow:hidden;}
  .msg-thread{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;}
  .msg-back-btn{display:none;}
  .msg-side-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
  .conv-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;direction:rtl;}
  .conv-item:hover, .conv-item.active{background:var(--brand-light);}
  .conv-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;}
  .conv-info{flex:1;min-width:0;text-align:right;}
  .conv-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
  .conv-preview{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;text-align:right;}
  .conv-meta{display:flex;flex-direction:column;align-items:flex-start;gap:5px;flex:none;min-width:34px;}
  .conv-time{font-size:10px;color:var(--sub);}
  .conv-unread-badge{color:var(--brand);font-size:16px;line-height:1;}
  .conv-unread-count{background:var(--good);color:#fff;border-radius:50%;min-width:20px;height:20px;padding:0 5px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .conv-item.has-unread .conv-name{font-weight:800;}
  .conv-item.has-unread .conv-time{color:var(--good);font-weight:800;}
  .conv-item.group-conv{border-right:4px solid var(--accent);background:rgba(47,111,237,.045);}
  .conv-item.group-conv:hover,.conv-item.group-conv.active{background:var(--brand-light);}
  .conv-item.group-conv .conv-avatar{border-radius:10px;background:linear-gradient(135deg,var(--accent),#7a5cff);}
  .conv-type-label{display:inline-flex;align-items:center;background:var(--accent);color:#fff;border-radius:5px;padding:1px 5px;font-size:9px;font-weight:800;margin-right:5px;vertical-align:middle;}
  .msg-section-title{padding:10px 14px 7px;color:var(--sub);font-size:11.5px;font-weight:800;border-bottom:1px solid var(--border);background:var(--bg);}
  .employee-contact .conv-preview{color:var(--good);}
  .messages-tab-badge{display:none;align-items:center;justify-content:center;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:50%;padding:0 4px;margin-right:6px;vertical-align:middle;}
  .msg-bubble-row{display:flex;}
  .msg-bubble-row.mine{justify-content:flex-end;}
  .msg-bubble-row.theirs{justify-content:flex-start;}
  .msg-bubble{max-width:72%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;text-align:right;}
  .msg-bubble.mine{background:var(--brand);color:#fff;border-bottom-left-radius:4px;}
  .msg-bubble.theirs{background:var(--card);border:1px solid var(--border);border-bottom-right-radius:4px;}
  .msg-sender{font-size:11px;font-weight:800;margin-bottom:3px;opacity:.8;color:var(--brand-dark);text-align:right;}
  .msg-time{font-size:10px;opacity:.75;margin-top:4px;text-align:left;}
  .msg-attach{display:block;margin-top:6px;font-size:12px;text-decoration:underline;}
  .msg-image-attach{display:block;margin-top:8px;width:min(300px,100%);max-height:240px;border-radius:10px;object-fit:contain;background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.12);cursor:pointer;}
  .msg-delete-btn{display:block;margin-top:4px;background:none;border:0;color:inherit;opacity:.65;font-size:10px;padding:0;cursor:pointer;}
  .msg-delete-btn:hover{opacity:1;color:var(--bad);}
  .msg-readers-btn{display:block;margin-top:3px;background:none;border:0;color:inherit;opacity:.7;font-size:10px;padding:0;cursor:pointer;}
  .msg-readers-btn:hover{opacity:1;text-decoration:underline;}
  .mobile-bottom-nav,.mobile-more-menu,.exit-warning-overlay{display:none;}
  @media(max-width:760px){
    .msg-shell{flex-direction:column;height:calc(100dvh - 150px);min-height:440px;max-height:none;}
    .msg-sidebar{width:100%;border-left:none;border-bottom:1px solid var(--border);}
    #msg-shell.thread-open .msg-sidebar{display:none;}
    .msg-thread{display:none;}
    #msg-shell.thread-open .msg-thread{display:flex;}
    .msg-back-btn{display:inline-flex;}
  }
  @media(max-width:700px){
    .topbar{padding:8px 10px;gap:8px;align-items:flex-start;flex-wrap:wrap;}
    .topbar .left{gap:8px;min-width:0;flex:1;}
    .topbar .left .title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .topbar .left .subtitle{font-size:10px;}
    .topbar .logo-circle{width:32px;height:32px;font-size:13px;}
    .topbar .right{width:100%;gap:6px;justify-content:flex-start;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
    .topbar .right::-webkit-scrollbar{display:none;}
    .digital-clock{padding:6px 9px;min-height:36px;}
    .digital-clock .dc-time{font-size:13px;}
    .digital-clock .dc-period{font-size:9px;}
    .topbar .right .user-chip{order:5;margin-right:auto;min-width:max-content;}
    .topbar .right .user-chip .u-name{font-size:11.5px;}
    .topbar .right .user-chip .u-dept{font-size:9.5px;}
    .topbar .right #account-btn,.topbar .right #logout-btn{font-size:11px;padding:7px 9px;white-space:nowrap;}
    .icon-btn{width:36px;height:36px;}
    .message-alert-popup{position:fixed;top:92px;right:10px;width:calc(100vw - 20px);max-width:320px;}
    .notif-dropdown{position:fixed;top:92px;left:10px;right:10px;width:auto;max-width:none;}
    .tabs{display:none;}
    .tab-btn{padding:10px 12px;font-size:12px;scroll-snap-align:start;}
    .container{padding:14px 10px 86px;}
    .card{padding:14px;border-radius:11px;}
    .card h3{font-size:14px;}
    .dash-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px;}
    .dash-stat-card{padding:11px 7px;border-radius:10px;}
    .dash-stat-card .num{font-size:21px;}
    .dash-stat-card .lbl{font-size:10.5px;}
    .dash-cards-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .dash-card{padding:12px 10px;min-height:92px;border-radius:11px;}
    .dash-card .dc-icon{font-size:20px;}
    .dash-card .dc-title{font-size:12.5px;}
    .dash-card .dc-desc{font-size:10px;line-height:1.4;}
    .stat-row{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:8px;}
    .stat-box{padding:11px 7px;}
    .stat-box .num{font-size:21px;}
    .stat-box .lbl{font-size:10.5px;}
    .flex-between{align-items:stretch;}
    .flex-between>.btn{width:100%;}
    .filter-bar{gap:6px;}
    .filter-bar input,.filter-bar select,.filter-bar button{max-width:100%;}
    .projects-grid{grid-template-columns:1fr;gap:12px;}
    .project-cover{height:125px;}
    .project-body{padding:12px;}
    .project-detail-cover{height:145px;}
    .project-panels{grid-template-columns:1fr;gap:10px;}
    .project-task-row{flex-direction:column;}
    .project-task-row>div:last-child{align-self:flex-start;}
    .modal-overlay{padding:8px;align-items:flex-start;overflow-y:auto;}
    .modal-box{padding:18px 14px;margin:10px 0;max-height:calc(100vh - 20px);}
    .modal-actions{flex-wrap:wrap;}

function workDaysBetween(fromStr, toStr){
  const out=[];
  if(!fromStr || !toStr || fromStr>toStr) return out;
  let cur = new Date(fromStr+'T12:00:00');
  const end = new Date(toStr+'T12:00:00');
  while(cur<=end){
    const ds = cur.toISOString().slice(0,10);
    if(!WEEKEND_DAYS.includes(cur.getDay())) out.push(ds);
    cur.setDate(cur.getDate()+1);
  }
  return out;
}

  const lastDay = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  let last = `${m}-${String(lastDay).padStart(2,'0')}`;

function unlockAudioContext(){
  if(_audioUnlocked) return;
  try{

}

/* نغمة تنبيه قصيرة (بدون أي ملف خارجي) لرسالة أو إشعار جديد */
function playNotifSound(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==='suspended') _audioCtx.resume();
    const ctx = _audioCtx;
    const t0 = ctx.currentTime;
    [[0,880],[0.12,1174.66]].forEach(([delay,freq])=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t0+delay);
      gain.gain.setValueAtTime(0.0001, t0+delay);
      gain.gain.exponentialRampToValueAtTime(0.2, t0+delay+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+delay+0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0+delay); osc.stop(t0+delay+0.17);
    });
  }catch(e){ console.warn('notif sound error', e); }
}

    <div class="progress-bar" style="margin-top:10px;"><div style="width:${totalTarget?Math.round(totalDone/totalTarget*100):0}%;"></div></div>
  `;
}
function perfClass(target, done){
  if(!target) return 'perf-none';
  const pct = done/target*100;
  if(pct>=90) return 'perf-good';
  if(pct>=50) return 'perf-warn';
  return 'perf-bad';
}
function authErrMsg(code){
  if(!code) return 'حدث خطأ، حاول مرة أخرى';
  if(code.includes('wrong-password') || code.includes('invalid-credential') || code.includes('user-not-found'))
    return 'اسم المستخدم أو كلمة المرور غير صحيحة';
  if(code.includes('too-many-requests')) return 'محاولات كثيرة، انتظر قليلاً ثم حاول مرة أخرى';
  if(code.includes('email-already-in-use')) return 'اسم المستخدم مستخدم بالفعل';
  if(code.includes('weak-password')) return 'كلمة المرور قصيرة — 6 أحرف أو أرقام على الأقل';
  if(code.includes('network')) return 'تعذر الاتصال بالإنترنت';
  return 'حدث خطأ، حاول مرة أخرى';
}

/* ============ نوتة المهام اليومية (جديد) ============ */
const DAILY_TASK_GOAL = 3;   // هدف عدد المهام اليومي (للتحفيز فقط)
let _tasksSig = null;

function taskLabel(t){
  if(!t) return '';
  const hasCount = (t.count!==undefined && t.count!==null && t.count!=='');
  return (t.text||'') + (hasCount ? ` (عدد: ${t.count})` : '');
}
function tasksTotalCount(tasks){
  return (tasks||[]).reduce((s,t)=> s + (Number(t && t.count)||0), 0);
}
function motivFor(n, total){
  if(n===0) return {e:'🚀', t:'يلا نبدأ اليوم بأول إنجاز!', s:'اكتب أول مهمة واضغط «حفظ» — كل مهمة تتسجل باسمك فورًا'};
  if(n===1) return {e:'👏', t:'أول مهمة اتسجلت — بداية موفقة!', s:`باقي ${DAILY_TASK_GOAL-n} مهام للوصول لهدف اليوم`};
  if(n<DAILY_TASK_GOAL) return {e:'💪', t:`ماشي بخطى ثابتة — ${n} مهام خلصت!`, s:`باقي ${DAILY_TASK_GOAL-n} مهمة وتحقق هدف اليوم${total?` — إجمالي ما أنجزته: ${total}`:''}`};
  if(n<DAILY_TASK_GOAL+3) return {e:'🏆', t:'حققت هدف اليوم — تحية ليك!', s:`${n} مهمة${total?` بإجمالي عدد ${total}`:''} — أي مهمة زيادة تُحسب لك نقطة إضافية`};
  return {e:'🌟', t:'أداء متميز جدًا اليوم!', s:`${n} مهمة${total?` بإجمالي عدد ${total}`:''} — إنت من الأعلى إنجازًا، استمر`};
}
function achBadges(n, total){
  return [
    {on:n>=1, txt:'🥉 أول مهمة'},
    {on:n>=DAILY_TASK_GOAL, txt:'🥇 هدف اليوم'},
    {on:n>=5, txt:'🥈 5 مهام'},
    {on:n>=8, txt:'🔥 8 مهام'},
    {on:total>=50, txt:'🚀 50+ إنجاز'}
  ].map(b=>`<span class="ach-badge ${b.on?'on':''}">${b.txt}</span>`).join('');
}
function noteRowHTML(){
  return `<div class="note-row">
    <div class="n-top">
      <textarea class="n-text" placeholder="اكتب المهمة التي أنجزتها..." rows="1"></textarea>
      <div class="n-count-wrap"><span class="n-count-lbl">العدد</span><input type="text" class="n-count" placeholder="—"></div>
    </div>
    <button class="btn btn-sm btn-enter n-save">💾 حفظ</button>
  </div>`;
}
function autoGrowTextarea(t){
  t.style.height='auto';
  t.style.height = Math.min(140, Math.max(32, t.scrollHeight)) + 'px';
}
/* حفظ مهمة واحدة فورًا أثناء اليوم */
async function saveTaskFromRow(row, docId){
  const textEl = row.querySelector('.n-text');
  const cntEl  = row.querySelector('.n-count');
  const btn    = row.querySelector('.n-save');
  const text = textEl.value.trim();
  const countRaw = normalizeDigits(cntEl.value).trim();
  if(!text){ toast('اكتب اسم المهمة أولاً', 'err'); textEl.focus(); return; }
  if(countRaw!=='' && (isNaN(Number(countRaw)) || Number(countRaw)<0)){ toast('العدد لازم يكون رقمًا صحيحًا', 'err'); cntEl.focus(); return; }
  const t = {text, at: Timestamp.fromMillis(nowMs())};
  if(countRaw!=='') t.count = Number(countRaw);
  btn.disabled = true; btn.textContent = '...';
  textEl.value=''; cntEl.value=''; autoGrowTextarea(textEl);
  try{
    await updateDoc(doc(db,'attendance',docId), {tasks: arrayUnion(t)});
    toast('تم حفظ المهمة ✔ استمر كده', 'ok');
  }catch(err){
    console.error(err);
    textEl.value = text; cntEl.value = countRaw; autoGrowTextarea(textEl);
    toast('تعذر حفظ المهمة، حاول مرة أخرى', 'err');
  }
  btn.disabled = false; btn.textContent = '💾 حفظ';
}
async function deleteSavedTask(docId, saved, idx){
  if(!confirm('حذف هذه المهمة من سجل اليوم؟')) return;
  try{
    await updateDoc(doc(db,'attendance',docId), {tasks: saved.filter((_,i)=> i!==idx)});
    toast('تم حذف المهمة', 'ok');
  }catch(err){ console.error(err); toast('تعذر الحذف، حاول مرة أخرى', 'err'); }
}
/* بطاقة النوتة — تتحدث لحظيًا وتحافظ على ما يكتبه الموظف قبل الحفظ */
function renderTasksCard(data, docId){
  const card = document.getElementById('tasks-card');
  if(!card) return;
  const saved = (data && Array.isArray(data.tasks)) ? data.tasks : [];
  const checkedIn = !!(data && data.checkIn);
  const closed = !!(data && data.checkOut);
  const sig = JSON.stringify(saved)+'|'+checkedIn+'|'+closed;
  if(card.dataset.ready==='1' && sig===_tasksSig) return;
  _tasksSig = sig;

  /* حفظ المسودات والتركيز قبل إعادة الرسم */
  const prev = [...card.querySelectorAll('.note-row')].map(r=>({
    text: r.querySelector('.n-text').value,
    count: r.querySelector('.n-count').value
  }));
  const act = document.activeElement;
  let fIdx=-1, fCls='n-text', fPos=0;
  if(act && card.contains(act) && act.closest && act.closest('.note-row')){
    const rws=[...card.querySelectorAll('.note-row')];
    fIdx = rws.indexOf(act.closest('.note-row'));
    fCls = act.classList.contains('n-count') ? 'n-count' : 'n-text';
    fPos = act.selectionStart || 0;
  }

  if(!checkedIn){
    card.innerHTML = `
      <h3>📝 نوتة المهام اليومية</h3>
      <div class="empty-state"><div class="emoji">🔒</div>النوتة تفتح بعد تسجيل الحضور</div>`;
    card.dataset.ready='1';
    return;
  }

  const n = saved.length;
  const total = tasksTotalCount(saved);
  const m = motivFor(n, total);
  const pct = Math.min(100, Math.round(n/DAILY_TASK_GOAL*100));
  const rowsNeeded = closed ? 0 : Math.max(DAILY_TASK_GOAL, prev.length);

  card.innerHTML = `
    <div class="flex-between" style="margin-bottom:10px;">
      <h3 style="margin:0;">📝 نوتة المهام اليومية</h3>
      <span class="status-pill ${n>=DAILY_TASK_GOAL?'pill-good':(n?'pill-warn':'pill-neutral')}">${n} مهمة${total?` • إجمالي عدد ${total}`:''}</span>
    </div>
    <div class="motiv-banner">
      <div class="mb-emoji">${m.e}</div>
      <div style="flex:1;min-width:0;">
        <div class="mb-title">${esc(m.t)}</div>
        <div class="mb-sub">${esc(m.s)}</div>
        <div class="progress-bar" style="margin-top:8px;"><div style="width:${pct}%;"></div></div>
        <div class="badge-row">${achBadges(n, total)}</div>
      </div>
    </div>
    <div id="saved-tasks-box">
      ${n ? saved.map((t,i)=>`
        <div class="saved-task">
          <div class="st-num">${i+1}</div>
          <div class="st-text">${esc(t.text||'')}</div>
          ${(t.count!==undefined&&t.count!==null&&t.count!=='')?`<div class="st-count">عدد ${esc(t.count)}</div>`:''}
          <div class="st-time">${t.at?fmtTime(t.at):''}</div>
          ${closed?'':`<button class="st-del" data-idx="${i}" title="حذف المهمة">×</button>`}
        </div>`).join('') : `<div class="small-note" style="margin-bottom:10px;">لم تسجل أي مهمة اليوم بعد — اكتب أول مهمة بالأسفل واضغط «حفظ»</div>`}
    </div>
    ${closed ? `<div class="small-note" style="margin-top:12px;">✅ تم تسجيل الانصراف اليوم — المهام أعلاه محفوظة في سجلك ولا يمكن تعديلها</div>` : `
      <div id="note-rows" class="note-rows">${Array.from({length:rowsNeeded}).map(()=>noteRowHTML()).join('')}</div>
      <button class="btn btn-outline btn-sm" id="add-note-row">+ إضافة مهمة أخرى</button>
    `}
  `;

  if(!closed){
    const rowsBox = card.querySelector('#note-rows');
    const bind = (row)=>{
      const ta = row.querySelector('.n-text');
      row.querySelector('.n-save').addEventListener('click', ()=> saveTaskFromRow(row, docId));
      ta.addEventListener('input', ()=> autoGrowTextarea(ta));
      ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); saveTaskFromRow(row, docId); } });
      row.querySelector('.n-count').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveTaskFromRow(row, docId); } });
      autoGrowTextarea(ta);
    };
    [...rowsBox.querySelectorAll('.note-row')].forEach(bind);
    card.querySelector('#add-note-row').addEventListener('click', ()=>{
      const row = el(noteRowHTML());
      rowsBox.appendChild(row); bind(row);
      row.querySelector('.n-text').focus();
    });
    /* استعادة المسودات والتركيز */
    const rws = [...rowsBox.querySelectorAll('.note-row')];
    prev.forEach((p,i)=>{
      if(rws[i]){ rws[i].querySelector('.n-text').value = p.text; rws[i].querySelector('.n-count').value = p.count; }
    });
    if(fIdx>=0 && rws[fIdx]){
      const inp = rws[fIdx].querySelector('.'+fCls);
      inp.focus();
      try{ inp.setSelectionRange(fPos, fPos); }catch(e){}
    }
    card.querySelectorAll('.st-del').forEach(b=>{
      b.addEventListener('click', ()=> deleteSavedTask(docId, saved, +b.dataset.idx));
    });
  }
  card.dataset.ready='1';
}

let activeTab = 'home';
/* ===== نظام الرجوع: كل شاشة/نافذة فرعية تُسجَّل في سجل المتصفح، وزر الرجوع يرجع خطوة خطوة حتى الرئيسية ===== */
const navLayers = [];
let navReady = false;
function pushNavLayer(close, kind){
  const layer = {close, kind:kind||'sub', dead:false};
  navLayers.push(layer);
  try{ history.pushState({appNav:true}, '', location.href); }catch(e){}
  return layer;
}
function killNavLayers(kind){ navLayers.forEach(l=>{ if(l.kind===kind) l.dead=true; }); }
/* للاستخدام من أزرار الرجوع داخل الواجهة */
function closeNavLayer(layer, fallback){
  if(layer && !layer.dead){
    if(navLayers[navLayers.length-1]===layer){ history.back(); return; }
    layer.dead = true;
  }
  fallback();
}
function handleNavPop(e){
  if(navLayers.length){
    const layer = navLayers.pop();
    if(layer.dead){ history.back(); }
    else { try{ layer.close(); }catch(err){ console.error(err); } }
    return true;
  }
  return !!(e.state && e.state.appGuard);
}
function setupModalHistory(){
  new MutationObserver(muts=>{
    muts.forEach(m=>{
      m.addedNodes.forEach(n=>{
        if(n.nodeType===1 && n.classList.contains('modal-overlay')){
          n._navLayer = pushNavLayer(()=>{ n.remove(); }, 'modal');
        }
      });
      m.removedNodes.forEach(n=>{ if(n._navLayer) n._navLayer.dead = true; });
    });
  }).observe(document.body,{childList:true});
}
let mobileExitGuardReady = false;
let mobileExitConfirmed = false;
function setupMobileExitGuard(shell){
  const overlay = shell.querySelector('#exit-warning-overlay');
  if(!overlay || mobileExitGuardReady) return;
  mobileExitGuardReady = true;
  const isMobile = ()=>window.matchMedia('(max-width: 700px)').matches;
  const showExitWarning = ()=>{
    if(!isMobile()) return;
    history.pushState({appGuard:true}, '', location.href);
    overlay.classList.add('open');
  };
  shell.querySelector('#exit-cancel-btn').addEventListener('click', ()=>overlay.classList.remove('open'));
  shell.querySelector('#exit-confirm-btn').addEventListener('click', ()=>{
    mobileExitConfirmed=true;
    overlay.classList.remove('open');
    history.back();
  });
  if(isMobile()) history.pushState({appGuard:true}, '', location.href);
  else history.replaceState({appGuard:true}, '', location.href);
  setupModalHistory();
  window.addEventListener('popstate', e=>{
    if(mobileExitConfirmed) return;
    if(handleNavPop(e)) return;
    showExitWarning();
  });
  window.addEventListener('beforeunload', e=>{
    if(isMobile() && !mobileExitConfirmed){ e.preventDefault(); e.returnValue=''; }
  });
}
function setupMobileNavigation(shell){
  const moreMenu = shell.querySelector('#mobile-more-menu');
  shell.querySelectorAll('[data-mobile-tab]').forEach(button=>button.addEventListener('click',()=>{
    switchTab(button.dataset.mobileTab);
    if(moreMenu) moreMenu.classList.remove('open');
  }));
  shell.querySelector('#mobile-more-btn').addEventListener('click',()=>moreMenu.classList.toggle('open'));
  document.addEventListener('click', e=>{
    if(moreMenu && !moreMenu.contains(e.target) && !shell.querySelector('#mobile-more-btn').contains(e.target)) moreMenu.classList.remove('open');
  });
}
/* ============ الساعة الرقمية أعلى الصفحة ============ */
let clockInterval = null;
function startDigitalClock(elm){
  if(clockInterval) clearInterval(clockInterval);
  function tick(){
    const c = cairoNow();
    const period = c.hour < 12 ? 'ص' : 'م';
    let h12 = c.hour % 12; if(h12===0) h12=12;
    const pad = n=> String(n).padStart(2,'0');
    const today = todayCairoStr();
    const dateLbl = new Intl.DateTimeFormat('ar-EG-u-nu-latn',{timeZone:'Africa/Cairo', weekday:'long', day:'2-digit', month:'2-digit'}).format(new Date(today+'T12:00:00'));
    elm.innerHTML = `<span class="dc-date">${esc(dateLbl)}</span><span class="dc-time">${pad(h12)}:${pad(c.minute)}:${pad(c.second)}</span><span class="dc-period">${period}</span>`;
  }
  tick();
  clockInterval = setInterval(tick, 1000);
}

  const uid = currentUser.uid;
  const badge = bellWrap.querySelector('.notif-badge');
  const audiences = isAdmin ? ['all', uid, 'admins'] : ['all', uid];
  const q = query(collection(db,'notifications'), where('audience','in',audiences), orderBy('createdAt','desc'), limit(30));
  notifUnsub = onSnapshot(q, qs=>{
    notifCache = [];
    qs.forEach(d=> notifCache.push({id:d.id, ...d.data()}));
    const unread = notifCache.filter(n=> !(n.readBy||[]).includes(uid)).length;
    if(badge){
      if(unread>0){ badge.style.display='flex'; badge.textContent = unread>9?'9+':unread; }
      else badge.style.display='none';
    }
    if(!_notifFirstLoad && unread>_notifPrevUnread) playNotifSound();
    _notifFirstLoad = false;
    _notifPrevUnread = unread;
    renderNotifList(bellWrap);
  }, err=> console.error(err));
}
/* إرسال إشعار — audience: 'all' للجميع، 'admins' لكل المديرين، أو uid لموظف محدد */
async function pushNotification(audience, title, body){
  try{
    await setDoc(doc(collection(db,'notifications')), {
      audience, title, body: body||'', readBy: [], createdAt: serverTimestamp()
    });
  }catch(err){ console.error('notif error', err); }
}
async function pushNotifications(audiences, title, body){
  for(const a of audiences){ await pushNotification(a, title, body); }
}
function renderNotifList(bellWrap){
  const listBox = bellWrap.querySelector('.nd-list');
  if(!listBox) return;
  const uid = currentUser.uid;
  if(notifCache.length===0){
    listBox.innerHTML = `<div class="notif-empty">لا توجد إشعارات حتى الآن</div>`;
    return;
  }
  listBox.innerHTML = notifCache.map(n=>{
    const isUnread = !(n.readBy||[]).includes(uid);
    return `<div class="notif-item ${isUnread?'unread':''}">
      <div class="ni-title">${esc(n.title||'')}</div>
      ${n.body ? `<div class="ni-body">${esc(n.body)}</div>` : ''}
      <div class="ni-time">${fmtDateTime(n.createdAt)}</div>
    </div>`;
  }).join('');
}
function toggleNotifDropdown(bellWrap){
  const dd = bellWrap.querySelector('.notif-dropdown');
  const opening = dd.style.display==='none' || !dd.style.display;
  dd.style.display = opening ? 'block' : 'none';
  if(opening){
    const uid = currentUser.uid;
    const unread = notifCache.filter(n=> !(n.readBy||[]).includes(uid));
    unread.forEach(n=>{
      updateDoc(doc(db,'notifications', n.id), { readBy: arrayUnion(uid) }).catch(e=>console.error(e));
    });
  }
}

function switchTab(tab, opts){
  const prevTab = activeTab;
  killNavLayers('sub');
  if(navReady && !(opts&&opts.silent) && tab!==prevTab){
    pushNavLayer(()=> switchTab(prevTab,{silent:true}), 'tab');
  }
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.mobile-nav-btn[data-mobile-tab]').forEach(b=> b.classList.toggle('active', b.dataset.mobileTab===tab));
  document.querySelectorAll('.mobile-more-item[data-mobile-tab]').forEach(b=> b.classList.toggle('active', b.dataset.mobileTab===tab));
  const content = document.getElementById('tab-content');
  if(!content) return;
  content.innerHTML = '';
  clearSubs();
  if(tab==='home') renderHomeTab(content);
  else if(tab==='mine') renderMyRequests(content);
  else if(tab==='done') renderDoneSection(content);
  else if(tab==='my-tasks') renderMyTasks(content);
  else if(tab==='admin-dashboard') renderAdminDashboard(content);
  else if(tab==='admin-daily'){
    const f = pendingReportFilter; pendingReportFilter = null;
    renderAdminDailyReport(content, f);
  }
  else if(tab==='admin-upload') renderAdminUpload(content);
  else if(tab==='admin-done') renderDoneSection(content);
  else if(tab==='admin-tasks') renderAdminTasks(content);
  else if(tab==='admin-achievements') renderAdminAchievements(content);
  else if(tab==='performance') renderPerformanceTab(content);
  else if(tab==='admin-employees') renderAdminEmployees(content);
  else if(tab==='projects') renderProjectsTab(content);
  else if(tab==='messages') renderMessagesTab(content);
}

    if(newPw.length<6){ errBox.textContent='كلمة المرور الجديدة 6 خانات على الأقل'; errBox.style.display='block'; return; }
    if(newPw!==newPw2){ errBox.textContent='كلمتا المرور غير متطابقتين'; errBox.style.display='block'; return; }
    const btn = content.querySelector('#pw-save-btn');
    btn.disabled=true; btn.textContent='جارِ التغيير...';
    try{
      const cred = EmailAuthProvider.credential(currentUser.email, oldPw);
      await reauthenticateWithCredential(currentUser, cred);
      await updatePassword(currentUser, newPw);
      toast('تم تغيير كلمة المرور', 'ok');
      content.querySelector('#pw-old').value='';
      content.querySelector('#pw-new').value='';
      content.querySelector('#pw-new2').value='';
    }catch(err){
      console.error(err);
      errBox.textContent = authErrMsg((err&&err.code)||'');
      errBox.style.display='block';
    }
    btn.disabled=false; btn.textContent='تغيير كلمة المرور';
  });
}

          <div class="stat-box" style="background:var(--bad-bg);"><div class="num" id="m-absent" style="color:var(--bad);">0</div><div class="lbl">أيام الغياب</div></div>

        <thead><tr><th>التاريخ</th><th>الحالة</th><th>الحضور</th><th>الانصراف</th><th>المهام المنجزة</th><th>ملاحظات</th></tr></thead>

      </table></div>
    </div>
   </div>
  `));

  /* بطاقة اليوم + نوتة المهام */
  const unsub = onSnapshot(doc(db,'attendance',docId), (snap)=>{
    const data = snap.exists()?snap.data():null;
    renderTodayCard(document.getElementById('today-body'), data, docId, today);
    renderTasksCard(data, docId);
  }, err=>console.error(err));
  unsubList.push(unsub);

  /* سجل كل الأيام */
  let records = {};
  const q = query(collection(db,'attendance'), where('uid','==',uid));
  const unsub2 = onSnapshot(q, (qs)=>{
    records = {};
    qs.forEach(d=>{ const r=d.data(); if(r && r.date) records[r.date]=r; });
    drawStats(); drawTable();
  }, err=>{
    console.error(err);
    const tb = document.getElementById('history-body');
    if(tb) tb.innerHTML = `<tr><td colspan="6" class="muted">تعذر تحميل السجل — حدّث الصفحة وحاول مرة أخرى</td></tr>`;
  });
  unsubList.push(unsub2);

  function firstDateStr(){
    const ds = Object.keys(records).sort();
    let start = ds.length ? ds[0] : today;
    const c = currentEmployee && currentEmployee.createdAt;
    if(c){
      const d = c.toDate ? c.toDate() : new Date(c);
      const cd = new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
      if(cd && cd < start) start = cd;
    }
    return start;
  }

  function statusOf(ds){
    const rec = records[ds];
    if(rec && rec.checkIn){
      const t = cairoHM(rec.checkIn);
      const late = t && ((t.h>WORK_START_HOUR) || (t.h===WORK_START_HOUR && t.m>0));
      return late ? 'late' : 'present';
    }
    const now = cairoNow();
    if(ds===today && now.hour<WORK_START_HOUR) return 'pending';
    return 'absent';
  }

  function drawStats(){
    const monthEl = document.getElementById('att-month');
    if(!monthEl) return;
    const m = monthEl.value || curMonth;
    const {first,last} = monthBounds(m, today);
    const days = workDaysBetween(first, last);
    let present=0, absent=0, late=0, early=0;
    days.forEach(ds=>{
      const st = statusOf(ds);
      if(st==='present') present++;
      else if(st==='late'){ late++; present++; }
      else if(st==='absent') absent++;
      if(isEarlyLeave(records[ds])) early++;
    });
    document.getElementById('m-present').textContent = present;
    document.getElementById('m-absent').textContent = absent;
    document.getElementById('m-late').textContent = late;
    document.getElementById('m-early').textContent = early;
    document.getElementById('m-note').textContent = days.length
      ? `عدد أيام العمل بالشهر حتى الآن: ${days.length} يوم (بدون الجمعة والسبت) — أيام التأخير محسوبة ضمن أيام الحضور`
      : 'لا توجد أيام عمل محتسبة في هذا الشهر بعد';
  }

  function drawTable(){
    const tbody = document.getElementById('history-body');
    if(!tbody) return;
    const dateFilter = document.getElementById('att-date').value;
    const statusFilter = document.getElementById('att-status').value;

    let days = workDaysBetween(firstDateStr(), today);
    Object.keys(records).forEach(ds=>{ if(ds<=today && !days.includes(ds)) days.push(ds); });
    days = [...new Set(days)].sort().reverse();

    let rows = days.map(ds=>({date:ds, rec:records[ds], status:statusOf(ds)}));
    if(dateFilter) rows = rows.filter(r=> r.date===dateFilter);
    if(statusFilter==='early') rows = rows.filter(r=> isEarlyLeave(r.rec));
    else if(statusFilter!=='all') rows = rows.filter(r=> r.status===statusFilter);

    if(rows.length===0){
      tbody.innerHTML = `<tr><td colspan="6" class="muted">لا توجد نتائج مطابقة</td></tr>`;
      return;
    }
    const lbl = {present:'حاضر', late:'حاضر (متأخر)', absent:'غائب', pending:'لم يحضر بعد'};
    const pill = {present:'pill-good', late:'pill-warn', absent:'pill-bad', pending:'pill-neutral'};
    tbody.innerHTML = rows.map(r=>{
      const taskCount = r.rec && r.rec.tasks ? r.rec.tasks.length : 0;
      const tot = tasksTotalCount(r.rec && r.rec.tasks);
      const notes = [];
      if(isEarlyLeave(r.rec)) notes.push(`<span class="status-pill pill-warn">انصراف مبكر</span>`);
      if(r.rec && r.rec.earlyLeaveReason) notes.push(esc(r.rec.earlyLeaveReason));
      if(r.rec && r.rec.absenceReason) notes.push('سبب الغياب: ' + esc(r.rec.absenceReason));
      return `<tr>
        <td>${fmtDate(r.date)}</td>
        <td><span class="status-pill ${pill[r.status]}">${lbl[r.status]}</span></td>
        <td>${fmtTime(r.rec && r.rec.checkIn)}</td>
        <td>${fmtTime(r.rec && r.rec.checkOut)}</td>
        <td>${taskCount ? `<button class="link-btn day-tasks-btn" data-date="${r.date}">${taskCount} مهمة${tot?` • عدد ${tot}`:''}</button>` : '<span class="muted">—</span>'}</td>
        <td>${notes.length ? notes.join(' ') : '<span class="muted">—</span>'}</td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('.day-tasks-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const rec = records[b.dataset.date] || {};
        showTasksModal(currentEmployee.name + ' — ' + fmtDate(b.dataset.date), rec.tasks||[], rec.earlyLeaveReason);
      });
    });
  }

  content.querySelector('#att-month').addEventListener('change', drawStats);
  content.querySelector('#att-date').addEventListener('change', drawTable);
  content.querySelector('#att-status').addEventListener('change', drawTable);
  content.querySelector('#att-clear').addEventListener('click', ()=>{
    content.querySelector('#att-date').value = '';
    content.querySelector('#att-status').value = 'all';
    drawTable();
  });
}

/* ============ مودال الانصراف — يعتمد على مهام النوتة المحفوظة ============ */
function openCheckoutModal(docId, savedTasks){
  const saved = Array.isArray(savedTasks) ? savedTasks : [];
  const now = cairoNow();
  const isEarly = (now.hour < 16);
  const total = tasksTotalCount(saved);
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>تسجيل الانصراف</h3>
        <div class="modal-sub">الوقت الآن (بتوقيت القاهرة): ${String(now.hour).padStart(2,'0')}:${String(now.minute).padStart(2,'0')}</div>
        <div class="motiv-banner">
          <div class="mb-emoji">${saved.length>=DAILY_TASK_GOAL?'🏆':(saved.length?'💪':'📝')}</div>
          <div style="flex:1;min-width:0;">
            <div class="mb-title">${saved.length ? `أنجزت اليوم ${saved.length} مهمة${total?` بإجمالي عدد ${total}`:''}` : 'لم تسجل أي مهمة اليوم'}</div>
            <div class="mb-sub">${saved.length ? 'كل المهام المحفوظة هتتسجل تلقائيًا مع انصرافك — شكرًا لمجهودك 🌟' : 'اكتب مهمة واحدة على الأقل قبل الانصراف'}</div>
          </div>
        </div>
        ${saved.length ? `<div class="field"><label>مهام اليوم المحفوظة</label>${saved.map((t,i)=>`
          <div class="saved-task">
            <div class="st-num">${i+1}</div>
            <div class="st-text">${esc(t.text||'')}</div>
            ${(t.count!==undefined&&t.count!==null&&t.count!=='')?`<div class="st-count">عدد ${esc(t.count)}</div>`:''}
            <div class="st-time">${t.at?fmtTime(t.at):''}</div>
          </div>`).join('')}</div>` : ''}
        ${isEarly ? `
          <div class="field">
            <label>⚠️ أنت تنصرف قبل الساعة 4 عصرًا — من فضلك اكتب سبب الانصراف المبكر *</label>
            <textarea id="early-reason" placeholder="اكتب السبب هنا..."></textarea>
          </div>` : ``}
        <div class="field">
          <label>إضافة مهام أخيرة قبل الانصراف (اختياري)</label>
          <div id="tasks-list"></div>
          <button class="btn btn-outline btn-sm" id="add-task-btn" type="button">+ إضافة مهمة أخرى</button>
        </div>
        <div class="error-text" id="checkout-err" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="cancel-checkout-btn">إلغاء</button>
          <button class="btn btn-primary" id="confirm-checkout-btn">تأكيد الانصراف</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);

  const tasksList = overlay.querySelector('#tasks-list');
  function addTaskRow(){
    const row = el(`<div class="task-input-row">
      <input type="text" class="task-input" placeholder="اكتب المهمة...">
      <input type="text" class="task-count" placeholder="العدد" style="flex:none;width:80px;text-align:center;">
      <button type="button" class="remove-x">×</button>
    </div>`);
    row.querySelector('.remove-x').addEventListener('click', ()=> row.remove());
    tasksList.appendChild(row);
  }
  addTaskRow();

  overlay.querySelector('#add-task-btn').addEventListener('click', ()=> addTaskRow());
  overlay.querySelector('#cancel-checkout-btn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#confirm-checkout-btn').addEventListener('click', async ()=>{
    const errBox = overlay.querySelector('#checkout-err');
    errBox.style.display='none';
    const reasonEl = overlay.querySelector('#early-reason');
    const reason = reasonEl ? reasonEl.value.trim() : '';
    if(isEarly && !reason){ errBox.textContent='من فضلك اكتب سبب الانصراف المبكر'; errBox.style.display='block'; return; }
    const extra = [...overlay.querySelectorAll('#tasks-list .task-input-row')].map(r=>{
      const text = r.querySelector('.task-input').value.trim();
      const cnt = normalizeDigits(r.querySelector('.task-count').value).trim();
      if(!text) return null;
      const o = {text, at: Timestamp.fromMillis(nowMs())};
      if(cnt!=='' && !isNaN(Number(cnt))) o.count = Number(cnt);
      return o;
    }).filter(Boolean);
    if(saved.length===0 && extra.length===0){
      errBox.textContent='من فضلك سجّل مهمة واحدة على الأقل قبل الانصراف';
      errBox.style.display='block';
      return;
    }
    const btn = overlay.querySelector('#confirm-checkout-btn');
    btn.disabled=true; btn.textContent='جارِ الحفظ...';
    try{
      await updateDoc(doc(db,'attendance',docId), {
        checkOut: serverTimestamp(),
        earlyLeaveReason: isEarly ? reason : null,
        tasks: [...saved, ...extra]
      });
      toast(`تم تسجيل الانصراف — تم حفظ ${saved.length+extra.length} مهمة لليوم 👏`, 'ok');
      overlay.remove();
    }catch(err){
      console.error(err);
      errBox.textContent='حدث خطأ أثناء الحفظ، حاول مرة أخرى';
      errBox.style.display='block';
      btn.disabled=false; btn.textContent='تأكيد الانصراف';
    }
  });
}
