/* ============ قسم المراسلات ============ */
let msgActiveConvId = null;
let msgConvUnsub = null;
let msgThreadUnsub = null;
let msgConvCache = {};
let msgConvList = [];
let msgConvListRenderCb = null;
let msgWatcherUnsubs = [];
let msgWatcherFirstLoad = true;

/* إجمالي عدد الرسائل غير المقروءة لكل محادثة/عبر كل المحادثات (لعرض شارة الأرقام مثل واتساب) */
function convUnreadCount(conv){
  const uid = currentUser.uid;
  if(conv.type==='group' && !(conv.members||[]).includes(uid)) return 0;
  const uc = conv.unreadCounts && conv.unreadCounts[uid];
  if(typeof uc === 'number' && uc>=0) return uc;
  return convUnreadFlag(conv) ? 1 : 0; // احتياط للمحادثات القديمة قبل إضافة العداد
}
function totalUnreadMessages(){
  return msgConvList.reduce((s,c)=> s + convUnreadCount(c), 0);
}
function messageTimestampMs(value){
  if(!value) return 0;
  if(typeof value.toMillis==='function') return value.toMillis();
  if(typeof value.seconds==='number') return value.seconds*1000;
  return 0;
}
function updateMessagesTabBadge(){
  const n = totalUnreadMessages();
  document.querySelectorAll('.messages-tab-badge').forEach(b=>{
    if(n>0){ b.style.display='inline-flex'; b.textContent = n>99?'99+':String(n); }
    else b.style.display='none';
  });
  document.querySelectorAll('.message-alert-badge').forEach(b=>{
    if(n>0){ b.style.display='flex'; b.textContent=n>99?'99+':String(n); }
    else b.style.display='none';
  });
}
let messagePopupTimer = null;
function showMessageAlertPopup(conv){
  const popup = document.querySelector('.message-alert-popup');
  if(!popup || !conv) return;
  const title = convOtherName(conv);
  const body = conv.lastMessageText || (conv.lastMessageAttachment ? '📎 مرفق جديد' : 'رسالة جديدة');
  popup.innerHTML = `<div class="map-title">💬 رسالة جديدة من ${esc(title)}</div><div class="map-body">${esc(body)}</div><div class="map-hint">اضغط لفتح المراسلات</div>`;
  popup.style.display='block';
  clearTimeout(messagePopupTimer);
  messagePopupTimer = setTimeout(()=>{ popup.style.display='none'; }, 7000);
  popup.onclick = ()=>{
    popup.style.display='none';
    clearTimeout(messagePopupTimer);
    switchTab('messages');
  };
}
/* مراقبة دائمة لكل المحادثات طول الجلسة (وليس فقط أثناء فتح تبويب المراسلات) —
   عشان شارة عدد الرسائل تفضل محدثة وعشان صوت التنبيه يشتغل حتى لو المستخدم في تبويب تاني */
function startMessagesWatcher(){
  msgWatcherUnsubs.forEach(u=>{ try{u();}catch(e){} });
  msgWatcherUnsubs = [];
  msgWatcherFirstLoad = true;
  const uid = currentUser.uid;
  let rows1 = [], rows2 = [], rows3 = [];
  let initialSnapshots = 0;
  function merge(){
    const map = {};
    [...rows3, ...rows1, ...rows2].forEach(r=> map[r.id]=r);
    msgConvCache = map;
    const oldTotal = totalUnreadMessages();
    msgConvList = Object.values(map).sort((a,b)=>
      (messageTimestampMs(b.lastMessageAt)||messageTimestampMs(b.createdAt)) -
      (messageTimestampMs(a.lastMessageAt)||messageTimestampMs(a.createdAt))
    );
    const newTotal = totalUnreadMessages();
    updateMessagesTabBadge();
    if(msgConvListRenderCb) msgConvListRenderCb();
    if(initialSnapshots < 2){
      initialSnapshots++;
      if(initialSnapshots===2) msgWatcherFirstLoad = false;
    }else if(newTotal>oldTotal){
      showMessageAlertPopup(msgConvList[0]);
      playNotifSound();
      msgWatcherFirstLoad = false;
    }
  }
  const q1 = query(collection(db,'conversations'), where('members','array-contains', uid));
  const q2 = query(collection(db,'conversations'), where('type','==','broadcast'));
  msgWatcherUnsubs.push(onSnapshot(q1, qs=>{ rows1 = qs.docs.map(d=>({id:d.id,...d.data()})); merge(); }, err=>console.error(err)));
  msgWatcherUnsubs.push(onSnapshot(query(collection(db,'conversations'), where('type','==','group')), qs=>{ rows3 = qs.docs.map(d=>({id:d.id,...d.data()})); merge(); }, err=>console.error(err)));
  msgWatcherUnsubs.push(onSnapshot(q2, qs=>{ rows2 = qs.docs.map(d=>({id:d.id,...d.data()})); merge(); }, err=>console.error(err)));
}

function convOtherName(conv){
  if(conv.type==='broadcast') return '📢 رسالة جماعية للجميع';
  if(conv.type==='group') return conv.title || 'مجموعة';
  const otherUid = (conv.members||[]).find(u=>u!==currentUser.uid);
  return otherUid ? empName(otherUid) : (conv.title||'محادثة');
}
function convAvatarHTML(conv){
  if(conv.type==='group') return '👥';
  if(conv.type==='broadcast') return '📢';
  const o=(conv.members||[]).find(u=>u!==currentUser.uid);
  return avatarInner(o, convAvatarLetter(conv));
}
function convAvatarLetter(conv){
  if(conv.type==='broadcast') return '📢';
  if(conv.type==='group') return (conv.title||'م')[0];
  return (convOtherName(conv)||'؟')[0];
}
function convUnreadFlag(conv){
  const uid = currentUser.uid;
  if(conv.type==='group' && !(conv.members||[]).includes(uid)) return false;
  if(!conv.lastMessageAt || conv.lastMessageBy===uid) return false;
  const lastRead = conv.lastReadAt && conv.lastReadAt[uid];
  if(!lastRead) return true;
  const lastReadMs = lastRead.toMillis ? lastRead.toMillis() : 0;
  const lastMsgMs = conv.lastMessageAt.toMillis ? conv.lastMessageAt.toMillis() : 0;
  return lastMsgMs > lastReadMs;
}
function isImageAttachment(message){
  return !!message.attachmentUrl && (
    String(message.attachmentType||'').startsWith('image/') ||
    /\.(png|jpe?g|gif|webp|bmp|svg)(\?|$)/i.test(message.attachmentName||message.attachmentUrl)
  );
}
function attachmentViewUrl(message){
  if(message.provider==='google-drive' && message.attachmentPath && isImageAttachment(message)){
    return `https://drive.google.com/thumbnail?id=${encodeURIComponent(message.attachmentPath)}&sz=w1200`;
  }
  return message.attachmentUrl;
}
async function markConversationRead(convId){
  try{ await updateDoc(doc(db,'conversations',convId), { [`lastReadAt.${currentUser.uid}`]: serverTimestamp(), [`unreadCounts.${currentUser.uid}`]: 0 }); }
  catch(err){ console.error(err); }
}
async function sendConversationMessage(conv, text, file){
  const att = file ? await uploadTaskAttachment(file, 'messageAttachments') : {url:null,name:null,path:null};
  await setDoc(doc(collection(db,'messages')), {
    conversationId: conv.id, senderUid: currentUser.uid, senderName: currentEmployee.name||'',
    text, attachmentUrl: att.url, attachmentName: att.name, attachmentType: att.type||file?.type||null, attachmentPath: att.path, provider: att.provider||null,
    attachmentOwnerUid: currentUser.uid, attachmentAddedAt: serverTimestamp(),
    createdAt: serverTimestamp()
  });
  const recipients = conv.type==='broadcast'
    ? Object.keys(employeesCache).filter(u=>u!==currentUser.uid)
    : (conv.members||[]).filter(u=>u!==currentUser.uid);
  const updatePayload = {
    lastMessageAt: serverTimestamp(), lastMessageText: text||'', lastMessageBy: currentUser.uid,
    lastMessageAttachment: !!att.url, [`lastReadAt.${currentUser.uid}`]: serverTimestamp()
  };
  recipients.forEach(u=>{ updatePayload[`unreadCounts.${u}`] = increment(1); });
  await updateDoc(doc(db,'conversations',conv.id), updatePayload);
  await pushNotifications(conv.type==='broadcast' ? ['all'] : recipients, `💬 رسالة من ${currentEmployee.name||''}`, text || '📎 مرفق');
}
async function findOrCreateDirectConversation(otherUid){
  const uid = currentUser.uid;
  const qs = await getDocs(query(collection(db,'conversations'), where('type','==','direct'), where('members','array-contains', uid)));
  let found = null;
  qs.forEach(d=>{
    const data = d.data();
    if((data.members||[]).includes(otherUid) && data.members.length===2) found = d.id;
  });
  if(found) return found;
  const ref2 = doc(collection(db,'conversations'));
  await setDoc(ref2, {
    type:'direct', members:[uid, otherUid],
    createdBy: uid, createdByName: currentEmployee.name||'',
    createdAt: serverTimestamp(), lastMessageAt: null, lastMessageText:'',
    lastReadAt:{[uid]: serverTimestamp()}
  });
  return ref2.id;
}

  function threadHeaderHTML(conv){
    let sub = '';

    else if(conv.type==='broadcast') sub = 'رسالة جماعية تصل لجميع الموظفين';

      </div>
      ${conv.type==='group'?`<button class="btn btn-outline btn-sm" id="group-members-btn" title="أعضاء المجموعة">👥 الأعضاء</button>${(isAdmin||conv.createdBy===currentUser.uid)?'<button class="btn btn-outline btn-sm" id="add-group-member-btn" title="إضافة عضو للجروب">➕ عضو</button>':''}`:''}
    `;
  }

  function bindThreadHeaderActions(conv){
    const membersBtn = container.querySelector('#group-members-btn');
    if(membersBtn) membersBtn.addEventListener('click', ()=>openGroupMembersModal(container, conv));
    const addBtn = container.querySelector('#add-group-member-btn');
    if(addBtn) addBtn.addEventListener('click', ()=>openAddGroupMemberModal(container, conv));
  }

  function refreshThreadIfOpen(conv){
    const hdr = container.querySelector('#thread-header');
    if(hdr){ hdr.innerHTML = threadHeaderHTML(conv); bindThreadHeaderActions(conv); }
    const msgsBox = container.querySelector('#thread-messages');
    if(msgsBox && msgsBox.dataset.lastMsgs){
      try{ drawMessages(JSON.parse(msgsBox.dataset.lastMsgs), conv); }catch(e){}
    }
  }

  function drawMessages(msgs, conv){
    const box = container.querySelector('#thread-messages');
    if(!box) return;
    const uid2 = currentUser.uid;
    if(msgs.length===0){ box.innerHTML = `<div class="empty-state"><div class="emoji">💬</div>ابدأ المحادثة بإرسال أول رسالة</div>`; return; }
    const lastReadMap = conv.lastReadAt || {};
    const otherUids = (conv.members||[]).filter(u=>u!==uid2);
    box.innerHTML = msgs.map(m=>{
      const mine = m.senderUid===uid2;
      const canDelete = isAdmin || mine;
      let readTick = '';
      let readers = [];
      if(mine && conv.type!=='broadcast'){
        const msgMs = m.createdAtMs || 0;
        readers = msgMs ? otherUids.map(readerUid=>({
          uid:readerUid,
          time:lastReadMap[readerUid]
        })).filter(reader=>reader.time && reader.time.toMillis && reader.time.toMillis() >= msgMs) : [];
        const allRead = otherUids.length>0 && otherUids.every(u=>{
          const r = lastReadMap[u];
          return r && r.toMillis && r.toMillis() >= msgMs;
        });
        readTick = msgMs ? (allRead ? ' ✓✓' : ' ✓') : '';
      }
      return `<div class="msg-bubble-row ${mine?'mine':'theirs'}">
        <div class="msg-bubble ${mine?'mine':'theirs'}">
          ${(!mine && (conv.type==='group'||conv.type==='broadcast')) ? `<div class="msg-sender">${esc(m.senderName||'')}</div>` : ''}
          ${m.text?`<div>${esc(m.text).replace(/\n/g,'<br>')}</div>`:''}
          ${isImageAttachment(m)
            ? `<a href="${esc(m.attachmentUrl)}" target="_blank" rel="noopener"><img class="msg-image-attach" src="${esc(attachmentViewUrl(m))}" alt="${esc(m.attachmentName||'صورة مرفقة')}" loading="lazy"></a>`
            : (m.attachmentUrl ? `<a class="msg-attach" href="${esc(m.attachmentUrl)}" target="_blank" rel="noopener" style="color:${mine?'#fff':'var(--accent)'};">📎 ${esc(m.attachmentName||'مرفق')}</a>` : '')}
          <div class="msg-time">${m.timeLabel||''}${readTick}</div>
          ${mine&&conv.type!=='broadcast'?`<button class="msg-readers-btn" data-message-id="${esc(m.id)}">👁 ${readers.length?`شاهده ${readers.length}`:'لم يشاهده أحد'}</button>`:''}
          ${canDelete?`<button class="msg-delete-btn" data-message-id="${esc(m.id)}" title="حذف الرسالة">حذف</button>`:''}
        </div>
      </div>`;
    }).join('');
    box.querySelectorAll('.msg-delete-btn').forEach(btn=>btn.addEventListener('click',()=>deleteConversationMessage(btn.dataset.messageId)));
    box.querySelectorAll('.msg-readers-btn').forEach(btn=>btn.addEventListener('click',()=>{
      const message = msgs.find(item=>item.id===btn.dataset.messageId);
      if(!message) return;
      const messageMs = message.createdAtMs || 0;
      const readers = messageMs ? otherUids.map(readerUid=>({uid:readerUid,time:lastReadMap[readerUid]})).filter(reader=>reader.time && reader.time.toMillis && reader.time.toMillis()>=messageMs) : [];
      openMessageReadersModal(conv,message,readers);
    }));
    box.scrollTop = box.scrollHeight;
  }

  async function deleteConversationMessage(messageId){
    if(!messageId || !confirm('حذف هذه الرسالة؟')) return;
    try{ await deleteDoc(doc(db,'messages',messageId)); toast('تم حذف الرسالة','ok'); }
    catch(error){ console.error(error); toast('تعذر حذف الرسالة، تحقق من قواعد Firestore','err'); }
  }

  let convLayer = null;
  function closeThread(){
    msgActiveConvId = null;
    convLayer = null;
    const sh = container.querySelector('#msg-shell');
    if(sh) sh.classList.remove('thread-open');
    const pn = container.querySelector('#msg-thread-pane');
    if(pn) pn.innerHTML='<div class="empty-state" style="margin:auto;"><div class="emoji">💬</div>اختر محادثة من القائمة أو ابدأ محادثة جديدة</div>';
    drawConvList();
  }
  function openConversation(id){
    msgActiveConvId = id;
    const shellEl = container.querySelector('#msg-shell');
    if(shellEl && !shellEl.classList.contains('thread-open')) convLayer = pushNavLayer(closeThread, 'sub');
    if(shellEl) shellEl.classList.add('thread-open');
    drawConvList();
    const conv = msgConvCache[id];
    if(!conv) return;
    const pane = container.querySelector('#msg-thread-pane');
    const canSend = !(conv.type==='broadcast' && !isAdmin);
    pane.innerHTML = `
      <div id="thread-header" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);">${threadHeaderHTML(conv)}</div>
      <div id="thread-messages" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;"><div class="muted">جارِ التحميل...</div></div>
      ${canSend ? `
      <div id="thread-input-wrap" style="border-top:1px solid var(--border);padding:10px 12px;">
        <div id="thread-attach-preview" style="display:none;font-size:12px;color:var(--sub);margin-bottom:6px;"></div>
        <div style="display:flex;gap:8px;align-items:flex-end;">
          <label class="icon-btn" style="cursor:pointer;" title="إرفاق ملف">📎<input type="file" id="thread-file" style="display:none;"></label>
          <textarea id="thread-text" placeholder="اكتب رسالتك..." rows="1" style="flex:1;min-height:42px;padding:11px 14px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;resize:none;max-height:120px;background:#fbfcfe;font-family:inherit;line-height:1.4;"></textarea>
          <button class="btn btn-primary btn-sm btn-auto" id="thread-send-btn">إرسال</button>
        </div>
      </div>` : `<div class="small-note" style="margin:12px;">هذه رسالة جماعية من الإدارة — لا يمكن الرد عليها هنا</div>`}
    `;
    bindThreadHeaderActions(conv);
    const backButton = pane.querySelector('#msg-back-btn');
    if(backButton) backButton.onclick = ()=> closeNavLayer(convLayer, closeThread);

    if(canSend){
      const ta = pane.querySelector('#thread-text');
      const fileInp = pane.querySelector('#thread-file');
      const preview = pane.querySelector('#thread-attach-preview');
      ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(120,ta.scrollHeight)+'px'; });
      ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); } });
      fileInp.addEventListener('change', ()=>{
        preview.style.display = fileInp.files[0] ? 'block' : 'none';
        preview.textContent = fileInp.files[0] ? `📎 ${fileInp.files[0].name}` : '';
      });
      pane.querySelector('#thread-send-btn').addEventListener('click', doSend);
      async function doSend(){
        const text = ta.value.trim();
        const file = fileInp.files[0];
        if(!text && !file) return;
        const btn = pane.querySelector('#thread-send-btn');
        btn.disabled=true; btn.textContent='...';
        try{
          await sendConversationMessage(conv, text, file);
          ta.value=''; ta.style.height='auto'; fileInp.value=''; preview.style.display='none';
        }catch(err){ console.error(err); toast('تعذر إرسال الرسالة', 'err'); }
        btn.disabled=false; btn.textContent='إرسال';
        ta.focus();
      }
    }

    const mq = query(collection(db,'messages'), where('conversationId','==',id), orderBy('createdAt','asc'));
    const mu = onSnapshot(mq, qs=>{
      const msgs = qs.docs.map(d=>{
        const data = d.data();
        const ms = data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0;
        return {id:d.id, ...data, createdAtMs: ms, timeLabel: data.createdAt ? fmtTime(data.createdAt) : ''};
      });
      const msgsBox = container.querySelector('#thread-messages');
      if(msgsBox) msgsBox.dataset.lastMsgs = JSON.stringify(msgs.map(m=>({...m, createdAt:undefined})));
      drawMessages(msgs, msgConvCache[id] || conv);
      markConversationRead(id);
    }, err=>console.error(err));
    unsubList.push(mu);
  }

  container.querySelector('#new-group-btn').addEventListener('click', ()=> openNewConversationModal(container, 'group'));
}

/* ============ مؤشرات الأداء ============ */
function renderPerformanceTab(container){
  if(!container) return;
  const today=todayCairoStr(), month=today.slice(0,7);
  container.innerHTML=`
    <div class="flex-between"><div><h2 style="margin:0;font-size:20px;">📊 مؤشرات الأداء</h2><div class="muted" style="font-size:12.5px;margin-top:4px;">تقرير الموظفين والمشاريع والالتزام بالحضور والانصراف</div></div></div>

    <div id="performance-content"><div class="muted" style="padding:20px;text-align:center;">جارِ حساب المؤشرات...</div></div>
  `;
  let employees={},attendance=[],requests=[],projects=[],projectTasks=[];
  const subscriptions=[
    onSnapshot(collection(db,'employees'),qs=>{employees={};qs.forEach(d=>employees[d.id]=d.data());fillEmployeeFilter();draw();},console.error),
    onSnapshot(collection(db,'attendance'),qs=>{attendance=qs.docs.map(d=>({id:d.id,...d.data()}));draw();},console.error),
    onSnapshot(collection(db,'tokeenRequests'),qs=>{requests=qs.docs.map(d=>({id:d.id,...d.data()}));draw();},console.error),
    onSnapshot(collection(db,'projects'),qs=>{projects=qs.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);draw();},console.error),
    onSnapshot(collection(db,'projectTasks'),qs=>{projectTasks=qs.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.active!==false);draw();},console.error)
  ];
  unsubList.push(...subscriptions);
  const employeeSelect=container.querySelector('#perf-employee');
  function fillEmployeeFilter(){
    if(!employeeSelect)return;
    const current=employeeSelect.value;
    employeeSelect.innerHTML='<option value="">كل الموظفين</option>'+Object.keys(employees).filter(uid=>employees[uid].role!=='admin').sort((a,b)=>(employees[a].name||'').localeCompare(employees[b].name||'','ar')).map(uid=>`<option value="${uid}">${esc(employees[uid].name||'غير معروف')}</option>`).join('');
    employeeSelect.value=current;
  }
  const inRange=(value,from,to)=>{const d=String(value||'');return (!from||d>=from)&&(!to||d<=to);};
  const tsDate=ts=>ts?.toDate?new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(ts.toDate()):'';
  function attendanceStatus(rec){
    if(!rec||rec.absenceReason)return 'absent';
    if(!rec.checkIn)return 'absent';
    const ci=cairoHM(rec.checkIn),co=cairoHM(rec.checkOut);
    return {present:true,late:ci&&ci.h>WORK_START_HOUR,onTimeIn:ci&&ci.h<=WORK_START_HOUR,onTimeOut:!!(co&&co.h>=16),checkIn:ci,checkOut:co};
  }
  function draw(){
    const box=container.querySelector('#performance-content');if(!box)return;
    const from=container.querySelector('#perf-from').value,to=container.querySelector('#perf-to').value,selected=employeeSelect.value;
    const staff=Object.keys(employees).filter(uid=>employees[uid].role!=='admin'&&(!selected||uid===selected));
    const dates=workDaysBetween(from,to);
    const reports=staff.map(uid=>{
      const rows=attendance.filter(a=>a.uid===uid&&inRange(a.date,from,to));
      let present=0,onTimeIn=0,onTimeOut=0,late=0,absent=0;
      dates.forEach(date=>{const rec=rows.find(a=>a.date===date),st=attendanceStatus(rec);if(st==='absent'){absent++;return;}present++;if(st.onTimeIn)onTimeIn++;else late++;if(st.onTimeOut)onTimeOut++;});
      const assigned=projectTasks.filter(t=>t.assignedUid===uid&&inRange(tsDate(t.assignedAt)||t.assignedDate,from,to));
      const completed=assigned.filter(t=>t.status==='completed').length;
      const reqs=requests.filter(r=>r.uid===uid&&inRange(r.date,from,to));
      const reqDone=reqs.filter(r=>r.done).length;
      const attendanceScore=dates.length?Math.round(((onTimeIn+onTimeOut)/(dates.length*2))*100):0;
      const taskScore=assigned.length?Math.round(completed*100/assigned.length):0;
      const overall=Math.round(attendanceScore*.45+taskScore*.35+(reqs.length?reqDone*100/reqs.length:0)*.2);
      return {uid,name:employees[uid].name||'غير معروف',dept:employees[uid].department||'',present,onTimeIn,onTimeOut,late,absent,assigned:assigned.length,completed,reqs:reqs.length,reqDone,attendanceScore,taskScore,overall,rows};
    });
    const allTasks=projectTasks.filter(t=>inRange(tsDate(t.assignedAt)||t.assignedDate,from,to));
    const projectRows=projects.map(p=>{const tasks=allTasks.filter(t=>t.projectId===p.id),done=tasks.filter(t=>t.status==='completed').length;return {...p,total:tasks.length,done,percent:tasks.length?Math.round(done*100/tasks.length):0};}).filter(p=>p.total||selected==='');
    const totalPresent=reports.reduce((s,r)=>s+r.present,0),totalOnTime=reports.reduce((s,r)=>s+r.onTimeIn+r.onTimeOut,0),possible=dates.length*reports.length*2;
    box.innerHTML=`
      <div class="performance-grid"><div class="performance-panel"><h3>👥 الموظفون</h3><div class="performance-score">${reports.length}</div><div class="muted">موظف في التقرير</div></div><div class="performance-panel"><h3>⏱ الالتزام</h3><div class="performance-score">${possible?Math.round(totalOnTime*100/possible):0}%</div><div class="muted">حضور وانصراف في الموعد</div><div class="performance-bar"><div style="width:${possible?Math.round(totalOnTime*100/possible):0}%"></div></div></div><div class="performance-panel"><h3>📁 المشاريع</h3><div class="performance-score">${projectRows.length}</div><div class="muted">مشروع ظاهر في الفترة</div></div><div class="performance-panel"><h3>📌 المهام</h3><div class="performance-score">${allTasks.filter(t=>t.status==='completed').length}/${allTasks.length}</div><div class="muted">مكتملة من الإجمالي</div></div></div>
      <div class="performance-panel"><h3>📊 مؤشرات الموظفين</h3><div class="table-wrap"><table class="sticky-table"><thead><tr><th>الموظف</th><th>الأداء العام</th><th>الالتزام</th><th>مهام المشاريع</th><th>طلبات التقنين</th><th>الحضور</th><th>تقرير</th></tr></thead><tbody>${reports.map((r,i)=>`<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc(r.dept)}</span></td><td><span class="status-pill ${r.overall>=80?'pill-good':r.overall>=50?'pill-warn':'pill-bad'}">${r.overall}%</span></td><td>${r.attendanceScore}%</td><td>${r.completed}/${r.assigned}</td><td>${r.reqDone}/${r.reqs}</td><td>حضور ${r.present}<br>تأخير ${r.late}<br>غياب ${r.absent}</td><td><button class="link-btn perf-detail-btn" data-idx="${i}">عرض التقرير</button></td></tr>`).join('')||'<tr><td colspan="7">لا توجد بيانات</td></tr>'}</tbody></table></div></div>
      <div class="performance-panel" style="margin-top:14px;"><h3>📁 مؤشرات أداء المشاريع</h3><div class="projects-grid">${projectRows.map(p=>`<div><div class="flex-between"><b>${esc(p.name)}</b><span class="status-pill ${p.percent>=80?'pill-good':p.percent>=50?'pill-warn':'pill-neutral'}">${p.percent}%</span></div><div class="muted" style="font-size:11px;margin-top:4px;">${p.done} مكتملة من ${p.total} مهمة · ${(p.memberUids||[]).length} أعضاء</div><div class="performance-bar"><div style="width:${p.percent}%"></div></div></div>`).join('')||'<div class="muted">لا توجد مهام مشاريع في الفترة</div>'}</div></div>
      <div class="performance-panel" style="margin-top:14px;"><h3>🕘 الالتزام بالحضور والانصراف</h3><div class="table-wrap"><table><thead><tr><th>الموظف</th><th>حضور في الموعد</th><th>انصراف في الموعد</th><th>التأخير</th><th>الغياب</th><th>النسبة</th></tr></thead><tbody>${reports.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.onTimeIn}</td><td>${r.onTimeOut}</td><td>${r.late}</td><td>${r.absent}</td><td><span class="status-pill ${r.attendanceScore>=80?'pill-good':r.attendanceScore>=50?'pill-warn':'pill-bad'}">${r.attendanceScore}%</span></td></tr>`).join('')}</tbody></table></div></div>`;
    box.querySelectorAll('.perf-detail-btn').forEach(btn=>btn.addEventListener('click',()=>openPerformanceEmployeeModal(reports[+btn.dataset.idx],from,to,dates)));
  }
  container.querySelector('#perf-from').addEventListener('change',draw);container.querySelector('#perf-to').addEventListener('change',draw);employeeSelect.addEventListener('change',draw);container.querySelector('#perf-refresh').addEventListener('click',draw);
}

function openPerformanceEmployeeModal(report,from,to,dates){
  const overlay=el(`<div class="modal-overlay"><div class="modal-box" style="max-width:700px;"><h3>📋 تقرير ${esc(report.name)}</h3><div class="modal-sub">${esc(report.dept)} · الفترة من ${esc(from)} إلى ${esc(to)}</div><div class="performance-grid"><div class="performance-panel"><b>الأداء العام</b><div class="performance-score">${report.overall}%</div></div><div class="performance-panel"><b>الالتزام</b><div class="performance-score">${report.attendanceScore}%</div></div><div class="performance-panel"><b>مهام المشاريع</b><div class="performance-score">${report.completed}/${report.assigned}</div></div></div><div class="table-wrap" style="max-height:52vh;"><table><thead><tr><th>التاريخ</th><th>الحضور</th><th>الانصراف</th><th>الحالة</th></tr></thead><tbody>${dates.map(date=>{const rec=report.rows.find(r=>r.date===date),st=attendanceStatus(rec);const label=st==='absent'?'غائب':st.onTimeIn?'حاضر في الموعد':'حاضر متأخر';return `<tr><td>${fmtDate(date)}</td><td>${fmtTime(rec&&rec.checkIn)}</td><td>${fmtTime(rec&&rec.checkOut)}</td><td>${label}</td></tr>`;}).join('')}</tbody></table></div><div class="modal-actions"><button class="btn btn-outline btn-block" id="perf-close">إغلاق</button></div></div></div>`);document.body.appendChild(overlay);overlay.querySelector('#perf-close').addEventListener('click',()=>overlay.remove());overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});

/* ============ مشاريع العمل ============ */
function projectStatusLabel(status){
  return ({planned:'مخطط',active:'جاري',completed:'مكتمل',paused:'متوقف',cancelled:'ملغى'}[status]||'جاري');
}
function projectTaskStatusLabel(status){
  return ({pending:'لم تبدأ',in_progress:'قيد التنفيذ',completed:'مكتملة',failed:'متعذرة'}[status]||'لم تبدأ');
}
function projectTaskStatusClass(status){
  return status==='completed' ? 'pill-good' : (status==='failed' ? 'pill-bad' : (status==='in_progress' ? 'pill-warn' : 'pill-neutral'));
}
const PROJECT_COLORS=['#0ea5a4','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#22c55e','#ef4444','#06b6d4'];
function projectColor(p){ if(p&&p.color) return p.color; let h=0; for(const ch of String(p?.id||'')) h=(h*31+ch.charCodeAt(0))>>>0; return PROJECT_COLORS[h%PROJECT_COLORS.length]; }
function canManageProject(project){
  return isAdmin || (project.managerUids||[]).includes(currentUser.uid);
}
function projectTasksStats(tasks){
  const total = tasks.length;
  const completed = tasks.filter(t=>t.status==='completed').length;
  return {total, completed, remaining:Math.max(0,total-completed), percent:total ? Math.round(completed*100/total) : 0};
}

function renderProjectsTab(container){
  if(!container) return;
  container.innerHTML = `
    <div class="flex-between" id="projects-head" style="margin-bottom:16px;">
      <div><h2 style="margin:0;font-size:20px;">📁 مشاريع العمل</h2><div class="muted" style="font-size:12.5px;margin-top:4px;">المشاريع والفرق والمهام المرتبطة بها</div></div>
      ${isAdmin ? '<button class="btn btn-primary btn-sm btn-auto" id="new-project-btn">➕ مشروع جديد</button>' : ''}
    </div>
    <div id="projects-view"><div class="muted" style="padding:20px;text-align:center;">جارِ تحميل المشاريع...</div></div>
  `;
  let projects = [], projectTasks = [], selectedId = null, projectLayer = null;
  const projectUnsub = onSnapshot(collection(db,'projects'), qs=>{
    projects = qs.docs.map(d=>({id:d.id,...d.data()}));
    projects.sort((a,b)=> ((a.order??1e9)-(b.order??1e9)) || (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    draw();
  }, err=>{ console.error(err); toast('تعذر تحميل المشاريع','err'); });
  const taskUnsub = onSnapshot(collection(db,'projectTasks'), qs=>{
    projectTasks = qs.docs.map(d=>({id:d.id,...d.data()}));
    draw();
  }, err=>{ console.error(err); toast('تعذر تحميل مهام المشاريع','err'); });
  unsubList.push(projectUnsub, taskUnsub);
  watchEmployeesCache(()=>draw());
  if(isAdmin) container.querySelector('#new-project-btn').addEventListener('click', ()=>openProjectModal());

  async function moveProject(id,dir){
    const l=visibleProjects(), i=l.findIndex(x=>x.id===id), j=i+dir;
    if(i<0||j<0||j>=l.length) return;
    [l[i],l[j]]=[l[j],l[i]];
    try{ await Promise.all(l.map((x,k)=>updateDoc(doc(db,'projects',x.id),{order:k}))); }catch(e){ console.error(e); toast('تعذر تغيير الترتيب','err'); }
  }
  function visibleProjects(){
    return projects.filter(p=>p.active!==false);

      const member=isProjectMember(p);
      return `<div class="project-wrap">${isAdmin?`<div class="project-tools"><button class="pj-tool pj-up" data-id="${p.id}" title="أعلى">▲</button><button class="pj-tool pj-dn" data-id="${p.id}" title="أسفل">▼</button><button class="pj-tool pj-edit" data-id="${p.id}" title="تعديل">✏️</button><button class="pj-tool pj-del" data-id="${p.id}" title="حذف">🗑</button></div>`:''}<article class="project-card${member?'':' project-card-locked'}" data-project-id="${p.id}" style="--pc:${projectColor(p)}" ${member?'':'title="الدخول لهذا المشروع متاح فقط لأعضائه"'}>
        <div class="project-cover${p.imageUrl?' has-img':''}"${p.imageUrl?` style="--cover-img:url('${esc(p.imageUrl)}')"`:''}>${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" onerror="this.parentNode.classList.remove('has-img');this.replaceWith(document.createTextNode('📁'))">`:'📁'}${member?'':'<span class="project-lock-badge">🔒</span>'}</div>
        <div class="project-body">

          <div class="project-desc">${esc(p.description||'لا يوجد وصف مختصر')}</div>

    const isInt=t=>t.internal||t.source==='internal';
    const mine=t=>t.assignedUid===currentUser.uid&&t.status!=='completed'&&t.status!=='failed';
    const rowHTML=t=>`<div class="project-task-row"><div class="project-task-main"><div class="project-task-title">${esc(t.title)}</div><div class="project-task-meta">${badge(t)}👤 ${esc(empName(t.assignedUid))} · ${t.dueDate?`الموعد ${esc(t.dueDate)}`:'بدون موعد'}${isInt(t)?` · من ${esc(t.assignedByName||'مسؤول المشروع')}`:''}${t.description?`<br>${esc(t.description)}`:''}${t.notes?`<br>📝 ${esc(t.notes)}`:''}${t.attachmentUrl?`<br><a class="attach-link" href="${esc(t.attachmentUrl)}" target="_blank" rel="noopener">📎 ${esc(t.attachmentName||'مرفق')}</a>`:''}</div></div><div><span class="status-pill ${projectTaskStatusClass(t.status)}">${projectTaskStatusLabel(t.status)}</span>${mine(t)?`<button class="btn btn-outline btn-sm update-project-task" data-id="${t.id}" style="margin-top:6px;">تحديث</button>`:''}</div></div>`;
    const sec=(title,arr)=>`<div class="card"><h3>${title} <span class="muted" style="font-size:11px;font-weight:400;">(${arr.length})</span></h3>${arr.length?arr.map(rowHTML).join(''):'<div class="muted">لا توجد بنود</div>'}</div>`;
    const adminT=allT.filter(t=>!isInt(t)), intT=allT.filter(isInt);
    view.innerHTML=`
      <div class="card">
        <div class="project-detail-cover${project.imageUrl?' has-img':''}"${project.imageUrl?` style="--cover-img:url('${esc(project.imageUrl)}')"`:''}>${project.imageUrl?`<img src="${esc(project.imageUrl)}" alt="" onerror="this.parentNode.classList.remove('has-img');this.replaceWith(document.createTextNode('📁'))">`:'📁'}</div>
        <div class="flex-between" style="margin-top:14px;align-items:flex-start;"><div><h2 style="margin:0 0 5px;">${esc(project.name)}</h2><div class="muted" style="font-size:12.5px;">${esc(project.description||'لا يوجد وصف')}</div></div><span class="status-pill ${project.status==='completed'?'pill-good':project.status==='paused'||project.status==='cancelled'?'pill-bad':'pill-warn'}">${projectStatusLabel(project.status)}</span></div>
        <div class="project-meta" style="margin-top:12px;"><span>بداية: ${esc(project.startDate||'—')}</span><span>نهاية: ${esc(project.endDate||'مفتوحة')}</span><span>المصدر: ${esc(project.createdByName||'الإدارة')}</span></div>
      </div>
      <div class="stat-row" style="margin-top:16px;grid-template-columns:repeat(4,1fr);"><div class="stat-box"><div class="num">${stats.total}</div><div class="lbl">إجمالي المهام</div></div><div class="stat-box"><div class="num" style="color:var(--good);">${stats.completed}</div><div class="lbl">مكتملة</div></div><div class="stat-box"><div class="num" style="color:var(--warn);">${stats.remaining}</div><div class="lbl">متبقية</div></div><div class="stat-box"><div class="num">${stats.percent}%</div><div class="lbl">نسبة الإنجاز</div></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">
        <button class="btn btn-outline" id="team-toggle" style="flex:1 1 100%;">👥 الأعضاء (${members.length})</button>
        ${isAdmin?'<button class="btn btn-primary" id="add-admin-task" style="flex:1 1 45%;">➕ إضافة تكليف من الإدارة</button>':''}
        ${manager?'<button class="btn btn-primary" id="add-internal-task" style="flex:1 1 45%;background:#7c3aed;border-color:#7c3aed;">➕ إضافة مهمة داخلية</button>':''}
      </div>
      <div class="project-panels" style="grid-template-columns:1fr;margin-top:16px;">${sec('📋 تكليفات الإدارة',adminT)}${sec('🧩 مهام داخلية',intT)}</div>
    `;
    view.querySelector('#team-toggle').addEventListener('click',()=>{
      const ov=el(`<div class="modal-overlay"><div class="modal-box" style="max-width:420px;"><h3>👥 أعضاء المشروع</h3><div style="max-height:55vh;overflow-y:auto;">${members.length?members.map(uid=>`<div class="project-member-row"><div><div class="project-member-name">${esc(empName(uid))}</div>${(project.managerUids||[]).includes(uid)?'<span class="status-pill pill-warn" style="font-size:10px;margin-top:3px;">مسؤول مشروع</span>':''}<div class="project-task-meta">${allT.filter(t=>t.assignedUid===uid).length} مهمة مسندة</div></div></div>`).join(''):'<div class="muted">لا يوجد أعضاء</div>'}</div><div class="modal-actions"><button class="btn btn-outline" id="team-close">خروج</button></div></div></div>`);
      document.body.appendChild(ov);
      ov.querySelector('#team-close').addEventListener('click',()=>ov.remove());
      ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    });
    if(isAdmin) view.querySelector('#add-admin-task').addEventListener('click',()=>openProjectTaskModal(project,'admin'));
    if(manager) view.querySelector('#add-internal-task').addEventListener('click',()=>openProjectTaskModal(project,'internal'));
    view.querySelectorAll('.update-project-task').forEach(btn=>btn.addEventListener('click',()=>openProjectTaskUpdateModal(allT.find(t=>t.id===btn.dataset.id))));
  }
}

function openProjectModal(project=null){
  const allEmps=Object.keys(employeesCache).filter(uid=>employeesCache[uid].role!=='admin').sort((a,b)=>empName(a).localeCompare(empName(b),'ar'));
  const members=new Set(project?.memberUids||[]), managers=new Set(project?.managerUids||[]);
  const curColor=project?projectColor(project):PROJECT_COLORS[Math.floor(Math.random()*PROJECT_COLORS.length)];
  const overlay=el(`<div class="modal-overlay"><div class="modal-box" style="max-width:620px;"><h3>${project?'✏️ تعديل المشروع':'➕ إنشاء مشروع جديد'}</h3><div class="field"><label>اسم المشروع *</label><input id="pr-name" value="${esc(project?.name||'')}"></div><div class="field"><label>وصف المشروع</label><textarea id="pr-desc">${esc(project?.description||'')}</textarea></div><div class="grid grid-2"><div class="field"><label>تاريخ البداية *</label><input type="date" id="pr-start" value="${esc(project?.startDate||todayCairoStr())}"></div><div class="field"><label>تاريخ النهاية (اختياري)</label><input type="date" id="pr-end" value="${esc(project?.endDate||'')}"></div></div><div class="field"><label>حالة المشروع</label><select id="pr-status"><option value="planned">مخطط</option><option value="active">جاري</option><option value="completed">مكتمل</option><option value="paused">متوقف</option><option value="cancelled">ملغى</option></select></div><div class="field"><label>لون الكارت</label><div style="display:flex;gap:8px;flex-wrap:wrap;">${PROJECT_COLORS.map(c=>`<label style="cursor:pointer;"><input type="radio" name="pr-color" value="${c}" ${c===curColor?'checked':''} style="display:none;"><span class="pr-sw" style="background:${c};"></span></label>`).join('')}</div></div><div class="field"><label>صورة المشروع (اختيارية)</label><input type="file" id="pr-file" accept="image/*">${project?.imageName?`<div class="muted" style="font-size:11px;margin-top:4px;">الصورة الحالية: ${esc(project.imageName)}</div>`:''}</div><div class="field"><div class="flex-between"><label style="margin:0;">الموظفون المشاركون *</label><span class="muted" style="font-size:11px;">حدد المسؤولين بعد اختيار الأعضاء</span></div><div class="assignee-list" id="pr-members">${allEmps.map(uid=>`<label class="assignee-chk"><input type="checkbox" class="pr-member" value="${uid}" ${members.has(uid)?'checked':''}> ${esc(empName(uid))}</label>`).join('')||'<span class="muted">لا يوجد موظفون</span>'}</div></div><div class="field"><label>مسؤولو/سينير المشروع</label><div class="assignee-list" id="pr-managers">${allEmps.map(uid=>`<label class="assignee-chk"><input type="checkbox" class="pr-manager" value="${uid}" ${managers.has(uid)?'checked':''} ${members.has(uid)?'':'disabled'}> ${esc(empName(uid))}</label>`).join('')}</div></div><div class="error-text" id="pr-err" style="display:none;"></div><div class="modal-actions"><button class="btn btn-outline" id="pr-cancel">إلغاء</button><button class="btn btn-primary" id="pr-save">حفظ المشروع</button></div></div></div>`);
  document.body.appendChild(overlay);
  overlay.querySelector('#pr-status').value=project?.status||'planned';
  overlay.querySelectorAll('.pr-member').forEach(chk=>chk.addEventListener('change',()=>{const manager=overlay.querySelector(`.pr-manager[value="${CSS.escape(chk.value)}"]`);if(manager) manager.disabled=!chk.checked;if(!chk.checked) manager.checked=false;}));
  overlay.querySelector('#pr-cancel').addEventListener('click',()=>overlay.remove());
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  overlay.querySelector('#pr-save').addEventListener('click',async()=>{
    const name=overlay.querySelector('#pr-name').value.trim(), description=overlay.querySelector('#pr-desc').value.trim(), startDate=overlay.querySelector('#pr-start').value, endDate=overlay.querySelector('#pr-end').value, status=overlay.querySelector('#pr-status').value;
    const memberUids=[...overlay.querySelectorAll('.pr-member:checked')].map(c=>c.value), managerUids=[...overlay.querySelectorAll('.pr-manager:checked')].map(c=>c.value), err=overlay.querySelector('#pr-err');
    if(!name||!startDate||!memberUids.length){err.textContent='اكتب اسم المشروع وتاريخ البداية واختر عضوًا واحدًا على الأقل';err.style.display='block';return;}
    const btn=overlay.querySelector('#pr-save');btn.disabled=true;btn.textContent='جارِ الحفظ...';
    try{const file=overlay.querySelector('#pr-file').files[0];const att=file?await uploadTaskAttachment(file,'projectImages'):{url:project?.imageUrl||null,name:project?.imageName||null,path:project?.imagePath||null};const payload={name,description,startDate,endDate,status,memberUids,managerUids,color:(overlay.querySelector('input[name=pr-color]:checked')||{}).value||null,imageUrl:att.url,imageName:att.name,imagePath:att.path,createdBy:project?.createdBy||currentUser.uid,createdByName:project?.createdByName||currentEmployee.name||'',active:true};if(project)await updateDoc(doc(db,'projects',project.id),payload);else await setDoc(doc(collection(db,'projects')), {...payload,createdAt:serverTimestamp()});toast(project?'تم تعديل المشروع':'تم إنشاء المشروع','ok');overlay.remove();}catch(e){console.error(e);err.textContent='حدث خطأ أثناء حفظ المشروع';err.style.display='block';btn.disabled=false;btn.textContent='حفظ المشروع';}
  });
}

function openProjectTaskModal(project,kind='admin'){
  const members=project.memberUids||[];
  const overlay=el(`<div class="modal-overlay"><div class="modal-box" style="max-width:540px;"><h3>${kind==='internal'?'🧩 إضافة مهمة داخلية':'📋 إضافة تكليف من الإدارة'} — ${esc(project.name)}</h3><div class="field"><label>عنوان المهمة *</label><input id="pt-title"></div><div class="field"><label>التفاصيل</label><textarea id="pt-desc"></textarea></div><div class="grid grid-2"><div class="field"><label>نوع المهمة</label><select id="pt-type"><option value="temporary">مؤقتة</option><option value="permanent">دائمة</option><option value="recurring">متجددة</option></select></div><div class="field" id="pt-due-box"><label>الموعد النهائي</label><input type="date" id="pt-due"></div><div class="field" id="pt-rec-box" style="display:none;"><label>التجديد</label><select id="pt-rec"><option value="daily">يوميًا</option><option value="weekly">أسبوعيًا</option><option value="monthly">شهريًا</option></select></div></div><div class="field"><label>المكلفون *</label><label class="assignee-chk"><input type="checkbox" id="pt-all"> <b>كل الفريق</b></label><div class="assignee-list" id="pt-list">${members.map(uid=>`<label class="assignee-chk"><input type="checkbox" class="pt-who" value="${uid}"> ${esc(empName(uid))}</label>`).join('')}</div></div><div class="field"><label>ملاحظات</label><textarea id="pt-notes"></textarea></div><div class="field"><label>مرفق اختياري</label><input type="file" id="pt-file"></div><div class="error-text" id="pt-err" style="display:none;"></div><div class="modal-actions"><button class="btn btn-outline" id="pt-cancel">إلغاء</button><button class="btn btn-primary" id="pt-save">إسناد المهمة</button></div></div></div>`);
  document.body.appendChild(overlay);
  overlay.querySelector('#pt-cancel').addEventListener('click',()=>overlay.remove());overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  const typeSel=overlay.querySelector('#pt-type'),allChk=overlay.querySelector('#pt-all'),whos=[...overlay.querySelectorAll('.pt-who')];
  typeSel.addEventListener('change',()=>{overlay.querySelector('#pt-due-box').style.display=typeSel.value==='temporary'?'block':'none';overlay.querySelector('#pt-rec-box').style.display=typeSel.value==='recurring'?'block':'none';});
  allChk.addEventListener('change',()=>whos.forEach(w=>{w.checked=allChk.checked;w.disabled=allChk.checked;}));
  overlay.querySelector('#pt-save').addEventListener('click',async()=>{
    const title=overlay.querySelector('#pt-title').value.trim(),err=overlay.querySelector('#pt-err'),type=typeSel.value;
    const uids=allChk.checked?members:whos.filter(w=>w.checked).map(w=>w.value);
    if(!title||!uids.length){err.textContent='اكتب عنوان المهمة واختر المكلفين';err.style.display='block';return;}
    const btn=overlay.querySelector('#pt-save');btn.disabled=true;btn.textContent='جارِ الحفظ...';
    try{
      const file=overlay.querySelector('#pt-file').files[0],att=await uploadTaskAttachment(file,'projectTaskAttachments');
      await Promise.all(uids.map(assignedUid=>setDoc(doc(collection(db,'projectTasks')),{projectId:project.id,projectName:project.name,title,description:overlay.querySelector('#pt-desc').value.trim(),assignedUid,assignedBy:currentUser.uid,assignedByName:currentEmployee.name||'',source:kind==='internal'?'internal':'generalManager',parentId:null,internal:kind==='internal',taskType:type,recurrence:type==='recurring'?overlay.querySelector('#pt-rec').value:null,teamWide:allChk.checked,assignedAt:serverTimestamp(),dueDate:type==='temporary'?overlay.querySelector('#pt-due').value:'',status:'pending',notes:overlay.querySelector('#pt-notes').value.trim(),attachmentUrl:att.url,attachmentName:att.name,attachmentType:file?.type||null,attachmentPath:att.path,attachmentOwnerUid:currentUser.uid,attachmentAddedAt:serverTimestamp(),active:true})));
      await pushNotifications(uids,kind==='internal'?'🧩 مهمة داخلية جديدة':'📋 تكليف جديد من الإدارة',`${project.name} — ${title}`);
      toast('تم إسناد المهمة','ok');overlay.remove();
    }catch(e){console.error(e);err.textContent='تعذر حفظ المهمة';err.style.display='block';btn.disabled=false;btn.textContent='إسناد المهمة';}
  });
}

function openProjectTaskUpdateModal(task){
  const overlay=el(`<div class="modal-overlay"><div class="modal-box"><h3>تحديث مهمة المشروع</h3><div class="modal-sub">${esc(task.title)}</div><div class="field"><label>الحالة</label><select id="pu-status"><option value="pending">لم تبدأ</option><option value="in_progress">قيد التنفيذ</option><option value="completed">مكتملة</option><option value="failed">متعذرة</option></select></div><div class="field"><label>ملاحظات</label><textarea id="pu-note">${esc(task.notes||'')}</textarea></div><div class="field"><label>مرفق اختياري</label><input type="file" id="pu-file"></div><div class="error-text" id="pu-err" style="display:none;"></div><div class="modal-actions"><button class="btn btn-outline" id="pu-cancel">إلغاء</button><button class="btn btn-primary" id="pu-save">حفظ التحديث</button></div></div></div>`);document.body.appendChild(overlay);overlay.querySelector('#pu-status').value=task.status||'pending';overlay.querySelector('#pu-cancel').addEventListener('click',()=>overlay.remove());overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});overlay.querySelector('#pu-save').addEventListener('click',async()=>{const status=overlay.querySelector('#pu-status').value,note=overlay.querySelector('#pu-note').value.trim(),err=overlay.querySelector('#pu-err');if(status==='failed'&&!note){err.textContent='اكتب سبب التعذر';err.style.display='block';return;}const btn=overlay.querySelector('#pu-save');btn.disabled=true;btn.textContent='جارِ الحفظ...';try{const file=overlay.querySelector('#pu-file').files[0],att=file?await uploadTaskAttachment(file,'projectTaskUpdates'):{url:task.attachmentUrl||null,name:task.attachmentName||null,path:task.attachmentPath||null};await updateDoc(doc(db,'projectTasks',task.id),{status,notes:note,attachmentUrl:att.url,attachmentName:att.name,attachmentType:file?.type||task.attachmentType||null,attachmentPath:att.path,attachmentOwnerUid:currentUser.uid,attachmentAddedAt:serverTimestamp(),updatedAt:serverTimestamp(),completedAt:(status==='completed'||status==='failed')?serverTimestamp():null});await pushNotifications(['admins'],status==='completed'?'✅ إنجاز مهمة مشروع':'📌 تحديث مهمة مشروع',`${currentEmployee.name||''} — ${task.title}`);toast('تم تحديث المهمة','ok');overlay.remove();}catch(e){console.error(e);err.textContent='تعذر حفظ التحديث';err.style.display='block';btn.disabled=false;btn.textContent='حفظ التحديث';}});
}
</script>
