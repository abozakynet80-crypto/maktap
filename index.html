  let lastColSet = [];
  let selectedIds = new Set();

  /* تحميل مرة واحدة (وليس استماعًا حيًا) لتقليل استهلاك قراءات فيربيس —
     التحديثات المحلية (تم الإدخال/استيفاء) تُطبَّق فورًا على البيانات المحمّلة بدون الحاجة لإعادة التحميل */
  async function loadMine(){
    const wrap = box.querySelector('#my-requests-table');
    try{
      const qs = await getDocs(query(collection(db,'tokeenRequests'), where('uid','==',currentUser.uid)));
      myRows = [];
      qs.forEach(d=> myRows.push({id:d.id, ...d.data()}));
      renderMyStats(myRows);
      draw();
    }catch(err){
      console.error(err);
      if(wrap) wrap.innerHTML = `<div class="empty-state">تعذر تحميل الطلبات</div>`;
    }
  }
  loadMine();
  box.querySelector('#mine-refresh-btn').addEventListener('click', async ()=>{
    const btn = box.querySelector('#mine-refresh-btn');
    btn.disabled=true; btn.textContent='جارِ التحديث...';
    await loadMine();
    btn.disabled=false; btn.textContent='🔄 تحديث';
  });

  function draw(){
    const wrap = box.querySelector('#my-requests-table');
    if(!wrap) return;
    const mode = box.querySelector('#mine-filter').value;
    const search = normalizeDigits(box.querySelector('#mine-search').value.trim().toLowerCase());

    const centerSel = box.querySelector('#mine-center-filter');
    const centers = [...new Set(myRows.map(r=>r.center).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
    const prevCenterVal = centerSel.value;
    centerSel.innerHTML = `<option value="">كل المراكز</option>` + centers.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    centerSel.value = centers.includes(prevCenterVal) ? prevCenterVal : '';
    const centerFilter = centerSel.value;

    let rows = myRows.filter(r=>{
      if(mode==='all') return true;
      if(mode==='done') return !!r.done;
      if(mode==='istifa') return !r.done && !!r.istifa;
      return !r.done && !r.istifa;   // الافتراضي: المتبقي فعليًا بدون طلبات الاستيفاء
    });
    if(centerFilter) rows = rows.filter(r=> r.center===centerFilter);
    if(search){
      rows = rows.filter(r=> normalizeDigits(JSON.stringify(r.data||{}) + ' ' + (r.center||'')).toLowerCase().includes(search));
    }
    if(rows.length===0){
      wrap.innerHTML = `<div class="empty-state"><div class="emoji">📭</div>${myRows.length ? 'لا توجد نتائج مطابقة' : 'لا توجد طلبات مسندة إليك حاليًا'}</div>`;
      lastRows = []; lastColSet = []; selectedIds.clear(); updateBulkBar();
      return;
    }
    const colSet = [];
    myRows.forEach(r=> filterAllowedCols(Object.keys(r.data||{})).forEach(k=>{ if(!colSet.includes(k)) colSet.push(k); }));
    lastRows = rows; lastColSet = colSet;
    rows.sort((a,b)=> String(a.center||'').localeCompare(String(b.center||''),'ar') || (a.done?1:0)-(b.done?1:0) || String(a.date).localeCompare(String(b.date)));

    /* التحديد لا يُلغى بسبب البحث/الفلترة — نحذف فقط ما لم يعد قابلًا للتحديد فعليًا (تم إدخاله أو أصبح استيفاء) */
    const selectableIds = new Set(myRows.filter(r=> !r.done && !r.istifa).map(r=>r.id));
    [...selectedIds].forEach(id=>{ if(!selectableIds.has(id)) selectedIds.delete(id); });

    wrap.innerHTML = `
      <table class="sticky-table">
        <thead><tr>
          <th style="width:32px;"><input type="checkbox" id="sel-all-chk"></th>
          <th class="col-action">الإدخال</th><th>المركز</th>${colSet.map(c=>`<th>${esc(c)}</th>`).join('')}<th>تاريخ الإسناد</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr class="${r.done?'row-done':(r.istifa?'row-istifa':'')}">
              <td>${(r.done||r.istifa) ? '' : `<input type="checkbox" class="row-chk" data-id="${r.id}" ${selectedIds.has(r.id)?'checked':''}>`}</td>
              <td class="col-action">
                ${r.done
                  ? `<div class="action-stack">
                       <span class="btn btn-sm btn-entered">✓ تم الإدخال</span>
                       <button class="btn btn-sm btn-outline undo-btn" data-id="${r.id}">إلغاء</button>
                     </div>`
                  : `<div class="action-stack">
                       <button class="btn btn-sm btn-enter mark-btn" data-id="${r.id}">تم الإدخال</button>
                       <button class="btn btn-sm btn-istifa istifa-btn" data-id="${r.id}" data-val="${r.istifa?'0':'1'}" title="تأجيل الطلب لحين الاستيفاء — لا يُحتسب في الإحصائيات">${r.istifa?'↩ إلغاء الاستيفاء':'⏳ استيفاء'}</button>
                     </div>`}
              </td>
              <td>${esc(r.center||'—')}</td>
              ${colSet.map(c=>`<td>${esc(r.data ? r.data[c] : '')}</td>`).join('')}
              <td>${fmtDate(r.date)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('.mark-btn').forEach(b=> b.addEventListener('click', ()=> setDone(b, b.dataset.id, true)));
    wrap.querySelectorAll('.undo-btn').forEach(b=> b.addEventListener('click', ()=> setDone(b, b.dataset.id, false)));
    wrap.querySelectorAll('.istifa-btn').forEach(b=> b.addEventListener('click', ()=> setIstifa(b, b.dataset.id, b.dataset.val==='1')));
    wrap.querySelectorAll('.row-chk').forEach(chk=>{
      chk.addEventListener('change', ()=>{
        if(chk.checked) selectedIds.add(chk.dataset.id); else selectedIds.delete(chk.dataset.id);
        syncSelectAllState(); updateBulkBar();
      });
    });
    const selAll = wrap.querySelector('#sel-all-chk');
    selAll.addEventListener('change', ()=>{
      wrap.querySelectorAll('.row-chk').forEach(chk=>{
        chk.checked = selAll.checked;
        if(selAll.checked) selectedIds.add(chk.dataset.id); else selectedIds.delete(chk.dataset.id);
      });
      updateBulkBar();
    });
    syncSelectAllState();
    updateBulkBar();
  }

  function syncSelectAllState(){
    const wrap = box.querySelector('#my-requests-table');
    if(!wrap) return;
    const chks = wrap.querySelectorAll('.row-chk');
    const selAll = wrap.querySelector('#sel-all-chk');
    if(!selAll) return;
    selAll.checked = chks.length>0 && [...chks].every(c=>c.checked);
  }

  function updateBulkBar(){
    const btn = box.querySelector('#mine-bulk-done-btn');
    if(!btn) return;
    const n = selectedIds.size;
    btn.textContent = n>0 ? `✓ تم إدخال المحدد (${n})` : '✓ تم إدخال المحدد';
    btn.disabled = n===0;
  }

  box.querySelector('#mine-bulk-done-btn').addEventListener('click', async ()=>{
    const ids = [...selectedIds];
    if(ids.length===0) return;
    const btn = box.querySelector('#mine-bulk-done-btn');
    btn.disabled = true; btn.textContent = 'جارِ التحديث...';
    try{
      const chunkSize = 450;
      for(let i=0;i<ids.length;i+=chunkSize){
        const chunk = ids.slice(i,i+chunkSize);
        const batch = writeBatch(db);
        chunk.forEach(id=> batch.update(doc(db,'tokeenRequests',id), {done:true, doneAt: serverTimestamp(), doneDate: todayCairoStr()}));
        await batch.commit();
      }
      const doneDate = todayCairoStr();
      const idSet = new Set(ids);
      myRows = myRows.map(r=> idSet.has(r.id) ? {...r, done:true, doneAt:{toDate:()=>new Date()}, doneDate} : r);
      toast(`تم تحديد ${ids.length} طلب كـ«تم الإدخال» — شغل ممتاز 👏`, 'ok');
      selectedIds.clear();
      renderMyStats(myRows);
      draw();
    }catch(err){
      console.error(err);
      toast('حدث خطأ أثناء التحديث الجماعي، حاول مرة أخرى', 'err');
      updateBulkBar();
    }
  });

  /* استخراج رقم الطلب الفعلي لصف معيّن (حسب العمود المحدد وقت الرفع reqField، مع احتياط لو مش موجود) */
  function rowReqNumber(r){
    if(r.reqField && r.data && r.data[r.reqField]!==undefined && r.data[r.reqField]!==null){
      return normalizeDigits(String(r.data[r.reqField])).trim();
    }
    // احتياط: جرّب أي عمود اسمه قريب من "رقم الطلب"
    if(r.data){
      const key = Object.keys(r.data).find(k=> String(k).trim().toLowerCase().includes('requestnumber'));
      if(key) return normalizeDigits(String(r.data[key]||'')).trim();
    }
    return '';
  }

  function parsePastedNumbers(raw){
    return [...new Set(
      normalizeDigits(raw)
        .split(/[\n\r,،;\t ]+/)
        .map(s=>s.trim())
        .filter(Boolean)
    )];
  }

  async function convertPastedNumbers(mode){
    const toDone = mode==='done';
    const toIstifa = mode==='istifa';
    const ta = box.querySelector('#paste-req-numbers');
    const resultBox = box.querySelector('#paste-req-result');
    const wanted = parsePastedNumbers(ta.value);
    resultBox.style.display='block';
    if(wanted.length===0){
      resultBox.textContent = 'من فضلك الصق رقم طلب واحد على الأقل';
      return;
    }
    const wantedSet = new Set(wanted);
    const matches = myRows.filter(r=>{
      const num = rowReqNumber(r);
      if(!num || !wantedSet.has(num)) return false;
      if(toIstifa) return !r.done && !r.istifa;
      return r.done !== toDone;
    });
    const matchedNums = new Set(matches.map(r=>rowReqNumber(r)));
    const notFound = wanted.filter(n=>!matchedNums.has(n));
    const modeLabel = toIstifa ? 'استيفاء' : (toDone ? 'تم' : 'لم يتم');

    if(matches.length===0){
      resultBox.textContent = `لم يتم العثور على أي من الأرقام المطلوبة ضمن طلباتك القابلة للتحويل إلى «${modeLabel}»`;
      return;
    }

    const doneBtn = box.querySelector('#paste-mark-done-btn');
    const undoneBtn = box.querySelector('#paste-mark-undone-btn');
    const istifaBtn = box.querySelector('#paste-mark-istifa-btn');
    doneBtn.disabled = true; undoneBtn.disabled = true; istifaBtn.disabled = true;
    const activeBtn = toIstifa ? istifaBtn : (toDone ? doneBtn : undoneBtn);
    const oldTxt = activeBtn.textContent;
    activeBtn.textContent = 'جارِ التحويل...';

    try{
      const ids = matches.map(r=>r.id);
      const chunkSize = 450;
      const doneDate = todayCairoStr();
      for(let i=0;i<ids.length;i+=chunkSize){
        const chunk = ids.slice(i,i+chunkSize);
        const batch = writeBatch(db);
        chunk.forEach(id=> batch.update(doc(db,'tokeenRequests',id), toIstifa
          ? {istifa:true, istifaAt: serverTimestamp()}
          : (toDone
            ? {done:true, doneAt: serverTimestamp(), doneDate}
            : {done:false, doneAt: null, doneDate: null})));
        await batch.commit();
      }
      const idSet = new Set(ids);
      myRows = myRows.map(r=> idSet.has(r.id)
        ? (toIstifa
          ? {...r, istifa:true}
          : {...r, done:toDone, doneAt: toDone?{toDate:()=>new Date()}:null, doneDate: toDone?doneDate:null})
        : r);
      resultBox.textContent = `تم تحويل ${matches.length} طلب إلى «${modeLabel}»` + (notFound.length ? ` — لم يتم العثور على ${notFound.length} رقم: ${notFound.slice(0,15).join('، ')}${notFound.length>15?'...':''}` : '');
      toast(`تم تحويل ${matches.length} طلب إلى «${modeLabel}»`, 'ok');
      renderMyStats(myRows);
      draw();
    }catch(err){
      console.error(err);
      resultBox.textContent = 'حدث خطأ أثناء التحويل، حاول مرة أخرى';
    }finally{
      doneBtn.disabled=false; undoneBtn.disabled=false; istifaBtn.disabled=false;
      doneBtn.textContent = '✓ تحويل إلى تم';
      undoneBtn.textContent = '↩ تحويل إلى لم يتم';
      istifaBtn.textContent = '⏳ تحويل إلى استيفاء';
    }
  }

  box.querySelector('#paste-mark-done-btn').addEventListener('click', ()=> convertPastedNumbers('done'));
  box.querySelector('#paste-mark-undone-btn').addEventListener('click', ()=> convertPastedNumbers('undone'));
  box.querySelector('#paste-mark-istifa-btn').addEventListener('click', ()=> convertPastedNumbers('istifa'));

  async function setDone(btn, id, val){
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '...';
    try{
      await updateDoc(doc(db,'tokeenRequests',id), val
        ? {done:true, doneAt: serverTimestamp(), doneDate: todayCairoStr()}
        : {done:false, doneAt: null, doneDate: null});
      myRows = myRows.map(r=> r.id===id ? {...r, done:val, doneAt: val?{toDate:()=>new Date()}:null, doneDate: val?todayCairoStr():null} : r);
      toast(val ? 'تم نقل الطلب إلى «ما تم إدخاله»' : 'تم التراجع عن الإدخال', 'ok');
      renderMyStats(myRows);
      draw();
    }catch(err){
      console.error(err);
      toast('حدث خطأ، حاول مرة أخرى', 'err');
      btn.disabled=false; btn.textContent=old;
    }
  }

  /* تعليم الطلب كـ«استيفاء» (مؤجل لحين الاستكمال) أو إلغاؤه */
  async function setIstifa(btn, id, val){
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '...';
    try{
      await updateDoc(doc(db,'tokeenRequests',id), {istifa: val, istifaAt: val ? serverTimestamp() : null});
      myRows = myRows.map(r=> r.id===id ? {...r, istifa:val} : r);
      toast(val ? 'تم وضع الطلب في الاستيفاء — مستبعد من الإحصائيات' : 'تم إرجاع الطلب لقائمة المتبقي', 'ok');
      renderMyStats(myRows);
      draw();
    }catch(err){
      console.error(err);
      toast('حدث خطأ، حاول مرة أخرى', 'err');
      btn.disabled=false; btn.textContent=old;
    }
  }

  box.querySelector('#mine-filter').addEventListener('change', draw);
  box.querySelector('#mine-search').addEventListener('input', draw);
  box.querySelector('#mine-center-filter').addEventListener('change', draw);
  box.querySelector('#my-export-btn').addEventListener('click', ()=>{
    if(lastRows.length===0){ toast('لا توجد بيانات لتصديرها', 'err'); return; }
    exportRowsToExcel(lastRows, lastColSet, `طلباتي_المسندة_${todayCairoStr()}.xlsx`);
  });
}

function renderMyStats(rows){
  const t = document.getElementById('stat-target');
  if(!t) return;
  const s = rolloverStats(rows);
  const istifaEl = document.getElementById('stat-istifa');
  if(istifaEl) istifaEl.textContent = rows.filter(r=> r.istifa && !r.done).length;
  t.textContent = s.target;
  document.getElementById('stat-done').textContent = s.done;
  document.getElementById('stat-remain').textContent = s.target - s.done;
  document.getElementById('progress-fill').style.width = (s.target? Math.round(s.done/s.target*100):0) + '%';
}

function renderDoneSection(box){
  box.innerHTML = `
    <div class="card">
      <div class="flex-between" style="margin-bottom:14px;">
        <h3 style="margin:0;">🏆 إحصائيات الإدخال لكل موظف</h3>
        <button class="btn btn-outline btn-sm" id="done-refresh-btn">🔄 تحديث</button>
      </div>
      <div class="filter-bar">
        <label class="muted" style="font-size:12.5px;">من</label>
        <input type="date" id="done-from">
        <label class="muted" style="font-size:12.5px;">إلى</label>
        <input type="date" id="done-to">
        <button class="btn btn-outline btn-sm" id="done-all-time">اليوم الحالي</button>
      </div>
      <div class="emp-stat-grid" id="done-leaderboard"><div class="muted">جارِ التحميل...</div></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h3>✅ سجل الطلبات التي تم إدخالها</h3>
      <div class="filter-bar">
        <select id="done-emp"><option value="">كل الموظفين</option></select>
        <select id="done-sort">
          <option value="center">ترتيب حسب المركز</option>
          <option value="emp">ترتيب حسب الموظف</option>
        </select>
        <input type="text" id="done-search" placeholder="ابحث برقم الطلب أو أي جزء من الرقم...">
      </div>
      <div class="table-wrap" id="done-table"><div class="muted" style="padding:14px;">جارِ التحميل...</div></div>
    </div>
  `;

  let allDone = [];
  let allRows = [];

  /* تحميل الطلبات مرة واحدة (وليس استماعًا حيًا) لتقليل استهلاك قراءات فيربيس —
     اضغط «تحديث» لو عايز أحدث بيانات */
  async function loadRequests(){
    const tBox = box.querySelector('#done-table');
    const lBox = box.querySelector('#done-leaderboard');
    try{
      const qs = await getDocs(collection(db,'tokeenRequests'));
      allRows = [];
      qs.forEach(d=> allRows.push({id:d.id, ...d.data()}));
      allDone = allRows.filter(r=> r.done);
      fillEmpSelect(); draw(); drawLeaderboard();
    }catch(err){
      console.error(err);
      if(tBox) tBox.innerHTML = `<div class="empty-state">تعذر تحميل البيانات</div>`;
      if(lBox) lBox.innerHTML = `<div class="empty-state">تعذر تحميل البيانات</div>`;
    }
  }
  loadRequests();
  const refreshBtn = box.querySelector('#done-refresh-btn');
  refreshBtn.addEventListener('click', async ()=>{
    refreshBtn.disabled=true; refreshBtn.textContent='جارِ التحديث...';
    await loadRequests();
    refreshBtn.disabled=false; refreshBtn.textContent='🔄 تحديث';
  });

  watchEmployeesCache(()=>{ fillEmpSelect(); draw(); drawLeaderboard(); });

  function fillEmpSelect(){
    const sel = box.querySelector('#done-emp');
    if(!sel) return;
    const cur = sel.value;
    const uids = [...new Set(allDone.map(r=>r.uid))];
    sel.innerHTML = `<option value="">كل الموظفين</option>` + uids.map(u=>`<option value="${esc(u)}">${esc(empName(u))}</option>`).join('');
    sel.value = cur;
  }

  function inPeriod(r){
    const from = box.querySelector('#done-from').value;
    const to = box.querySelector('#done-to').value;
    if(!from && !to) return true;
    const d = doneDateOf(r);
    if(!d) return false;
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  }

  function inAssignPeriod(r){
    const from = box.querySelector('#done-from').value;
    const to = box.querySelector('#done-to').value;
    if(!from && !to) return true;
    const d = String(r.date||'');
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  }

  function drawLeaderboard(){
    const board = box.querySelector('#done-leaderboard');
    if(!board) return;
    const from = box.querySelector('#done-from').value;
    const to = box.querySelector('#done-to').value;
    const byUid = (!from && !to)
      ? groupStatsByUidAndCenter(allRows, rolloverStats)
      : groupStatsByUidAndCenter(allRows.filter(inAssignPeriod), periodStats);
    const uids = Object.keys(byUid).filter(uid=> !employeesCache[uid] || employeesCache[uid].role!=='admin');
    if(uids.length===0){ board.innerHTML = `<div class="empty-state"><div class="emoji">📊</div>لا توجد طلبات مسندة في هذه الفترة</div>`; return; }
    uids.sort((a,b)=> byUid[b].done - byUid[a].done || empName(a).localeCompare(empName(b),'ar'));
    board.innerHTML = uids.map((uid,i)=>{
      const s = byUid[uid];
      const centerStats = Object.keys(s.centers).sort((a,b)=>a.localeCompare(b,'ar')).map(c=>({center:c, target:s.centers[c].target, done:s.centers[c].done}));
      const medal = s.done>0 ? (i===0?'🥇 ':(i===1?'🥈 ':(i===2?'🥉 ':''))) : '';
      return `<div class="emp-stat-card ${perfClass(s.target,s.done)}">
        <div class="es-name">${medal}${esc(empName(uid))}</div>
        <div class="es-dept">${esc(empDept(uid))}</div>
        ${centerCardBodyHTML(centerStats)}
      </div>`;
    }).join('');
  }

  function draw(){
    const periodRows = allDone.filter(inPeriod);
    const empFilter = box.querySelector('#done-emp').value;
    const search = normalizeDigits(box.querySelector('#done-search').value.trim().toLowerCase());
    let rows = periodRows.filter(r=> !empFilter || r.uid===empFilter);
    if(search){
      rows = rows.filter(r=>{
        const hay = [r.center||'', empName(r.uid), JSON.stringify(r.data||{})].join(' ');
        return normalizeDigits(hay).toLowerCase().includes(search);
      });
    }
    const tbl = box.querySelector('#done-table');
    if(rows.length===0){ tbl.innerHTML = `<div class="empty-state">لا توجد نتائج مطابقة</div>`; return; }
    const colSet = [];
    rows.forEach(r=> filterAllowedCols(Object.keys(r.data||{})).forEach(k=>{ if(!colSet.includes(k)) colSet.push(k); }));
    const sortMode = box.querySelector('#done-sort') ? box.querySelector('#done-sort').value : 'center';
    if(sortMode==='emp'){
      rows.sort((a,b)=> empName(a.uid).localeCompare(empName(b.uid),'ar') || String(doneDateOf(b)).localeCompare(String(doneDateOf(a))));
    }else{
      rows.sort((a,b)=> String(a.center||'').localeCompare(String(b.center||''),'ar') || String(doneDateOf(b)).localeCompare(String(doneDateOf(a))));
    }
    tbl.innerHTML = `
      <table class="sticky-table">
        <thead><tr><th>الموظف</th><th>المركز</th>${colSet.map(c=>`<th>${esc(c)}</th>`).join('')}<th>تاريخ الإدخال</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td>${esc(empName(r.uid))}</td>
            <td>${esc(r.center||'—')}</td>
            ${colSet.map(c=>`<td>${esc(r.data?r.data[c]:'')}</td>`).join('')}
            <td>${r.doneAt ? fmtDateTime(r.doneAt) : fmtDate(doneDateOf(r))}</td>
          </tr>`).join('')}</tbody>
      </table>
    `;
  }

  box.querySelector('#done-from').addEventListener('change', ()=>{ draw(); drawLeaderboard(); });

function fmtRecurLabel(r){ return r==='daily' ? '🔁 ثابتة (يومية)' : '📌 مؤقتة (مرة واحدة)'; }

async function uploadTaskAttachment(file, folder){
  if(!file) return {url:null, name:null, path:null};
  try{
    if(DRIVE_UPLOAD_URL){
      const dataUrl = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const response = await fetch(DRIVE_UPLOAD_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({fileName:`${folder}_${Date.now()}_${file.name}`,mimeType:file.type||'application/octet-stream',dataUrl})
      });
      const result = await response.json();
      if(!result.ok) throw new Error(result.error||'Google Drive upload failed');
      const isImage = (result.mimeType||file.type||'').startsWith('image/');
      const directUrl = result.id ? `https://drive.google.com/thumbnail?id=${result.id}&sz=w1600` : result.url;
      return {url: isImage ? directUrl : result.url, name:result.fileName||file.name, type:result.mimeType||file.type, path:result.id, provider:'google-drive'};
    }
    const path = `${folder}/${Date.now()}_${file.name}`;
    const sref = storageRef(storage, path);
    await uploadBytes(sref, file);
    const url = await getDownloadURL(sref);
    return {url, name:file.name, type:file.type, path, provider:'firebase-storage'};
  }catch(err){
    console.error('attachment upload error', err);
    toast('تعذر رفع المرفق، سيتم الحفظ بدونه', 'err');
    return {url:null, name:null, path:null};
  }
}

    draw();
  }, err=>console.error(err));

    completionsToday = {}; completionsAll = {};
    qs.forEach(d=>{
      const c = {id:d.id, ...d.data()};
      const key = `${c.templateId}_${c.uid}`;
      if(c.forDate===today) completionsToday[key]=c;
      if(!c.forDate){

          <span class="status-pill pill-bad">❌ ${failed}</span>

      if(!c) pill = `<span class="status-pill pill-neutral">⏺ لم تُنجز بعد</span>`;
      else if(c.status==='done'){
        pill = `<span class="status-pill pill-good">✅ تم الإنجاز</span>`;
        extra = `<div style="font-size:12px;color:var(--sub);margin-top:4px;">${fmtDateTime(c.completedAt)}${c.note?` — ${esc(c.note)}`:''}${c.attachmentUrl?` — <a class="attach-link" href="${esc(c.attachmentUrl)}" target="_blank" rel="noopener">📎 ${esc(c.attachmentName||'مرفق')}</a>`:''}</div>`;

function openNewTaskModal(employees){

  const overlay = el(`

        <div class="field">
          <label>مرفق (اختياري)</label>
          <input type="file" id="nt-file">
        </div>

          <div class="flex-between" style="margin-bottom:6px;"><label style="margin:0;">الموظفون المكلّفون *</label><button type="button" class="btn btn-outline btn-sm btn-auto" id="nt-select-all">تحديد الكل</button></div>

          </div>
        </div>
        <div class="error-text" id="nt-err" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="nt-cancel-btn">إلغاء</button>
          <button class="btn btn-primary" id="nt-save-btn">تكليف المهمة</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#nt-cancel-btn').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#nt-select-all').addEventListener('click', ()=>{
    const chks = overlay.querySelectorAll('.nt-assignee-chk');
    const allChecked = [...chks].every(c=>c.checked);
    chks.forEach(c=> c.checked = !allChecked);
  });

  overlay.querySelector('#nt-save-btn').addEventListener('click', async ()=>{
    const title = overlay.querySelector('#nt-title').value.trim();
    const description = overlay.querySelector('#nt-desc').value.trim();
    const recurrence = overlay.querySelector('#nt-recurrence').value;
    const assignees = [...overlay.querySelectorAll('.nt-assignee-chk')].filter(c=>c.checked).map(c=>c.value);
    const file = overlay.querySelector('#nt-file').files[0];
    const errBox = overlay.querySelector('#nt-err');
    errBox.style.display='none';
    if(!title){ errBox.textContent='من فضلك اكتب عنوان المهمة'; errBox.style.display='block'; return; }
    if(assignees.length===0){ errBox.textContent='من فضلك اختر موظفًا واحدًا على الأقل'; errBox.style.display='block'; return; }

    const btn = overlay.querySelector('#nt-save-btn');

      const att = await uploadTaskAttachment(file, 'taskAttachments');

        title, description, recurrence, assignees,
        attachmentUrl: att.url, attachmentName: att.name, attachmentType: file?.type||null, attachmentPath: att.path,

      errBox.textContent = 'حدث خطأ أثناء الحفظ، حاول مرة أخرى';
      errBox.style.display='block';
      btn.disabled=false; btn.textContent='تكليف المهمة';
    }
  });
}

  }, err=>console.error(err));
  unsubList.push(tmplUnsub);

  const compUnsub = onSnapshot(query(collection(db,'taskCompletions'), where('uid','==',uid)), qs=>{
    completions = {};
    qs.forEach(d=>{
      const c = {id:d.id, ...d.data()};
      const key = c.forDate ? `${c.templateId}_${c.forDate}` : c.templateId;
      if(!completions[key] || (c.completedAt?.seconds||0) > (completions[key].completedAt?.seconds||0)) completions[key]=c;
    });
    draw();
  }, err=>console.error(err));
  unsubList.push(compUnsub);

  const projectTaskUnsub = onSnapshot(query(collection(db,'projectTasks'), where('assignedUid','==',uid)), qs=>{
    projectTasks = []; qs.forEach(d=>{ const data=d.data(); if(data.active!==false) projectTasks.push({id:d.id,...data}); });
    projectTasks.sort((a,b)=> (b.assignedAt?.seconds||0)-(a.assignedAt?.seconds||0));
    draw();
  }, err=>console.error(err));
  unsubList.push(projectTaskUnsub);

  function draw(){
    const box = container.querySelector('#my-tasks-list');
    if(!box) return;
    if(templates.length===0 && projectTasks.length===0){ box.innerHTML = `<div class="empty-state"><div class="emoji">📭</div>لا توجد مهام مكلّف بها حاليًا</div>`; return; }
    const regularTasksHtml = templates.map(t=>{
      const key = t.recurrence==='daily' ? `${t.id}_${today}` : t.id;
      const c = completions[key];
      let statusHtml;
      if(!c){
        statusHtml = `
          <div class="task-close-form">
            <textarea id="tf-note-${t.id}" placeholder="ملاحظات (اختياري عند الإنجاز، وسبب إلزامي عند التعذّر)"></textarea>
            <div style="margin-top:8px;"><input type="file" id="tf-file-${t.id}"></div>
            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
              <button class="btn btn-primary btn-sm btn-auto close-task-btn" data-id="${t.id}" data-status="done">✅ تم الإنجاز</button>
              <button class="btn btn-danger btn-sm btn-auto close-task-btn" data-id="${t.id}" data-status="failed">❌ تعذّر</button>
            </div>
          </div>`;
      } else {
        const pill = c.status==='done' ? `<span class="status-pill pill-good">✅ تم الإنجاز</span>` : `<span class="status-pill pill-bad">❌ تعذّر</span>`;
        statusHtml = `
          <div class="task-close-form">
            ${pill}
            <div style="font-size:12.5px;color:var(--sub);margin-top:6px;">${fmtDateTime(c.completedAt)}${c.note?` — ${esc(c.note)}`:''}</div>
            ${c.attachmentUrl ? `<div style="margin-top:4px;"><a class="attach-link" href="${esc(c.attachmentUrl)}" target="_blank" rel="noopener">📎 ${esc(c.attachmentName||'مرفق')}</a></div>` : ''}
            <button class="btn btn-outline btn-sm btn-auto undo-task-btn" style="margin-top:8px;" data-comp-id="${c.id}">↩ تراجع</button>
          </div>`;
      }
      return `
      <div class="task-card">
        <span class="recur-badge ${t.recurrence==='daily'?'recur-daily':'recur-once'}">${fmtRecurLabel(t.recurrence)}</span>
        <div class="tc-title" style="margin-top:6px;">${esc(t.title)}</div>
        ${t.description ? `<div class="tc-desc">${esc(t.description)}</div>` : ''}
        ${t.attachmentUrl ? `<div style="margin-top:6px;"><a class="attach-link" href="${esc(t.attachmentUrl)}" target="_blank" rel="noopener">📎 ${esc(t.attachmentName||'مرفق')}</a></div>` : ''}
        <div class="tc-meta"><span>👤 من: ${esc(t.createdByName||'الإدارة')}</span></div>
        ${statusHtml}
      </div>`;
    }).join('');
    const projectTasksHtml = projectTasks.length ? `<div class="card" style="margin-top:16px;"><h3>📁 مهام المشاريع</h3>${projectTasks.map(t=>`<div class="project-task-row"><div class="project-task-main"><div class="project-task-title">${esc(t.title)}</div><div class="project-task-meta">📁 ${esc(t.projectName||'مشروع')} · ${t.dueDate?`الموعد ${esc(t.dueDate)}`:'بدون موعد'} · ${t.source==='generalManager'?'المدير العام':'مسؤول المشروع'}${t.notes?`<br>📝 ${esc(t.notes)}`:''}${t.attachmentUrl?`<br><a class="attach-link" href="${esc(t.attachmentUrl)}" target="_blank" rel="noopener">📎 ${esc(t.attachmentName||'مرفق')}</a>`:''}</div></div><div><span class="status-pill ${projectTaskStatusClass(t.status)}">${projectTaskStatusLabel(t.status)}</span>${t.status!=='completed'&&t.status!=='failed'?`<br><button class="btn btn-outline btn-sm update-project-task" data-id="${t.id}" style="margin-top:6px;">تحديث</button>`:''}</div></div>`).join('')}</div>` : '';
    box.innerHTML = regularTasksHtml + projectTasksHtml;

    box.querySelectorAll('.close-task-btn').forEach(b=>{
      b.addEventListener('click', ()=> closeTask(b, b.dataset.id, b.dataset.status));
    });
    box.querySelectorAll('.undo-task-btn').forEach(b=>{
      b.addEventListener('click', ()=> undoTask(b, b.dataset.compId));
    });
    box.querySelectorAll('.update-project-task').forEach(b=>{
      b.addEventListener('click', ()=> openProjectTaskUpdateModal(projectTasks.find(t=>t.id===b.dataset.id)));
    });
  }

  async function closeTask(btn, templateId, status){
    const t = templates.find(x=>x.id===templateId);
    if(!t) return;
    const noteEl = container.querySelector(`#tf-note-${templateId}`);
    const fileEl = container.querySelector(`#tf-file-${templateId}`);
    const note = noteEl ? noteEl.value.trim() : '';
    if(status==='failed' && !note){
      toast('من فضلك اكتب سبب التعذّر', 'err');
      return;
    }
    const file = fileEl ? fileEl.files[0] : null;
    const row = btn.closest('.task-close-form');
    row.querySelectorAll('button').forEach(b=> b.disabled=true);
    const oldTxt = btn.textContent;
    btn.textContent = 'جارِ الحفظ...';
    try{
      const att = await uploadTaskAttachment(file, 'taskCompletionAttachments');
      await setDoc(doc(collection(db,'taskCompletions')), {
        templateId, uid, forDate: t.recurrence==='daily' ? today : null,
        status, note, attachmentUrl: att.url, attachmentName: att.name, attachmentType: file?.type||null, attachmentPath: att.path,
        attachmentOwnerUid: currentUser.uid, attachmentAddedAt: serverTimestamp(),
        completedAt: serverTimestamp(), completedByName: currentEmployee.name||''
      });
      await pushNotifications(['admins'], status==='done' ? '✅ تم إنجاز مهمة' : '❌ تعذّر تنفيذ مهمة',
        `${currentEmployee.name||''} — ${t.title}`);
      toast(status==='done' ? 'تم تسجيل إنجاز المهمة 👏' : 'تم تسجيل التعذّر', 'ok');
    }catch(err){
      console.error(err);
      toast('حدث خطأ أثناء الحفظ، حاول مرة أخرى', 'err');
      row.querySelectorAll('button').forEach(b=> b.disabled=false);
      btn.textContent = oldTxt;
    }
  }

  async function undoTask(btn, compId){
    if(!confirm('هل تريد التراجع عن حالة هذه المهمة؟')) return;
    btn.disabled = true; btn.textContent='...';
    try{
      await deleteDoc(doc(db,'taskCompletions', compId));
      toast('تم التراجع، المهمة رجعت لقائمة المعلّقة', 'ok');
    }catch(err){
      console.error(err);
      toast('حدث خطأ، حاول مرة أخرى', 'err');
      btn.disabled=false; btn.textContent='↩ تراجع';
    }
  }
}

function renderAdminDailyReport(container, initialFilter){
  if(!container) return;
  const today = todayCairoStr();
  container.innerHTML = `
    <div class="card">
      <div class="flex-between" style="margin-bottom:14px;">
        <h3 style="margin:0;">📅 تقرير الحضور والانجاز اليومي</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <input type="date" id="report-date" value="${today}" max="${today}" style="padding:9px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13.5px;">
          <button class="btn btn-outline btn-sm" id="report-today-btn">اليوم</button>
        </div>
      </div>
      <div class="stat-row" id="report-mini-stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
        <div class="stat-box"><div class="num" id="mini-total">0</div><div class="lbl">عدد الموظفين</div></div>
        <div class="stat-box" style="background:var(--good-bg);"><div class="num" id="mini-present" style="color:var(--good);">0</div><div class="lbl">عدد الحضور</div></div>
        <div class="stat-box" style="background:var(--bad-bg);"><div class="num" id="mini-absent" style="color:var(--bad);">0</div><div class="lbl">عدد الغياب</div></div>
        <div class="stat-box" style="background:var(--warn-bg);"><div class="num" id="mini-early" style="color:var(--warn);">0</div><div class="lbl">انصراف قبل الموعد</div></div>
      </div>
      <div class="filter-bar">
        <select id="report-status-filter">
          <option value="all">الكل</option>
          <option value="present">الحضور</option>
          <option value="absent">الغائبين</option>
          <option value="early">انصراف قبل الموعد</option>
        </select>
        <select id="report-dept-filter">
          <option value="">كل الأقسام</option>
          ${DEPARTMENTS.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap" id="report-table"><div class="muted" style="padding:14px;">جارِ التحميل...</div></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h3>📈 إحصائيات فترة</h3>
      <div class="flex-between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <label class="muted" style="font-size:12.5px;">من</label>
          <input type="date" id="stats-from" max="${today}" style="padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;">
          <label class="muted" style="font-size:12.5px;">إلى</label>
          <input type="date" id="stats-to" value="${today}" max="${today}" style="padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;">
          <select id="stats-emp-filter"><option value="">كل الموظفين</option></select>
        </div>
        <button class="btn btn-primary btn-sm btn-auto" id="stats-refresh-btn">تحديث الإحصائيات</button>
      </div>
      <div class="table-wrap" id="stats-table"><div class="muted" style="padding:14px;">اختر فترة واضغط تحديث</div></div>
    </div>
  `;

  const d0 = new Date(today+'T12:00:00');
  d0.setDate(d0.getDate()-13);
  container.querySelector('#stats-from').value = d0.toISOString().slice(0,10);

  let employees = {};
  let reportUnsub = null;
  let lastAttendance = {};
  let lastDateStr = today;
  const dateInput = container.querySelector('#report-date');

  function loadEmployees(cb){
    const u = onSnapshot(collection(db,'employees'), qs=>{
      employees={}; qs.forEach(d=> employees[d.id]=d.data());
      const sel = container.querySelector('#stats-emp-filter');
      if(sel){
        const cur = sel.value;
        sel.innerHTML = `<option value="">كل الموظفين</option>` +
          Object.keys(employees).filter(uid=>employees[uid].role!=='admin')
            .map(uid=>`<option value="${uid}">${esc(employees[uid].name)}</option>`).join('');
        sel.value = cur;
      }
      cb();
    }, err=>console.error(err));
    unsubList.push(u);
  }

  function dayStatus(dateStr, record){
    if(record && record.checkIn){
      const ciDate = record.checkIn.toDate ? record.checkIn.toDate() : new Date(record.checkIn);
      const hh = +new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo', hour:'2-digit', hour12:false}).format(ciDate);
      const mm = +new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo', minute:'2-digit'}).format(ciDate);
      const late = (hh>WORK_START_HOUR) || (hh===WORK_START_HOUR && mm>0);
      return late ? 'late' : 'present';
    }
    const now = cairoNow();
    if(dateStr===today && now.hour<WORK_START_HOUR) return 'pending';
    return 'absent';
  }

  function loadReportForDate(dateStr){
    if(reportUnsub){ reportUnsub(); reportUnsub=null; }
    const tbl = container.querySelector('#report-table');
    if(tbl) tbl.innerHTML = `<div class="muted" style="padding:14px;">جارِ التحميل...</div>`;
    reportUnsub = onSnapshot(query(collection(db,'attendance'), where('date','==',dateStr)), qs=>{
      const attendance = {};
      qs.forEach(d=>{ const r=d.data(); attendance[r.uid]=r; });
      lastAttendance = attendance; lastDateStr = dateStr;
      drawReport(dateStr, attendance);
    }, err=>console.error(err));
    unsubList.push(()=>{ if(reportUnsub) reportUnsub(); });
  }

  function drawReport(dateStr, attendance){
    const tbl = container.querySelector('#report-table');
    if(!tbl) return;
    const statusFilter = container.querySelector('#report-status-filter').value;
    const deptFilter = container.querySelector('#report-dept-filter').value;
    const uids = Object.keys(employees).filter(uid=> employees[uid].role!=='admin');
    if(uids.length===0){ tbl.innerHTML = `<div class="empty-state">لا يوجد موظفون بعد</div>`; return; }
    let allDeptRows = uids.map(uid=>({uid, e:employees[uid], a:attendance[uid], status: dayStatus(dateStr, attendance[uid])}));
    if(deptFilter) allDeptRows = allDeptRows.filter(r=> r.e.department===deptFilter);
    const miniTotal = document.getElementById('mini-total');
    if(miniTotal){
      const presentCnt = allDeptRows.filter(r=> r.status==='present'||r.status==='late').length;
      const absentCnt = allDeptRows.filter(r=> r.status==='absent').length;
      const earlyCnt = allDeptRows.filter(r=> isEarlyLeave(r.a)).length;
      miniTotal.textContent = allDeptRows.length;
      document.getElementById('mini-present').textContent = presentCnt;
      document.getElementById('mini-absent').textContent = absentCnt;
      document.getElementById('mini-early').textContent = earlyCnt;
    }
    let rows = allDeptRows;
    if(statusFilter==='present') rows = rows.filter(r=> r.status==='present'||r.status==='late');
    if(statusFilter==='absent') rows = rows.filter(r=> r.status==='absent'||r.status==='pending');
    if(statusFilter==='early') rows = rows.filter(r=> isEarlyLeave(r.a));
    if(rows.length===0){ tbl.innerHTML = `<div class="empty-state">لا توجد نتائج مطابقة</div>`; return; }

    rows.sort((x,y)=> x.e.department.localeCompare(y.e.department,'ar') || x.e.name.localeCompare(y.e.name,'ar'));

    let bodyHtml = '';
    let curDept = null;
    rows.forEach(r=>{
      if(!deptFilter && r.e.department!==curDept){
        curDept = r.e.department;
        const cnt = rows.filter(x=>x.e.department===curDept).length;
        bodyHtml += `<tr class="dept-group-row"><td colspan="8">📁 ${esc(curDept)} (${cnt})</td></tr>`;
      }
      let pill, reasonCell='<span class="muted">—</span>';
      if(r.status==='pending') pill = `<span class="status-pill pill-neutral">⏺ لم يحضر حتى الآن</span>`;
      else if(r.status==='absent'){
        pill = `<span class="status-pill pill-bad">● غائب</span>`;
        const cur = (r.a && r.a.absenceReason) || '';
        reasonCell = cur ? esc(cur) : '<span class="muted">لم يكتب الموظف سببًا</span>';
      }
      else if(r.status==='late') pill = `<span class="status-pill pill-warn">● حاضر (متأخر)</span>`;
      else pill = `<span class="status-pill pill-good">● حاضر</span>`;
      const taskCount = r.a && r.a.tasks ? r.a.tasks.length : 0;
      const tot = tasksTotalCount(r.a && r.a.tasks);
      bodyHtml += `<tr>
        <td>${esc(r.e.name)}</td>
        <td><span class="badge-dept">${esc(r.e.department)}</span></td>
        <td>${pill}</td>
        <td>${fmtTime(r.a && r.a.checkIn)}</td>
        <td>${fmtTime(r.a && r.a.checkOut)}${isEarlyLeave(r.a) ? ' <span class="status-pill pill-warn" style="margin-right:4px;">مبكر</span>' : ''}</td>
        <td>${taskCount ? `<button class="link-btn" data-uid="${r.uid}">${taskCount} مهمة${tot?` • عدد ${tot}`:''}</button>` : '<span class="muted">—</span>'}</td>
        <td>${reasonCell}</td>
        <td>
          <div class="action-stack">
            <button class="btn btn-outline btn-sm edit-att-btn" data-uid="${r.uid}">تعديل</button>
            ${r.a ? `<button class="btn btn-danger btn-sm del-att-btn" data-uid="${r.uid}">حذف</button>` : ''}
          </div>
        </td>
      </tr>`;
    });

    tbl.innerHTML = `
      <table class="sticky-table">
        <thead><tr><th>الموظف</th><th>القسم</th><th>الحالة</th><th>وقت الحضور</th><th>وقت الانصراف</th><th>المهام</th><th>سبب الغياب</th><th>إجراءات</th></tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>
    `;
    tbl.querySelectorAll('.link-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const r = rows.find(x=>x.uid===b.dataset.uid);
        showTasksModal(r.e.name + ' — ' + fmtDate(dateStr), (r.a && r.a.tasks)||[], r.a && r.a.earlyLeaveReason);
      });
    });
    tbl.querySelectorAll('.edit-att-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const r = rows.find(x=>x.uid===b.dataset.uid);
        openEditAttendanceModal(r.uid, r.e.name, dateStr, r.a);
      });
    });
    tbl.querySelectorAll('.del-att-btn').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('هل أنت متأكد من حذف سجل حضور هذا الموظف لهذا اليوم؟ سيعود إلى حالة «غائب».')) return;
        try{
          await deleteDoc(doc(db,'attendance',`${b.dataset.uid}_${dateStr}`));
          toast('تم حذف السجل', 'ok');
        }catch(err){ console.error(err); toast('حدث خطأ أثناء الحذف', 'err'); }
      });
    });
  }

  dateInput.addEventListener('change', ()=> loadReportForDate(dateInput.value || today));
  container.querySelector('#report-today-btn').addEventListener('click', ()=>{
    dateInput.value = today;
    loadReportForDate(today);
  });
  container.querySelector('#report-status-filter').addEventListener('change', ()=> drawReport(lastDateStr, lastAttendance));
  container.querySelector('#report-dept-filter').addEventListener('change', ()=> drawReport(lastDateStr, lastAttendance));
  if(initialFilter && ['all','present','absent','early'].includes(initialFilter)){
    container.querySelector('#report-status-filter').value = initialFilter;
  }
  loadEmployees(()=> loadReportForDate(dateInput.value || today));

  container.querySelector('#stats-refresh-btn').addEventListener('click', async ()=>{
    const from = container.querySelector('#stats-from').value;
    const to = container.querySelector('#stats-to').value;
    const empFilter = container.querySelector('#stats-emp-filter').value;
    const statsTbl = container.querySelector('#stats-table');
    if(!from || !to || from>to){ toast('اختر فترة صحيحة', 'err'); return; }
    statsTbl.innerHTML = `<div class="muted" style="padding:14px;">جارِ الحساب...</div>`;
    try{
      const qs = await getDocs(query(collection(db,'attendance'), where('date','>=',from), where('date','<=',to)));
      const byUidDate = {};
      qs.forEach(d=>{ const r=d.data(); byUidDate[`${r.uid}_${r.date}`] = r; });

      const dates = [];
      let cur = new Date(from+'T12:00:00');
      const end = new Date(to+'T12:00:00');
      const now = cairoNow();
      while(cur<=end){
        const ds = cur.toISOString().slice(0,10);
        const dow = cur.getDay();
        const isFutureOrPendingToday = (ds===today && now.hour<WORK_START_HOUR) || ds>today;
        if(!WEEKEND_DAYS.includes(dow) && !isFutureOrPendingToday) dates.push(ds);
        cur.setDate(cur.getDate()+1);
      }

      let uids = Object.keys(employees).filter(uid=> employees[uid].role!=='admin');
      if(empFilter) uids = uids.filter(uid=> uid===empFilter);
      const stats = uids.map(uid=>{
        let late=0, absent=0, noWork=0, totalTasks=0, early=0;
        const days = dates.map(ds=>{
          const rec = byUidDate[`${uid}_${ds}`];
          const st = dayStatus(ds, rec);
          if(st==='absent') absent++;
          else if(st==='late') late++;
          if(isEarlyLeave(rec)) early++;
          const hasWork = rec && rec.tasks && rec.tasks.length>0;
          if(hasWork) totalTasks += rec.tasks.length;
          if((st==='present'||st==='late') && !hasWork) noWork++;
          return {date: ds, status: st, rec};
        });
        return {uid, name: employees[uid].name, dept: employees[uid].department, late, absent, early, noWork, totalTasks, days};
      }).sort((a,b)=> (b.absent+b.late) - (a.absent+a.late));

      if(stats.length===0){ statsTbl.innerHTML = `<div class="empty-state">لا يوجد موظفون مطابقون</div>`; return; }
      statsTbl.innerHTML = `
        <table class="sticky-table">
          <thead><tr><th>الموظف</th><th>القسم</th><th>إجمالي المهام</th><th>أيام التأخير</th><th>أيام الغياب</th><th>أيام الانصراف المبكر</th><th>أيام بدون إنجاز</th><th>التفاصيل</th></tr></thead>
          <tbody>${stats.map((s,i)=>`<tr>
            <td>${esc(s.name)}</td>
            <td><span class="badge-dept">${esc(s.dept)}</span></td>
            <td>${s.totalTasks ? `<span class="status-pill pill-good">${s.totalTasks}</span>` : '0'}</td>
            <td>${s.late ? `<span class="status-pill pill-warn">${s.late}</span>` : '0'}</td>
            <td>${s.absent ? `<span class="status-pill pill-bad">${s.absent}</span>` : '0'}</td>
            <td>${s.early ? `<span class="status-pill pill-warn">${s.early}</span>` : '0'}</td>
            <td>${s.noWork ? `<span class="status-pill pill-neutral">${s.noWork}</span>` : '0'}</td>
            <td><button class="link-btn detail-stat-btn" data-idx="${i}">عرض كل الأيام</button></td>
          </tr>`).join('')}</tbody>
        </table>
        <div class="small-note" style="margin:10px;">عدد أيام العمل المحسوبة في الفترة: ${dates.length} يوم (باستثناء الجمعة والسبت)</div>
      `;
      statsTbl.querySelectorAll('.detail-stat-btn').forEach(b=>{
        b.addEventListener('click', ()=> showEmployeePeriodModal(stats[+b.dataset.idx]));
      });
    }catch(err){
      console.error(err);
      statsTbl.innerHTML = `<div class="empty-state">حدث خطأ أثناء حساب الإحصائيات</div>`;
    }
  });
}

/* عرض كل أيام موظف خلال فترة */
function showEmployeePeriodModal(stat){
  const statusLabel = {present:'حاضر', late:'حاضر (متأخر)', absent:'غائب', pending:'لم يحضر بعد'};
  const statusPill = {present:'pill-good', late:'pill-warn', absent:'pill-bad', pending:'pill-neutral'};
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box" style="max-width:640px;">
        <h3>أيام ${esc(stat.name)}</h3>
        <div class="modal-sub">${esc(stat.dept)} — ${stat.days.length} يوم عمل بالفترة المختارة</div>
        <div class="table-wrap" style="max-height:60vh;">
          <table>
            <thead><tr><th>التاريخ</th><th>الحالة</th><th>الحضور</th><th>الانصراف</th><th>المهام</th><th>ملاحظات</th></tr></thead>
            <tbody>
              ${stat.days.map(d=>{
                const taskCount = d.rec && d.rec.tasks ? d.rec.tasks.length : 0;
                const tot = tasksTotalCount(d.rec && d.rec.tasks);
                return `<tr>
                  <td>${fmtDate(d.date)}</td>
                  <td><span class="status-pill ${statusPill[d.status]}">${statusLabel[d.status]}</span></td>
                  <td>${fmtTime(d.rec && d.rec.checkIn)}</td>
                  <td>${fmtTime(d.rec && d.rec.checkOut)}</td>
                  <td>${taskCount ? `<button class="link-btn day-task-btn" data-date="${d.date}">${taskCount} مهمة${tot?` • عدد ${tot}`:''}</button>` : '<span class="muted">—</span>'}</td>
                  <td>${isEarlyLeave(d.rec) ? `<span class="status-pill pill-warn">انصراف مبكر</span>` : '<span class="muted">—</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div class="modal-actions"><button class="btn btn-outline btn-block" id="ep-close-btn">إغلاق</button></div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector('#ep-close-btn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelectorAll('.day-task-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const d = stat.days.find(x=>x.date===b.dataset.date);
      showTasksModal(stat.name + ' — ' + fmtDate(d.date), (d.rec&&d.rec.tasks)||[], d.rec&&d.rec.earlyLeaveReason);
    });
  });
}

/* تعديل يدوي لسجل حضور/انصراف/مهام موظف من قبل الإدارة */
function openEditAttendanceModal(uid, name, dateStr, rec){
  function toLocalInputValue(ts){
    if(!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const parts = new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour12:false,hour:'2-digit',minute:'2-digit'}).formatToParts(d);
    const o={}; parts.forEach(p=>o[p.type]=p.value);
    return `${o.hour}:${o.minute}`;
  }
  const tasks = (rec && Array.isArray(rec.tasks)) ? rec.tasks.slice() : [];
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>تعديل سجل ${esc(name)}</h3>
        <div class="modal-sub">${fmtDate(dateStr)} — تعديل وقت الحضور والانصراف والمهام (والعدد) يدويًا</div>
        <div class="field"><label>وقت الحضور (HH:MM بتوقيت القاهرة)</label><input type="time" id="ea-checkin" value="${toLocalInputValue(rec&&rec.checkIn)}"></div>
        <div class="field"><label>وقت الانصراف (HH:MM بتوقيت القاهرة)</label><input type="time" id="ea-checkout" value="${toLocalInputValue(rec&&rec.checkOut)}"></div>
        <div class="field"><label>سبب الغياب (يكتبه الموظف عادة، ويمكن للمدير تعديله هنا)</label><textarea id="ea-absence-reason" placeholder="اكتب السبب هنا...">${esc((rec&&rec.absenceReason)||'')}</textarea></div>
        <div class="field">
          <label>المهام (المهمة + العدد الاختياري)</label>
          <div id="ea-tasks-list"></div>
          <button class="btn btn-outline btn-sm" id="ea-add-task" type="button">+ إضافة مهمة</button>
        </div>
        <div class="error-text" id="ea-err" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="ea-cancel">إلغاء</button>
          <button class="btn btn-primary" id="ea-save">حفظ التعديلات</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const list = overlay.querySelector('#ea-tasks-list');
  function addRow(t){
    t = t || {};
    const cntVal = (t.count!==undefined && t.count!==null) ? t.count : '';
    const row = el(`<div class="task-input-row">
      <input type="text" class="ea-task-input" value="${esc(t.text||'')}" placeholder="اكتب المهمة...">
      <input type="text" class="ea-task-count" value="${esc(cntVal)}" placeholder="العدد" style="flex:none;width:80px;text-align:center;">
      <button type="button" class="remove-x">×</button>
    </div>`);
    row.querySelector('.remove-x').addEventListener('click', ()=> row.remove());
    list.appendChild(row);
  }
  (tasks.length?tasks:[{}]).forEach(addRow);
  overlay.querySelector('#ea-add-task').addEventListener('click', ()=> addRow());
  overlay.querySelector('#ea-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#ea-save').addEventListener('click', async ()=>{
    const errBox = overlay.querySelector('#ea-err');
    errBox.style.display='none';
    const ciVal = overlay.querySelector('#ea-checkin').value;
    const coVal = overlay.querySelector('#ea-checkout').value;
    const newTasks = [...overlay.querySelectorAll('#ea-tasks-list .task-input-row')].map(r=>{
      const text = r.querySelector('.ea-task-input').value.trim();
      const cnt = normalizeDigits(r.querySelector('.ea-task-count').value).trim();
      if(!text) return null;
      const o = {text};
      if(cnt!=='' && !isNaN(Number(cnt))) o.count = Number(cnt);
      return o;
    }).filter(Boolean);
    function toTimestamp(hhmm){
      if(!hhmm) return null;
      const [h,m] = hhmm.split(':').map(Number);
      const iso = `${dateStr}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;
      const d = new Date(iso+'+02:00');
      return Timestamp.fromDate(d);
    }
    const btn = overlay.querySelector('#ea-save');
    btn.disabled=true; btn.textContent='جارِ الحفظ...';
    try{
      const payload = { uid, date: dateStr, tasks: newTasks };
      payload.checkIn = ciVal ? toTimestamp(ciVal) : null;
      payload.checkOut = coVal ? toTimestamp(coVal) : null;
      payload.absenceReason = overlay.querySelector('#ea-absence-reason').value.trim() || null;
      await setDoc(doc(db,'attendance',`${uid}_${dateStr}`), payload, {merge:true});
      toast('تم حفظ التعديلات', 'ok');
      overlay.remove();
    }catch(err){
      console.error(err);
      errBox.textContent='حدث خطأ أثناء الحفظ';
      errBox.style.display='block';
      btn.disabled=false; btn.textContent='حفظ التعديلات';
    }
  });
}

function showTasksModal(name, tasks, earlyReason){
  const total = tasksTotalCount(tasks);
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>مهام ${esc(name)}</h3>
        <div class="modal-sub">${(tasks&&tasks.length)||0} مهمة${total?` — إجمالي العدد: ${total}`:''}</div>
        ${earlyReason ? `<div class="small-note" style="margin-bottom:12px;"><b>سبب الانصراف المبكر:</b> ${esc(earlyReason)}</div>` : ''}

/* ---- إنجازات الموظفين (مهام النوتة اليومية) ---- */
function renderAdminAchievements(container){
  const today = todayCairoStr();
  container.innerHTML = `
    <div class="card">
      <div class="flex-between" style="margin-bottom:6px;">
        <h3 style="margin:0;">📊 إحصائيات التقنين الإجمالية</h3>
        <button class="btn btn-outline btn-sm" id="stats-refresh-btn">🔄 تحديث</button>
      </div>
      <div class="filter-bar filter-bar-oneline">
        <label class="muted" style="font-size:12.5px;">من</label>
        <input type="date" id="cards-from">
        <label class="muted" style="font-size:12.5px;">إلى</label>
        <input type="date" id="cards-to">
        <button class="btn btn-outline btn-sm" id="cards-all-time">اليوم الحالي</button>
      </div>
      <div id="emp-stat-cards"><div class="muted">جارِ التحميل...</div></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h3 style="margin:0;">🌟 إنجازات الموظفين</h3>
      <div class="card-sub">تتحدث لحظيًا عند إضافة أي إنجاز جديد — اختر يومًا لعرض إنجازات كل الموظفين فيه، أو موظفًا لعرض كل إنجازاته عبر الأيام</div>
      <div class="filter-bar filter-bar-oneline">
        <label class="muted" style="font-size:12.5px;">اليوم</label>
        <input type="date" id="ach-date" value="${today}" max="${today}">
        <select id="ach-emp-filter"><option value="">كل الموظفين (لليوم المحدد)</option></select>
      </div>
      <div class="table-wrap" id="ach-list"><div class="muted" style="padding:14px;">جارِ التحميل...</div></div>
    </div>
  `;

  let employees = {};
  let liveUnsub = null;

  /* ---- كروت الإحصائيات الإجمالية (تحميل مرة واحدة + زر تحديث لتقليل قراءات فيربيس) ---- */
  let allReqRows = [];
  async function loadStatsCards(){
    const btn = container.querySelector('#stats-refresh-btn');
    if(btn){ btn.disabled=true; btn.textContent='جارِ التحديث...'; }
    try{
      const reqSnap = await getDocs(collection(db,'tokeenRequests'));
      allReqRows = []; reqSnap.forEach(d=> allReqRows.push({id:d.id, ...d.data()}));
      drawCards();
    }catch(err){ console.error(err); }
    if(btn){ btn.disabled=false; btn.textContent='🔄 تحديث'; }
  }
  function drawCards(){
    const cardsBox = container.querySelector('#emp-stat-cards');
    if(!cardsBox) return;
    const from = container.querySelector('#cards-from').value;
    const to = container.querySelector('#cards-to').value;
    const baseRows = allReqRows.filter(r=> !employees[r.uid] || employees[r.uid].role!=='admin');
    const istifaCount = baseRows.filter(r=> r.istifa && !r.done).length;

    let totalTarget, totalDone, totalRemain;
    if(!from && !to){
      const s = rolloverStats(baseRows);
      totalTarget = s.target; totalDone = s.done; totalRemain = s.target - s.done;
    }else{
      const rows = baseRows.filter(r=>{
        if(r.istifa && !r.done) return false;
        const d = String(r.date||'');
        if(from && d<from) return false;
        if(to && d>to) return false;
        return true;
      });
      totalTarget = rows.length;
      totalDone = rows.filter(r=>r.done).length;
      totalRemain = totalTarget - totalDone;
    }
    if(totalTarget===0 && istifaCount===0){ cardsBox.innerHTML = `<div class="empty-state">لا توجد طلبات في هذه الفترة</div>`; return; }
    cardsBox.innerHTML = `
      <div class="stat-row" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-box"><div class="num">${totalTarget}</div><div class="lbl">إجمالي المستهدف</div></div>
        <div class="stat-box" style="background:var(--good-bg);"><div class="num" style="color:var(--good);">${totalDone}</div><div class="lbl">إجمالي ما تم</div></div>
        <div class="stat-box" style="background:var(--bad-bg);"><div class="num" style="color:var(--bad);">${totalRemain}</div><div class="lbl">المتبقي</div></div>
        <div class="stat-box" style="background:var(--warn-bg);"><div class="num" style="color:var(--warn);">${istifaCount}</div><div class="lbl">قيد الاستيفاء (خارج الحساب)</div></div>
      </div>`;
  }
  container.querySelector('#stats-refresh-btn').addEventListener('click', loadStatsCards);
  container.querySelector('#cards-from').addEventListener('change', drawCards);
  container.querySelector('#cards-to').addEventListener('change', drawCards);
  container.querySelector('#cards-all-time').addEventListener('click', ()=>{
    container.querySelector('#cards-from').value='';
    container.querySelector('#cards-to').value='';
    drawCards();
  });

  /* ---- إنجازات الموظفين (مباشر Live) ---- */
  function taskListHTML(tasks){
    if(!tasks || tasks.length===0) return '<span class="muted">—</span>';
    return `<div class="task-mini-list">${tasks.map((t,i)=>`
      <div class="task-mini-row">
        <span class="tm-num">${i+1}.</span>
        <span class="tm-text">${esc(t.text||'')}</span>
        ${(t.count!==undefined&&t.count!==null&&t.count!=='')?`<span class="tm-count">عدد ${esc(t.count)}</span>`:''}
        ${t.at?`<span class="tm-time">${fmtTime(t.at)}</span>`:''}
      </div>`).join('')}</div>`;
  }

  async function loadEmployeesOnce(){
    try{
      const qs = await getDocs(collection(db,'employees'));
      employees = {}; qs.forEach(d=> employees[d.id]=d.data());
      const sel = container.querySelector('#ach-emp-filter');
      if(!sel) return;
      const cur = sel.value;
      const uids = Object.keys(employees).filter(uid=>employees[uid].role!=='admin')
        .sort((a,b)=> employees[a].name.localeCompare(employees[b].name,'ar'));
      sel.innerHTML = `<option value="">كل الموظفين (لليوم المحدد)</option>` +
        uids.map(uid=>`<option value="${uid}">${esc(employees[uid].name)}</option>`).join('');
      sel.value = cur;
    }catch(err){ console.error(err); }
  }

  function renderDayOverview(box, dateVal, taskRows){
    const empUids = Object.keys(employees).filter(uid=>employees[uid].role!=='admin');
    if(empUids.length===0){ box.innerHTML = `<div class="empty-state">لا يوجد موظفون بعد</div>`; return; }
    const byUid = {};
    taskRows.forEach(r=> byUid[r.uid]=r);
    const withTasks = [], withoutTasks = [];
    empUids.forEach(uid=>{
      const r = byUid[uid];
      if(r && r.tasks && r.tasks.length>0) withTasks.push(uid); else withoutTasks.push(uid);
    });
    withTasks.sort((a,b)=> employees[a].name.localeCompare(employees[b].name,'ar'));
    withoutTasks.sort((a,b)=> employees[a].name.localeCompare(employees[b].name,'ar'));
    const ordered = [...withTasks, ...withoutTasks];
    box.innerHTML = `
      <table class="sticky-table">
        <thead><tr><th>الموظف</th><th>القسم</th><th>المهام المنجزة</th></tr></thead>
        <tbody>${ordered.map(uid=>{
          const r = byUid[uid];
          const hasTasks = r && r.tasks && r.tasks.length>0;
          return `<tr${hasTasks?'':' class="row-no-ach"'}>
            <td><b>${esc(employees[uid].name)}</b></td>
            <td><span class="badge-dept">${esc(employees[uid].department||'')}</span></td>
            <td>${hasTasks ? taskListHTML(r.tasks) : '<span class="muted">لم يتم تسجيل أي إنجاز</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
  }

  function renderEmployeeHistory(box, emp, rows){
    if(!emp){ box.innerHTML = `<div class="empty-state">موظف غير معروف</div>`; return; }
    if(rows.length===0){ box.innerHTML = `<div class="empty-state">لا توجد إنجازات مسجلة لهذا الموظف بعد</div>`; return; }
    const grandTasks = rows.reduce((s,r)=> s + r.tasks.length, 0);
    const grandCount = rows.reduce((s,r)=> s + tasksTotalCount(r.tasks), 0);
    box.innerHTML = `
      <div class="stat-row" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px;">
        <div class="stat-box"><div class="num">${rows.length}</div><div class="lbl">عدد الأيام اللي فيها إنجاز</div></div>
        <div class="stat-box"><div class="num">${grandTasks}</div><div class="lbl">إجمالي المهام${grandCount?` (عدد ${grandCount})`:''}</div></div>
      </div>
      <table class="sticky-table">
        <thead><tr><th>التاريخ</th><th>المهام المنجزة</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr><td><b>${fmtDate(r.date)}</b></td><td>${taskListHTML(r.tasks)}</td></tr>
        `).join('')}</tbody>
      </table>`;
  }

  function subscribe(){
    if(liveUnsub){ liveUnsub(); liveUnsub=null; }
    const listBox = container.querySelector('#ach-list');
    listBox.innerHTML = `<div class="muted" style="padding:14px;">جارِ التحميل...</div>`;
    const empFilter = container.querySelector('#ach-emp-filter').value;
    const dateVal = container.querySelector('#ach-date').value || today;

    if(empFilter){
      liveUnsub = onSnapshot(query(collection(db,'attendance'), where('uid','==',empFilter)), qs=>{
        let rows = []; qs.forEach(d=> rows.push(d.data()));
        rows = rows.filter(r=> r.tasks && r.tasks.length>0);
        rows.sort((a,b)=> String(b.date||'').localeCompare(String(a.date||'')));
        renderEmployeeHistory(listBox, employees[empFilter], rows);
      }, err=>{ console.error(err); listBox.innerHTML = `<div class="empty-state">تعذر تحميل البيانات</div>`; });
    }else{
      liveUnsub = onSnapshot(query(collection(db,'attendance'), where('date','==',dateVal)), qs=>{
        let rows = []; qs.forEach(d=> rows.push(d.data()));
        rows = rows.filter(r=> !employees[r.uid] || employees[r.uid].role!=='admin');
        renderDayOverview(listBox, dateVal, rows);
      }, err=>{ console.error(err); listBox.innerHTML = `<div class="empty-state">تعذر تحميل البيانات</div>`; });
    }
    unsubList.push(()=>{ if(liveUnsub) liveUnsub(); });
  }

  container.querySelector('#ach-date').addEventListener('change', subscribe);
  container.querySelector('#ach-emp-filter').addEventListener('change', subscribe);
  loadEmployeesOnce().then(()=>{ subscribe(); loadStatsCards(); });
}

  }

  const u = onSnapshot(collection(db,'employees'), qs=>{
    allEmps = []; qs.forEach(d=> allEmps.push({id:d.id, ...d.data()}));
    if(allEmps.length===0){ container.querySelector('#emp-table').innerHTML = `<div class="empty-state">لا يوجد مستخدمون بعد</div>`; return; }
    draw();
  }, err=>console.error(err));
  unsubList.push(u);
  container.querySelector('#emp-search').addEventListener('input', draw);
  container.querySelector('#emp-dept-filter').addEventListener('change', draw);
}

      if(cur) empSelect.value = cur;
    }
    container.querySelectorAll('.dist-emp-select').forEach(sel=>{

  unsubList.push(u);

      container.querySelector('#up-center-other').style.display = (e.target.value==='__other__') ? 'block' : 'none';

  let parsedRows = [];

  function empSelectOptions(){
    return `<option value="">-- اختر الموظف --</option>` +
      employeesList.map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.department)})</option>`).join('');

        if(json.length===0){ toast('الملف فارغ أو غير صالح', 'err'); return; }
        const rawCols = Object.keys(json[0]);
        detectedCenterCol = detectCenterColumn(rawCols);

        let cols = filterAllowedCols(rawCols).sort((a,b)=> ALLOWED_DATA_COLUMNS.indexOf(String(a).trim().toLowerCase()) - ALLOWED_DATA_COLUMNS.indexOf(String(b).trim().toLowerCase()));
        if(cols.length===0) cols = rawCols;
        const keepCols = detectedCenterCol && !cols.includes(detectedCenterCol) ? [...cols, detectedCenterCol] : cols;
        parsedRows = json.map(row=>{
          const o = {};
          keepCols.forEach(c=> o[c] = row[c]);
          return o;
        });

        container.querySelector('#up-req-field').innerHTML = cols.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
        container.querySelector('#up-reqfield-wrap').style.display='block';

        centersMap = {};
        if(detectedCenterCol){
          parsedRows.forEach(row=>{
            const c = String(row[detectedCenterCol]||'').trim() || 'غير محدد';

          });
        }
        const centerNames = Object.keys(centersMap);
        const noteBox = container.querySelector('#up-detect-note');
        noteBox.style.display='block';

        const singleWrap = container.querySelector('#up-single-wrap');
        const multiWrap = container.querySelector('#up-multi-wrap');

        if(centerNames.length>1){
          noteBox.textContent = `تم العثور على ${json.length} صف بعمود المركز "${detectedCenterCol}" — عدد المراكز: ${centerNames.length}. وزّع كل مركز على الموظف المناسب (يمكن اختيار نفس الموظف لأكثر من مركز).`;
          singleWrap.style.display='none';
          multiWrap.style.display='block';
          container.querySelector('#up-center-chips').innerHTML = centerNames.map((c)=>`
            <div class="center-chip">
              <div>
                <div class="cc-name">${esc(c)}</div>
                <div class="cc-count">${centersMap[c].length} طلب</div>
              </div>
              <select class="dist-emp-select" data-center="${esc(c)}">${empSelectOptions()}</select>
            </div>
          `).join('');

          const autoCenter = centerNames.length===1 ? centerNames[0] : '';
          noteBox.textContent = detectedCenterCol

            : `تم العثور على ${json.length} صف بالأعمدة: ${cols.join('، ')} — لم يتم العثور على عمود مركز، اكتب المركز يدويًا`;
          multiWrap.style.display='none';
          singleWrap.style.display='block';
          if(autoCenter){
            const centerSel = container.querySelector('#up-center');
            const opt = [...centerSel.options].find(o=>o.value===autoCenter);
            if(opt) centerSel.value = autoCenter;
            else{ centerSel.value='__other__'; container.querySelector('#up-center-other').style.display='block'; container.querySelector('#up-center-other').value = autoCenter; }
          }

      }catch(err){
        console.error(err);
        toast('تعذر قراءة الملف، تأكد من الصيغة', 'err');
      }
    };
    reader.readAsArrayBuffer(file);
  });

  async function saveFileRecord(centersUsed, batchIds){
    if(!currentFile) return;
    let storagePath = null, downloadURL = null, storageOk = true;
    try{
      storagePath = `tokeenFiles/${Date.now()}_${currentFile.name}`;
      const sref = storageRef(storage, storagePath);
      await uploadBytes(sref, currentFile);
      downloadURL = await getDownloadURL(sref);
    }catch(err){
      console.error('storage upload error', err);
      storageOk = false;
      storagePath = null;
      downloadURL = null;
    }
    try{
      await setDoc(doc(collection(db,'tokeenFiles')), {
        fileName: currentFile.name, storagePath, downloadURL,
        uploaderUid: currentUser.uid, uploaderName: currentEmployee.name,
        uploadedAt: serverTimestamp(), rowCount: parsedRows.length, centers: centersUsed,
        batchIds: batchIds
      });
      if(!storageOk){
        toast('تم رفع الطلبات وتسجيل الملف في القائمة، لكن تعذر حفظ نسخة الملف نفسها للتنزيل (تحقق من إعدادات Firebase Storage)', 'err');
      }
    }catch(err){
      console.error('file record save error', err);
      toast('تم رفع الطلبات بنجاح، لكن حدث خطأ أثناء تسجيل الملف في قائمة الملفات المرفوعة', 'err');
    }
  }

  async function uploadRowsFor(uid, center, rows, reqField){
    const batchId = `b_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
    const today = todayCairoStr();
    const chunkSize = 450;
    for(let i=0;i<rows.length;i+=chunkSize){
      const chunk = rows.slice(i, i+chunkSize);
      const batch = writeBatch(db);
      chunk.forEach(row=>{
        const ref2 = doc(collection(db,'tokeenRequests'));
        batch.set(ref2, {
          uid, center, date: today, batchId, reqField,
          data: row, done:false, doneAt:null, doneDate:null, istifa:false, uploadedAt: serverTimestamp()
        });
      });
      await batch.commit();
    }
    return batchId;
  }

  function nameOf(uid){
    const e = employeesList.find(x=>x.id===uid);
    return e ? e.name : 'غير معروف';
  }

  /* يجيب كل الطلبات السابقة لموظف/مركز معيّن (وليس فقط المتبقي) عشان المدير يشوف
     كان مستهدف كام وأنجز قد إيه قبل ما يقرر يضيف فوقها أو يستبدلها */
  async function getPastStatsFor(uid, center){
    try{
      const qs = await getDocs(query(collection(db,'tokeenRequests'),
        where('uid','==',uid), where('center','==',center)));
      const all = qs.docs.map(d=>({id:d.id, ...d.data()}));
      const doneRows = all.filter(r=>r.done);
      const pendingRows = all.filter(r=>!r.done);
      return { all, pendingIds: pendingRows.map(r=>r.id), target: all.length, done: doneRows.length, remaining: pendingRows.length };
    }catch(err){ console.error(err); return { all:[], pendingIds:[], target:0, done:0, remaining:0 }; }
  }

  async function deleteRequestsBulk(ids){
    const chunkSize = 450;
    for(let i=0;i<ids.length;i+=chunkSize){
      const chunk = ids.slice(i,i+chunkSize);
      const batch = writeBatch(db);
      chunk.forEach(id=> batch.delete(doc(db,'tokeenRequests', id)));
      await batch.commit();
    }
  }

  function confirmAddOrReplace(items){
    return new Promise(resolve=>{
      const overlay = el(`
        <div class="modal-overlay">
          <div class="modal-box" style="max-width:520px;">
            <h3>⚠️ يوجد توزيعة سابقة لهذا المركز/الموظف</h3>
            <div class="modal-sub">قبل ما تقرر، دي حالة التوزيعة الماضية:</div>
            <div style="margin-bottom:14px;">
              ${items.map(it=>`
                <div class="small-note" style="margin-bottom:10px;">
                  <b>${esc(it.center)}</b> — ${esc(nameOf(it.uid))}
                  <div class="stat-row" style="grid-template-columns:repeat(3,1fr);margin:8px 0 0;">
                    <div class="stat-box"><div class="num">${it.target}</div><div class="lbl">كان المستهدف</div></div>
                    <div class="stat-box" style="background:var(--good-bg);"><div class="num" style="color:var(--good);">${it.done}</div><div class="lbl">تم إنجازه</div></div>
                    <div class="stat-box" style="background:var(--bad-bg);"><div class="num" style="color:var(--bad);">${it.remaining}</div><div class="lbl">متبقٍ الآن</div></div>
                  </div>
                </div>`).join('')}
            </div>
            <div class="modal-sub">هل تريد إضافة الطلبات الجديدة فوق المتبقي، أم حذف المتبقي القديم أولًا واستبداله بالجديد؟ (الطلبات المُدخَلة فعليًا تبقى محفوظة في السجل دائمًا ولا تتأثر مطلقًا في الحالتين)</div>
            <div class="modal-actions" style="flex-direction:column;gap:8px;">
              <button class="btn btn-primary btn-block" id="aor-add">➕ إضافة فوق المتبقي</button>
              <button class="btn btn-danger btn-block" id="aor-replace">🗑 حذف المتبقي القديم واستبداله</button>
              <button class="btn btn-outline btn-block" id="aor-cancel">إلغاء الرفع</button>
            </div>
          </div>
        </div>
      `);
      document.body.appendChild(overlay);
      function finish(v){ overlay.remove(); resolve(v); }
      overlay.querySelector('#aor-add').addEventListener('click', ()=> finish('add'));
      overlay.querySelector('#aor-replace').addEventListener('click', ()=> finish('replace'));
      overlay.querySelector('#aor-cancel').addEventListener('click', ()=> finish('cancel'));
      overlay.addEventListener('click', e=>{ if(e.target===overlay) finish('cancel'); });
    });
  }

  container.querySelector('#up-submit-single-btn').addEventListener('click', async ()=>{
    const errBox = container.querySelector('#up-err');
    errBox.style.display='none';
    const uid = container.querySelector('#up-emp').value;
    let center = container.querySelector('#up-center').value;
    if(center==='__other__') center = container.querySelector('#up-center-other').value.trim();
    const reqField = container.querySelector('#up-req-field') ? container.querySelector('#up-req-field').value : '';
    if(!uid || !center || parsedRows.length===0 || !reqField){
      errBox.textContent = 'من فضلك أكمل كل الحقول وارفع ملف صالح';
      errBox.style.display='block';
      return;
    }
    const btn = container.querySelector('#up-submit-single-btn');
    btn.disabled=true; btn.textContent='جارِ التحقق...';
    try{
      const past = await getPastStatsFor(uid, center);
      let deletedCount = 0;
      if(past.target>0){
        const choice = await confirmAddOrReplace([{center, uid, target: past.target, done: past.done, remaining: past.remaining}]);
        if(choice==='cancel' || !choice){ btn.disabled=false; btn.textContent='رفع الطلبات للموظف'; return; }
        if(choice==='replace' && past.pendingIds.length>0){
          btn.textContent='جارِ حذف المتبقي القديم...';
          await deleteRequestsBulk(past.pendingIds);
          deletedCount = past.pendingIds.length;
        }
      }
      btn.textContent='جارِ الرفع...';
      const batchId = await uploadRowsFor(uid, center, parsedRows, reqField);
      await saveFileRecord([center], [batchId]);
      toast(`تم رفع ${parsedRows.length} طلب بنجاح${deletedCount?` (بعد حذف ${deletedCount} طلب متبقٍ قديم)`:''}`, 'ok');
      resetForm();
