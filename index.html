<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز شبكات المرافق - محافظة المنيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f3f6fb;
    --card:#ffffff;
    --border:#e3e8f0;
    --ink:#1b2635;
    --sub:#6b7688;
    --brand:#0d6e6e;
    --brand-dark:#095656;
    --brand-light:#e6f4f4;
    --accent:#2f6fed;
    --good:#1e9e6b;
    --good-bg:#e8f8f1;
    --warn:#c9852b;
    --warn-bg:#fdf2e2;
    --bad:#d6483f;
    --bad-bg:#fceceb;
    --radius:14px;
    --shadow:0 2px 10px rgba(20,30,60,.06), 0 1px 2px rgba(20,30,60,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  button, input, select, textarea{font-family:inherit;}
  button{cursor:pointer;}
  #app-root{min-height:100vh;display:flex;flex-direction:column;}

  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
  .brand-block{text-align:center;margin-bottom:28px;}
  .brand-block .logo-circle{
    width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:32px;font-weight:800;
    box-shadow:var(--shadow);
  }
  .brand-block h1{font-size:22px;margin:0 0 4px;font-weight:800;}
  .brand-block p{color:var(--sub);margin:0;font-size:14px;}
  .auth-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;width:100%;max-width:400px;border:1px solid var(--border);}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--brand);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .load-text{margin-top:14px;color:var(--sub);font-size:14px;}

  .form-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px;width:100%;max-width:440px;border:1px solid var(--border);}
  .form-card h2{margin:0 0 4px;font-size:19px;}
  .form-card .hint{color:var(--sub);font-size:13px;margin-bottom:20px;}
  .field{margin-bottom:16px;text-align:right;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink);}
  .field input[type=text], .field input[type=tel], .field input[type=password], .field select, .field input[type=email], .field input[type=number], .field textarea{
    width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;background:#fbfcfe;color:var(--ink);transition:.15s;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--brand);background:#fff;}
  .field input:disabled{background:#eef1f6;color:var(--sub);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:9px;border:none;font-weight:700;font-size:14px;transition:.15s;}
  .btn-primary{background:var(--brand);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-primary:disabled{background:#a9c3c3;cursor:not-allowed;}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--ink);}
  .btn-outline:hover{border-color:var(--brand);color:var(--brand);}
  .btn-danger{background:var(--bad);color:#fff;}
  .btn-danger:hover{background:#b83a32;}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn-block{width:100%;}
  .btn-auto{width:auto;}
  .error-text{color:var(--bad);font-size:13px;margin-top:8px;}

  .topbar{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 22px;position:sticky;top:0;z-index:20;}
  .topbar .left{display:flex;align-items:center;gap:12px;}
  .topbar .logo-circle{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none;}
  .topbar .title{font-weight:800;font-size:15.5px;line-height:1.2;}
  .topbar .subtitle{font-size:11.5px;color:var(--sub);}
  .topbar .right{display:flex;align-items:center;gap:12px;}
  .user-chip{display:flex;align-items:center;gap:8px;}
  .user-chip .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .user-chip .u-name{font-size:13.5px;font-weight:700;}
  .user-chip .u-dept{font-size:11px;color:var(--sub);}

  .tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto;position:sticky;top:57px;z-index:19;}
  .tab-btn{padding:13px 16px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap;}
  .tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);}

  .container{max-width:1100px;margin:0 auto;width:100%;padding:22px 18px 60px;flex:1;}
  .grid{display:grid;gap:18px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media(max-width:760px){.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
  .card h3{margin:0 0 14px;font-size:15.5px;display:flex;align-items:center;gap:8px;}
  .card .card-sub{color:var(--sub);font-size:12.5px;margin-top:-10px;margin-bottom:14px;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:700;}
  .pill-good{background:var(--good-bg);color:var(--good);}
  .pill-warn{background:var(--warn-bg);color:var(--warn);}
  .pill-bad{background:var(--bad-bg);color:var(--bad);}
  .pill-neutral{background:#eef1f6;color:var(--sub);}

  .time-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .time-row:last-child{border-bottom:none;}
  .time-row .lbl{color:var(--sub);font-size:13px;}
  .time-row .val{font-weight:800;font-size:16px;}

  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;}
  th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;background:#fff;}
  th{color:var(--sub);font-weight:700;font-size:12px;background:#fafbfd;}
  .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:70vh;}
  .table-wrap table{border:none;}

  .col-action{position:sticky;right:0;z-index:3;min-width:132px;box-shadow:-6px 0 8px -6px rgba(20,30,60,.25);}
  thead .col-action{z-index:5;}
  tr.row-done td{background:var(--good-bg);}
  tr.row-done .col-action{background:var(--good-bg);}
  .action-stack{display:flex;align-items:center;gap:6px;}
  .btn-enter{background:var(--brand);color:#fff;}
  .btn-enter:hover{background:var(--brand-dark);}
  .btn-entered{background:var(--good);color:#fff;}

  .stat-box{background:var(--brand-light);border-radius:12px;padding:16px;text-align:center;}
  .stat-box .num{font-size:26px;font-weight:800;color:var(--brand-dark);}
  .stat-box .lbl{font-size:12px;color:var(--sub);margin-top:2px;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}

  .task-input-row{display:flex;gap:8px;margin-bottom:8px;}
  .task-input-row input{flex:1;padding:11px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;}
  .remove-x{background:var(--bad-bg);color:var(--bad);border:none;border-radius:7px;width:34px;flex:none;font-weight:800;font-size:15px;}
  .task-chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-light);color:var(--brand-dark);padding:4px 10px;border-radius:16px;font-size:12px;margin:2px 4px 2px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,25,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-box{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;}
  .modal-box h3{margin:0 0 6px;font-size:17px;}
  .modal-box .modal-sub{color:var(--sub);font-size:13px;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn{flex:1;}

  .badge-dept{padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700;background:#eef1f6;color:var(--ink);}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);z-index:200;max-width:90vw;text-align:center;}
  .toast.err{background:var(--bad);}
  .toast.ok{background:var(--good);}

  .subtab-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .subtab-btn{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;color:var(--sub);}
  .subtab-btn.active{background:var(--brand);border-color:var(--brand);color:#fff;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--sub);}
  .empty-state .emoji{font-size:34px;margin-bottom:8px;}

  .progress-bar{height:8px;background:#eef1f6;border-radius:6px;overflow:hidden;}
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:6px;transition:.3s;}

  .leader-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .leader-row:last-child{border-bottom:none;}
  .leader-rank{width:26px;height:26px;border-radius:50%;background:#eef1f6;color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;}
  .leader-rank.top1{background:#ffd76a;color:#7a5600;}
  .leader-rank.top2{background:#d9e2ee;color:#3c4a5f;}
  .leader-rank.top3{background:#e8c39e;color:#6b3f16;}
  .leader-name{font-weight:700;font-size:13.5px;flex:1;}
  .leader-dept{font-size:11px;color:var(--sub);}
  .leader-nums{font-size:12.5px;color:var(--sub);font-weight:700;white-space:nowrap;}

  .link-btn{background:none;border:none;color:var(--brand);font-weight:700;font-size:12.5px;padding:0;}
  .muted{color:var(--sub);}
  .flex-between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .small-note{font-size:12px;color:var(--sub);background:#fafbfd;border:1px dashed var(--border);border-radius:8px;padding:10px 12px;}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filter-bar input[type=text], .filter-bar select, .filter-bar input[type=date]{padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:13.5px;background:#fbfcfe;}
  .filter-bar input[type=text]{flex:1;min-width:190px;}
  .filter-bar-oneline{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;}
  .filter-bar-oneline select, .filter-bar-oneline input{flex-shrink:0;}
  .filter-bar-oneline input[type=text]{flex-shrink:1;min-width:140px;}

  .sticky-table thead th{position:sticky;top:0;z-index:4;}
  .sticky-table td:first-child, .sticky-table th:first-child{position:sticky;right:0;z-index:3;box-shadow:-6px 0 8px -6px rgba(20,30,60,.15);}
  .sticky-table thead th:first-child{z-index:6;}
  .dept-group-row td{background:var(--brand-light)!important;color:var(--brand-dark);font-weight:800;font-size:12.5px;padding:8px 10px;position:sticky;right:0;}

  .file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .file-row:last-child{border-bottom:none;}
  .file-row .f-info{flex:1;min-width:0;}
  .file-row .f-name{font-weight:700;font-size:13.5px;cursor:pointer;color:var(--accent);word-break:break-all;}
  .file-row .f-name:hover{text-decoration:underline;}
  .file-row .f-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}

  .emp-stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
  .emp-stat-card .es-name{font-weight:800;font-size:14px;margin-bottom:2px;}
  .emp-stat-card .es-dept{font-size:11.5px;color:var(--sub);margin-bottom:10px;}
  .emp-stat-card .es-centers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
  .emp-stat-card .es-centers .badge-dept{font-size:10.5px;padding:2px 7px;}
  .emp-stat-card .stat-row{margin-bottom:0;gap:6px;}
  .emp-stat-card .stat-box{padding:8px 4px;border-radius:9px;}
  .emp-stat-card .stat-box .num{font-size:18px;}
  .emp-stat-card .stat-box .lbl{font-size:10px;}
  .emp-stat-card .es-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .emp-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}

  .center-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafbfd;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .center-chip .cc-name{font-weight:700;font-size:13.5px;}
  .center-chip .cc-count{font-size:11.5px;color:var(--sub);}
  .center-chip select{min-width:200px;}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  updatePassword, EmailAuthProvider, reauthenticateWithCredential,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where,
  onSnapshot, serverTimestamp, writeBatch, orderBy, Timestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

/* ============ Firebase config ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDb0dlyt1NxIUKWY1ZJr7Q57oJHF3L2wMU",
  authDomain: "maktap-5e392.firebaseapp.com",
  projectId: "maktap-5e392",
  storageBucket: "maktap-5e392.firebasestorage.app",
  messagingSenderId: "924906001862",
  appId: "1:924906001862:web:677e567c0918136bba4ec7",
  measurementId: "G-Q0YKHQTK0Y"
};

/* ============ إعدادات عامة ============ */
const ADMIN_USERNAME = "عبدالستار";      // اسم مستخدم المدير الأساسي
const ADMIN_PASSWORD = "123123";          // كلمة المرور الافتراضية لأول تشغيل فقط
const LOGIN_DOMAIN   = "maktap.local";    // نطاق داخلي لتحويل اسم المستخدم لحساب Firebase

const DEPARTMENTS = ["GIS", "قسم الرفع المساحي", "قسم مهندسين المساحة"];
const DEFAULT_CENTERS = [
  "مركز المنيا","مركز ملوي","مركز ديرمواس","مركز مطاي","مركز سمالوط",
  "مركز أبوقرقاص","مركز مغاغة","مركز بني مزار","مركز العدوة"
];
const WORK_START_HOUR = 9;
const WEEKEND_DAYS = [5,6];

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const storage = getStorage(app);
/* نسخة ثانية من التطبيق تُستخدم لإنشاء المستخدمين دون تسجيل خروج المدير */
const secondaryApp  = initializeApp(firebaseConfig, 'user-creator');
const secondaryAuth = getAuth(secondaryApp);

const root = document.getElementById('app-root');

/* ============ Helpers ============ */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normUser(u){ return String(u||'').trim().replace(/\s+/g,' ').toLowerCase(); }
/* اسم المستخدم (عربي أو إنجليزي) يتحول لبريد داخلي صالح بصيغة hex */
function userToEmail(username){
  const bytes = new TextEncoder().encode(normUser(username));
  let hex=''; bytes.forEach(b=> hex += b.toString(16).padStart(2,'0'));
  return `u${hex}@${LOGIN_DOMAIN}`;
}
function todayCairoStr(){
  return new Intl.DateTimeFormat('en-CA', {timeZone:'Africa/Cairo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
}
function cairoNow(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone:'Africa/Cairo', hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit',
    year:'numeric', month:'2-digit', day:'2-digit'
  }).formatToParts(new Date());
  const o={}; parts.forEach(p=>o[p.type]=p.value);
  return { hour:+o.hour, minute:+o.minute, second:+o.second, dateStr:`${o.year}-${o.month}-${o.day}` };
}
function fmtTime(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return new Intl.DateTimeFormat('ar-EG', {timeZone:'Africa/Cairo', hour:'2-digit', minute:'2-digit', hour12:true}).format(d);
}
function fmtDateTime(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return new Intl.DateTimeFormat('ar-EG', {timeZone:'Africa/Cairo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true}).format(d);
}
function fmtDate(str){
  if(!str) return '—';
  const [y,m,d]=String(str).split('-');
  return `${d}/${m}/${y}`;
}
function doneDateOf(r){
  if(r.doneDate) return r.doneDate;
  if(r.doneAt){
    const d = r.doneAt.toDate ? r.doneAt.toDate() : new Date(r.doneAt);
    return new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  }
  return '';
}
function toast(msg, type=''){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = el(`<div class="toast ${type}">${esc(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function normalizeDigits(s){
  return String(s||'').replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
                      .replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
/* تعرّف تلقائي على عمود "المركز" داخل ملف إكسيل */
const CENTER_HEADER_HINTS = ['مركز','المركز','اسم المركز','center','Center','CENTER'];
function detectCenterColumn(cols){
  let hit = cols.find(c=> CENTER_HEADER_HINTS.some(h=> String(c).trim()===h));
  if(hit) return hit;
  hit = cols.find(c=> String(c).trim().indexOf('مركز')!==-1 || String(c).toLowerCase().indexOf('center')!==-1);
  return hit || null;
}
function exportRowsToExcel(rows, colSet, filename, employeesMap){
  const data = rows.map(r=>{
    const o = {};
    o['الموظف'] = (employeesMap && employeesMap[r.uid] && employeesMap[r.uid].name) || (typeof empName==='function' ? empName(r.uid) : (r.uid||''));
    o['المركز'] = r.center||'';
    colSet.forEach(c=> o[c]=(r.data?r.data[c]:''));
    o['الحالة'] = r.done ? 'تم الإدخال' : 'لم يتم';
    o['تاريخ الإسناد'] = fmtDate(r.date);
    o['تاريخ الإدخال'] = r.doneAt ? fmtDateTime(r.doneAt) : (r.doneDate?fmtDate(r.doneDate):'');
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'طلبات');
  XLSX.writeFile(wb, filename);
}
function authErrMsg(code){
  if(!code) return 'حدث خطأ، حاول مرة أخرى';
  if(code.includes('wrong-password') || code.includes('invalid-credential') || code.includes('user-not-found'))
    return 'اسم المستخدم أو كلمة المرور غير صحيحة';
  if(code.includes('too-many-requests')) return 'محاولات كثيرة، انتظر قليلاً ثم حاول مرة أخرى';
  if(code.includes('email-already-in-use')) return 'اسم المستخدم مستخدم بالفعل';
  if(code.includes('weak-password')) return 'كلمة المرور قصيرة — 6 أحرف أو أرقام على الأقل';
  if(code.includes('network')) return 'تعذر الاتصال بالإنترنت';
  return 'حدث خطأ، حاول مرة أخرى';
}

/* ============ State ============ */
let currentUser = null;
let currentEmployee = null;
let isAdmin = false;
let unsubList = [];
function clearSubs(){ unsubList.forEach(u=>{ try{u();}catch(e){} }); unsubList=[]; }

/* ============ Auth flow ============ */
onAuthStateChanged(auth, async (user)=>{
  clearSubs();
  currentUser = user;
  if(!user){ renderLogin(); return; }
  renderLoading('جارِ التحقق من بيانات الحساب...');
  try{
    const snap = await getDoc(doc(db,'employees',user.uid));
    if(!snap.exists()){
      renderCompleteProfile(user);
    }else{
      currentEmployee = snap.data();
      isAdmin = currentEmployee.role==='admin';
      renderApp();
    }
  }catch(err){
    console.error(err);
    renderLoading('تعذر الاتصال بقاعدة البيانات، حدّث الصفحة وحاول مرة أخرى');
  }
});

function renderLoading(msg){
  root.innerHTML='';
  root.appendChild(el(`<div class="center-screen"><div class="spinner"></div><div class="load-text">${esc(msg||'جارِ التحميل...')}</div></div>`));
}

function renderLogin(){
  root.innerHTML='';
  const wrap = el(`
    <div class="center-screen">
      <div class="brand-block">
        <div class="logo-circle">ش م</div>
        <h1>مركز شبكات المرافق</h1>
        <p>محافظة المنيا - منظومة الحضور والانجاز</p>
      </div>
      <div class="auth-card">
        <div class="field">
          <label>اسم المستخدم</label>
          <input type="text" id="login-user" placeholder="اكتب اسم المستخدم" autocomplete="username">
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" id="login-pass" placeholder="••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="login-btn">دخول</button>
        <div class="error-text" id="login-err" style="display:none;"></div>
        <div class="small-note" style="margin-top:16px;">الحسابات يُنشئها المدير. لو نسيت كلمة المرور تواصل معه.</div>
      </div>
    </div>
  `);
  root.appendChild(wrap);

  const errBox = wrap.querySelector('#login-err');
  const btn = wrap.querySelector('#login-btn');

  async function doLogin(){
    const username = wrap.querySelector('#login-user').value.trim();
    const password = wrap.querySelector('#login-pass').value;
    errBox.style.display='none';
    if(!username || !password){
      errBox.textContent = 'اكتب اسم المستخدم وكلمة المرور';
      errBox.style.display='block';
      return;
    }
    btn.disabled=true; btn.textContent='جارِ الدخول...';
    const email = userToEmail(username);
    try{
      await signInWithEmailAndPassword(auth, email, password);
      return;
    }catch(err){
      const code = (err && err.code) || '';
      // تهيئة حساب المدير الأساسي في أول تشغيل فقط
      const isAdminBootstrap = normUser(username)===normUser(ADMIN_USERNAME) && password===ADMIN_PASSWORD;
      if(isAdminBootstrap && (code.includes('user-not-found') || code.includes('invalid-credential'))){
        try{
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await setDoc(doc(db,'employees',cred.user.uid), {
            uid: cred.user.uid, username: normUser(ADMIN_USERNAME), name: ADMIN_USERNAME,
            phone: '', department: DEPARTMENTS[0], role: 'admin', createdAt: serverTimestamp()
          });
          return;
        }catch(err2){
          console.error(err2);
          errBox.textContent = authErrMsg((err2 && err2.code) || '');
          errBox.style.display='block';
        }
      }else{
        errBox.textContent = authErrMsg(code);
        errBox.style.display='block';
      }
      btn.disabled=false; btn.textContent='دخول';
    }
  }

  btn.addEventListener('click', doLogin);
  wrap.querySelectorAll('input').forEach(i=> i.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));
}

/* ============ App Shell ============ */
let activeTab = 'home';
function renderApp(){
  root.innerHTML='';
  const shell = el(`
    <div style="display:flex;flex-direction:column;min-height:100vh;">
      <div class="topbar">
        <div class="left">
          <div class="logo-circle">ش م</div>
          <div>
            <div class="title">مركز شبكات المرافق</div>
            <div class="subtitle">محافظة المنيا</div>
          </div>
        </div>
        <div class="right">
          <button class="btn btn-outline btn-sm" id="account-btn" title="حسابي">👤 حسابي</button>
          <div class="user-chip">
            <div class="avatar">${esc((currentEmployee.name||'؟')[0])}</div>
            <div>
              <div class="u-name">${esc(currentEmployee.name)}</div>
              <div class="u-dept">${esc(currentEmployee.department)}${isAdmin?' • مدير':''}</div>
            </div>
          </div>
          <button class="btn btn-outline btn-sm" id="logout-btn">تسجيل الخروج</button>
        </div>
      </div>
      <div class="tabs" id="tabs-row">
        ${isAdmin ? `` : `<button class="tab-btn" data-tab="home">الرئيسية</button>`}
        ${isAdmin ? `` : `<button class="tab-btn" data-tab="tokeen">أعمال التقنين</button>`}
        ${isAdmin ? `<button class="tab-btn" data-tab="admin">لوحة المدير</button>` : ``}
      </div>
      <div class="container" id="tab-content"></div>
    </div>
  `);
  root.appendChild(shell);
  shell.querySelector('#logout-btn').addEventListener('click', ()=> signOut(auth));
  shell.querySelector('#account-btn').addEventListener('click', openAccountModal);
  shell.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=> switchTab(b.dataset.tab)));
  switchTab(isAdmin ? 'admin' : 'home');
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  const content = document.getElementById('tab-content');
  if(!content) return;
  content.innerHTML = '';
  clearSubs();
  if(tab==='home') renderHomeTab(content);
  else if(tab==='tokeen') renderTokeenTab(content);
  else if(tab==='admin') renderAdminTab(content);
}

/* ============ ACCOUNT MODAL (حسابي) ============ */
function openAccountModal(){
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box" style="max-width:520px;">
        <h3>👤 حسابي</h3>
        <div class="modal-sub">بيانات حسابك وكلمة المرور</div>
        <div class="field"><label>اسم المستخدم</label><input type="text" id="acc-username" value="${esc(currentEmployee.username||'')}" disabled></div>
        <div class="field"><label>الاسم بالكامل *</label><input type="text" id="acc-name" value="${esc(currentEmployee.name||'')}"></div>
        <div class="field"><label>رقم الهاتف *</label><input type="tel" id="acc-phone" value="${esc(currentEmployee.phone||'')}"></div>
        <div class="field">
          <label>القسم *</label>
          <select id="acc-dept">${DEPARTMENTS.map(d=>`<option value="${esc(d)}" ${d===currentEmployee.department?'selected':''}>${esc(d)}</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary btn-block" id="acc-save-btn">حفظ البيانات</button>
        <div class="error-text" id="acc-err" style="display:none;"></div>

        <div style="border-top:1px solid var(--border);margin:18px 0 14px;"></div>
        <h3 style="font-size:14.5px;">🔑 تغيير كلمة المرور</h3>
        <div class="field"><label>كلمة المرور الحالية *</label><input type="password" id="pw-old" autocomplete="current-password"></div>
        <div class="field"><label>كلمة المرور الجديدة *</label><input type="password" id="pw-new" placeholder="6 أحرف أو أرقام على الأقل" autocomplete="new-password"></div>
        <div class="field"><label>تأكيد كلمة المرور الجديدة *</label><input type="password" id="pw-new2" autocomplete="new-password"></div>
        <button class="btn btn-primary btn-block" id="pw-save-btn">تغيير كلمة المرور</button>
        <div class="error-text" id="pw-err" style="display:none;"></div>

        <div class="modal-actions"><button class="btn btn-outline btn-block" id="acc-close-btn">إغلاق</button></div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector('#acc-close-btn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  const content = overlay;

  content.querySelector('#acc-save-btn').addEventListener('click', async ()=>{
    const name = content.querySelector('#acc-name').value.trim();
    const phone = content.querySelector('#acc-phone').value.trim();
    const department = content.querySelector('#acc-dept').value;
    const errBox = content.querySelector('#acc-err');
    errBox.style.display='none';
    if(!name || !phone){
      errBox.textContent='من فضلك أكمل الاسم ورقم الهاتف';
      errBox.style.display='block';
      return;
    }
    const btn = content.querySelector('#acc-save-btn');
    btn.disabled=true; btn.textContent='جارِ الحفظ...';
    try{
      await updateDoc(doc(db,'employees',currentUser.uid), {name, phone, department});
      currentEmployee = {...currentEmployee, name, phone, department};
      toast('تم حفظ بياناتك', 'ok');
      document.querySelector('.user-chip .u-name').textContent = name;
      document.querySelector('.user-chip .u-dept').textContent = department + (isAdmin?' • مدير':'');
      document.querySelector('.user-chip .avatar').textContent = name[0];
    }catch(err){
      console.error(err);
      errBox.textContent='حدث خطأ أثناء الحفظ';
      errBox.style.display='block';
    }
    btn.disabled=false; btn.textContent='حفظ البيانات';
  });

  content.querySelector('#pw-save-btn').addEventListener('click', async ()=>{
    const oldPw = content.querySelector('#pw-old').value;
    const newPw = content.querySelector('#pw-new').value;
    const newPw2 = content.querySelector('#pw-new2').value;
    const errBox = content.querySelector('#pw-err');
    errBox.style.display='none';
    if(!oldPw || !newPw || !newPw2){ errBox.textContent='أكمل كل الحقول'; errBox.style.display='block'; return; }
    if(newPw.length<6){ errBox.textContent='كلمة المرور الجديدة 6 خانات على الأقل'; errBox.style.display='block'; return; }
    if(newPw!==newPw2){ errBox.textContent='كلمتا المرور غير متطابقتين'; errBox.style.display='block'; return; }
    const btn = content.querySelector('#pw-save-btn');
    btn.disabled=true; btn.textContent='جارِ التغيير...';
    try{
      const cred = EmailAuthProvider.credential(currentUser.email, oldPw);
      await reauthenticateWithCredential(currentUser, cred);
      await updatePassword(currentUser, newPw);
      toast('تم تغيير كلمة المرور', 'ok');
      content.querySelector('#pw-old').value='';
      content.querySelector('#pw-new').value='';
      content.querySelector('#pw-new2').value='';
    }catch(err){
      console.error(err);
      errBox.textContent = authErrMsg((err&&err.code)||'');
      errBox.style.display='block';
    }
    btn.disabled=false; btn.textContent='تغيير كلمة المرور';
  });
}

/* ============ HOME TAB (attendance) ============ */
function renderHomeTab(content){
  const uid = currentUser.uid;
  const today = todayCairoStr();
  const docId = `${uid}_${today}`;

  content.appendChild(el(`
    <div class="grid grid-2">
      <div class="card" id="today-card">
        <h3>📋 حالة اليوم — ${fmtDate(today)}</h3>
        <div id="today-body"><div class="muted">جارِ التحميل...</div></div>
      </div>
      <div class="card">
        <h3>🕒 سجل الحضور والإنجاز — كل الأيام</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>التاريخ</th><th>الحضور</th><th>الانصراف</th><th>الحالة</th><th>المهام المنجزة</th></tr></thead>
          <tbody id="history-body"><tr><td colspan="5" class="muted">جارِ التحميل...</td></tr></tbody>
        </table></div>
      </div>
    </div>
  `));

  const unsub = onSnapshot(doc(db,'attendance',docId), (snap)=>{
    renderTodayCard(document.getElementById('today-body'), snap.exists()?snap.data():null, docId, today);
  }, err=>console.error(err));
  unsubList.push(unsub);

  const q = query(collection(db,'attendance'), where('uid','==',uid), orderBy('date','desc'));
  const unsub2 = onSnapshot(q, (qs)=>{
    const rows = [];
    qs.forEach(d=> rows.push(d.data()));
    const tbody = document.getElementById('history-body');
    if(!tbody) return;
    if(rows.length===0){ tbody.innerHTML = `<tr><td colspan="5" class="muted">لا يوجد سجل بعد</td></tr>`; return; }
    tbody.innerHTML = rows.map((r,i)=>{
      let statusHtml;
      if(r.checkOut) statusHtml = r.earlyLeaveReason ? `<span class="status-pill pill-warn">انصراف مبكر</span>` : `<span class="status-pill pill-good">مكتمل</span>`;
      else if(r.checkIn) statusHtml = `<span class="status-pill pill-neutral">لم ينصرف بعد</span>`;
      else statusHtml = `<span class="status-pill pill-bad">غياب</span>`;
      const taskCount = r.tasks ? r.tasks.length : 0;
      return `<tr><td>${fmtDate(r.date)}</td><td>${fmtTime(r.checkIn)}</td><td>${fmtTime(r.checkOut)}</td><td>${statusHtml}</td>
        <td>${taskCount ? `<button class="link-btn" data-idx="${i}">${taskCount} مهمة</button>` : '—'}</td></tr>`;
    }).join('');
    tbody.querySelectorAll('.link-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const r = rows[+b.dataset.idx];
        showTasksModal(currentEmployee.name + ' — ' + fmtDate(r.date), r.tasks||[], r.earlyLeaveReason);
      });
    });
  }, err=>console.error(err));
  unsubList.push(unsub2);
}

function renderTodayCard(container, data, docId, today){
  if(!container) return;
  if(!data || !data.checkIn){
    container.innerHTML = `
      <div class="time-row"><div class="lbl">وقت الحضور</div><div class="val muted">لم يسجل بعد</div></div>
      <button class="btn btn-primary btn-block" id="checkin-btn" style="margin-top:12px;">تسجيل حضور الآن</button>
    `;
    container.querySelector('#checkin-btn').addEventListener('click', async (e)=>{
      e.target.disabled=true; e.target.textContent='جارِ التسجيل...';
      try{
        await setDoc(doc(db,'attendance',docId), {
          uid: currentUser.uid, date: today, checkIn: serverTimestamp(),
          checkOut: null, earlyLeaveReason: null, tasks: []
        }, {merge:true});
        toast('تم تسجيل الحضور بنجاح', 'ok');
      }catch(err){ console.error(err); toast('حدث خطأ، حاول مرة أخرى', 'err'); e.target.disabled=false; e.target.textContent='تسجيل حضور الآن'; }
    });
    return;
  }
  if(data.checkOut){
    container.innerHTML = `
      <div class="time-row"><div class="lbl">وقت الحضور</div><div class="val">${fmtTime(data.checkIn)}</div></div>
      <div class="time-row"><div class="lbl">وقت الانصراف</div><div class="val">${fmtTime(data.checkOut)}</div></div>
      ${data.earlyLeaveReason ? `<div class="small-note" style="margin-top:10px;"><b>سبب الانصراف المبكر:</b> ${esc(data.earlyLeaveReason)}</div>` : ''}
      ${data.tasks && data.tasks.length ? `<div style="margin-top:12px;"><div class="lbl" style="font-size:13px;color:var(--sub);margin-bottom:6px;">المهام المنجزة اليوم:</div>${data.tasks.map(t=>`<span class="task-chip">✓ ${esc(t.text)}</span>`).join('')}</div>` : ''}
      <div style="margin-top:14px;"><span class="status-pill pill-good">تم تسجيل يوم العمل بالكامل</span></div>
    `;
    return;
  }
  container.innerHTML = `
    <div class="time-row"><div class="lbl">وقت الحضور</div><div class="val">${fmtTime(data.checkIn)}</div></div>
    <div class="time-row"><div class="lbl">وقت الانصراف</div><div class="val muted">لم يسجل بعد</div></div>
    <button class="btn btn-danger btn-block" id="checkout-btn" style="margin-top:12px;">تسجيل الانصراف</button>
  `;
  container.querySelector('#checkout-btn').addEventListener('click', ()=> openCheckoutModal(docId));
}

function openCheckoutModal(docId){
  const now = cairoNow();
  const isEarly = (now.hour < 16);
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>تسجيل الانصراف</h3>
        <div class="modal-sub">الوقت الآن (بتوقيت القاهرة): ${String(now.hour).padStart(2,'0')}:${String(now.minute).padStart(2,'0')}</div>
        ${isEarly ? `
          <div class="field">
            <label>⚠️ أنت تنصرف قبل الساعة 4 عصرًا — من فضلك اكتب سبب الانصراف المبكر *</label>
            <textarea id="early-reason" placeholder="اكتب السبب هنا..."></textarea>
          </div>` : ``}
        <div class="field">
          <label>المهام والإنجازات التي تمت اليوم * (يمكن إضافة أكثر من مهمة)</label>
          <div id="tasks-list"></div>
          <button class="btn btn-outline btn-sm" id="add-task-btn" type="button">+ إضافة مهمة أخرى</button>
        </div>
        <div class="error-text" id="checkout-err" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="cancel-checkout-btn">إلغاء</button>
          <button class="btn btn-primary" id="confirm-checkout-btn">تأكيد الانصراف</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);

  const tasksList = overlay.querySelector('#tasks-list');
  function addTaskRow(value=''){
    const row = el(`<div class="task-input-row">
      <input type="text" class="task-input" placeholder="اكتب المهمة..." value="${esc(value)}">
      <button type="button" class="remove-x">×</button>
    </div>`);
    row.querySelector('.remove-x').addEventListener('click', ()=>{ if(tasksList.children.length>1) row.remove(); });
    tasksList.appendChild(row);
  }
  addTaskRow();

  overlay.querySelector('#add-task-btn').addEventListener('click', ()=> addTaskRow());
  overlay.querySelector('#cancel-checkout-btn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#confirm-checkout-btn').addEventListener('click', async ()=>{
    const errBox = overlay.querySelector('#checkout-err');
    errBox.style.display='none';
    const reasonEl = overlay.querySelector('#early-reason');
    const reason = reasonEl ? reasonEl.value.trim() : '';
    if(isEarly && !reason){ errBox.textContent='من فضلك اكتب سبب الانصراف المبكر'; errBox.style.display='block'; return; }
    const taskInputs = [...overlay.querySelectorAll('.task-input')].map(i=>i.value.trim()).filter(Boolean);
    if(taskInputs.length===0){ errBox.textContent='من فضلك اكتب مهمة واحدة على الأقل'; errBox.style.display='block'; return; }
    const btn = overlay.querySelector('#confirm-checkout-btn');
    btn.disabled=true; btn.textContent='جارِ الحفظ...';
    try{
      await updateDoc(doc(db,'attendance',docId), {
        checkOut: serverTimestamp(),
        earlyLeaveReason: isEarly ? reason : null,
        tasks: taskInputs.map(t=>({text:t}))
      });
      toast('تم تسجيل الانصراف بنجاح', 'ok');
      overlay.remove();
    }catch(err){
      console.error(err);
      errBox.textContent='حدث خطأ أثناء الحفظ، حاول مرة أخرى';
      errBox.style.display='block';
      btn.disabled=false; btn.textContent='تأكيد الانصراف';
    }
  });
}

let employeesCache = {};

  const unsub = onSnapshot(collection(db,'employees'), (qs)=>{
    employeesCache = {};

function renderMyRequests(box){
  box.innerHTML = `
    <div class="card">
      <h3>📊 إحصائياتي</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="stat-target">0</div><div class="lbl">المستهدف</div></div>
        <div class="stat-box"><div class="num" id="stat-done">0</div><div class="lbl">تم إدخاله</div></div>
        <div class="stat-box"><div class="num" id="stat-remain">0</div><div class="lbl">المتبقي</div></div>
      </div>
      <div class="progress-bar"><div id="progress-fill" style="width:0%;"></div></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <div class="flex-between" style="margin-bottom:6px;">
        <h3 style="margin:0;">📁 الطلبات المسندة إليّ</h3>
        <button class="btn btn-outline btn-sm btn-auto" id="my-export-btn">📤 تصدير إكسيل</button>
      </div>
      <div class="card-sub">اضغط «تم الإدخال» أمام الطلب لينتقل إلى قسم «ما تم إدخاله». الزر ثابت على اليمين أثناء تمرير الجدول — التصدير يعتمد على الفلاتر المطبقة حاليًا.</div>
      <div class="filter-bar">
        <input type="text" id="mine-search" placeholder="ابحث برقم الطلب أو أي جزء منه...">
        <select id="mine-filter">
          <option value="pending">لم يتم إدخاله</option>
          <option value="all">الكل</option>
          <option value="done">تم إدخاله</option>
        </select>
      </div>
      <div class="table-wrap" id="my-requests-table"><div class="muted" style="padding:14px;">جارِ التحميل...</div></div>
    </div>
  `;

  let myRows = [];
  let lastRows = [];
  let lastColSet = [];
  const q = query(collection(db,'tokeenRequests'), where('uid','==',currentUser.uid));
  const unsub = onSnapshot(q, (qs)=>{
    myRows = [];
    qs.forEach(d=> myRows.push({id:d.id, ...d.data()}));
    renderMyStats(myRows);
    draw();
  }, err=>{ console.error(err); const t=document.getElementById('my-requests-table'); if(t) t.innerHTML=`<div class="empty-state">تعذر تحميل الطلبات</div>`; });
  unsubList.push(unsub);

  function draw(){
    const wrap = box.querySelector('#my-requests-table');
    if(!wrap) return;
    const mode = box.querySelector('#mine-filter').value;
    const search = normalizeDigits(box.querySelector('#mine-search').value.trim().toLowerCase());
    let rows = myRows.filter(r=> mode==='all' ? true : (mode==='done' ? r.done : !r.done));
    if(search){
      rows = rows.filter(r=> normalizeDigits(JSON.stringify(r.data||{}) + ' ' + (r.center||'')).toLowerCase().includes(search));
    }
    if(rows.length===0){
      wrap.innerHTML = `<div class="empty-state"><div class="emoji">📭</div>${myRows.length ? 'لا توجد نتائج مطابقة' : 'لا توجد طلبات مسندة إليك حاليًا'}</div>`;
      lastRows = []; lastColSet = [];
      return;
    }
    const colSet = [];
    myRows.forEach(r=> Object.keys(r.data||{}).forEach(k=>{ if(!colSet.includes(k)) colSet.push(k); }));
    lastRows = rows; lastColSet = colSet;
    rows.sort((a,b)=> (a.done?1:0)-(b.done?1:0) || String(a.date).localeCompare(String(b.date)));
    wrap.innerHTML = `
      <table>
        <thead><tr>
          <th class="col-action">الإدخال</th><th>المركز</th>${colSet.map(c=>`<th>${esc(c)}</th>`).join('')}<th>تاريخ الإسناد</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr class="${r.done?'row-done':''}">

                       <button class="btn btn-sm btn-outline undo-btn" data-id="${r.id}">إلغاء</button>
                     </div>`
                  : `<button class="btn btn-sm btn-enter mark-btn" data-id="${r.id}">تم الإدخال</button>`}
              </td>
              <td>${esc(r.center||'—')}</td>
              ${colSet.map(c=>`<td>${esc(r.data ? r.data[c] : '')}</td>`).join('')}
              <td>${fmtDate(r.date)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('.mark-btn').forEach(b=> b.addEventListener('click', ()=> setDone(b, b.dataset.id, true)));
    wrap.querySelectorAll('.undo-btn').forEach(b=> b.addEventListener('click', ()=> setDone(b, b.dataset.id, false)));
  }

  async function setDone(btn, id, val){
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '...';
    try{
      await updateDoc(doc(db,'tokeenRequests',id), val
        ? {done:true, doneAt: serverTimestamp(), doneDate: todayCairoStr()}
        : {done:false, doneAt: null, doneDate: null});
      toast(val ? 'تم نقل الطلب إلى «ما تم إدخاله»' : 'تم التراجع عن الإدخال', 'ok');
    }catch(err){
      console.error(err);
      toast('حدث خطأ، حاول مرة أخرى', 'err');
      btn.disabled=false; btn.textContent=old;
    }
  }

  box.querySelector('#mine-filter').addEventListener('change', draw);
  box.querySelector('#mine-search').addEventListener('input', draw);
  box.querySelector('#my-export-btn').addEventListener('click', ()=>{
    if(lastRows.length===0){ toast('لا توجد بيانات لتصديرها', 'err'); return; }
    exportRowsToExcel(lastRows, lastColSet, `طلباتي_المسندة_${todayCairoStr()}.xlsx`);
  });
}

function renderMyStats(rows){
  const target = rows.length;
  const done = rows.filter(r=>r.done).length;
  const t = document.getElementById('stat-target');
  if(!t) return;
  t.textContent = target;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-remain').textContent = target - done;
  document.getElementById('progress-fill').style.width = (target? Math.round(done/target*100):0) + '%';
}

function renderDoneSection(box){
  box.innerHTML = `
    <div class="card">
      <h3>🏆 إحصائيات الإدخال لكل موظف</h3>
      <div class="card-sub">اختر فترة زمنية أو اترك الفترة فارغة لعرض كل الوقت</div>

      </div>
      <div id="done-leaderboard"><div class="muted">جارِ التحميل...</div></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h3>✅ سجل الطلبات التي تم إدخالها</h3>

  const unsub = onSnapshot(q, (qs)=>{
    allDone = [];
    qs.forEach(d=> allDone.push({id:d.id, ...d.data()}));
    fillEmpSelect(); draw();
  }, err=>{ console.error(err); const t=box.querySelector('#done-table'); if(t) t.innerHTML=`<div class="empty-state">تعذر تحميل البيانات</div>`; });
  unsubList.push(unsub);

  watchEmployeesCache(()=>{ fillEmpSelect(); draw(); });

  function fillEmpSelect(){
    const sel = box.querySelector('#done-emp');
    if(!sel) return;
    const cur = sel.value;
    const uids = [...new Set(allDone.map(r=>r.uid))];
    sel.innerHTML = `<option value="">كل الموظفين</option>` + uids.map(u=>`<option value="${esc(u)}">${esc(empName(u))}</option>`).join('');
    sel.value = cur;
  }

  function inPeriod(r){
    const from = box.querySelector('#done-from').value;
    const to = box.querySelector('#done-to').value;
    if(!from && !to) return true;
    const d = doneDateOf(r);
    if(!d) return false;
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  }

  function draw(){
    const periodRows = allDone.filter(inPeriod);
    const counts = {};
    periodRows.forEach(r=>{ counts[r.uid] = (counts[r.uid]||0)+1; });
    const board = box.querySelector('#done-leaderboard');
    const list = Object.keys(counts).map(uid=>({uid, n:counts[uid]})).sort((a,b)=> b.n-a.n);
    board.innerHTML = list.length ? list.map((r,i)=>`
      <div class="leader-row">
        <div class="leader-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</div>
        <div style="flex:1;">

          <div class="leader-dept">${esc(empDept(r.uid))}</div>
        </div>
        <div class="leader-nums">${r.n} طلب</div>
      </div>`).join('') + `<div class="small-note" style="margin-top:12px;">إجمالي ما تم إدخاله في الفترة: ${periodRows.length} طلب</div>`
      : `<div class="empty-state"><div class="emoji">📊</div>لا توجد طلبات مُدخلة في هذه الفترة</div>`;

    const empFilter = box.querySelector('#done-emp').value;
    const search = normalizeDigits(box.querySelector('#done-search').value.trim().toLowerCase());
    let rows = periodRows.filter(r=> !empFilter || r.uid===empFilter);
    if(search){
      rows = rows.filter(r=>{
        const hay = [r.center||'', empName(r.uid), JSON.stringify(r.data||{})].join(' ');
        return normalizeDigits(hay).toLowerCase().includes(search);
      });
    }
    const tbl = box.querySelector('#done-table');
    if(rows.length===0){ tbl.innerHTML = `<div class="empty-state">لا توجد نتائج مطابقة</div>`; return; }
    const colSet = [];
    rows.forEach(r=> Object.keys(r.data||{}).forEach(k=>{ if(!colSet.includes(k)) colSet.push(k); }));
    rows.sort((a,b)=> String(doneDateOf(b)).localeCompare(String(doneDateOf(a))));
    tbl.innerHTML = `
      <table>
        <thead><tr><th>الموظف</th><th>المركز</th>${colSet.map(c=>`<th>${esc(c)}</th>`).join('')}<th>تاريخ الإدخال</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td>${esc(empName(r.uid))}</td>
            <td>${esc(r.center||'—')}</td>
            ${colSet.map(c=>`<td>${esc(r.data?r.data[c]:'')}</td>`).join('')}
            <td>${r.doneAt ? fmtDateTime(r.doneAt) : fmtDate(doneDateOf(r))}</td>
          </tr>`).join('')}</tbody>
      </table>
    `;
  }

  box.querySelector('#done-from').addEventListener('change', draw);
  box.querySelector('#done-to').addEventListener('change', draw);
  box.querySelector('#done-emp').addEventListener('change', draw);
  box.querySelector('#done-search').addEventListener('input', draw);
  box.querySelector('#done-all-time').addEventListener('click', ()=>{
    box.querySelector('#done-from').value='';
    box.querySelector('#done-to').value='';
    draw();
  });
}

        </select>
      </div>
      <div class="table-wrap" id="report-table"><div class="muted" style="padding:14px;">جارِ التحميل...</div></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <h3>📈 إحصائيات فترة</h3>
      <div class="card-sub">اختر موظفًا محددًا أو اترك «كل الموظفين» — يظهر لكل موظف عدد أيام التأخير والغياب والأيام بدون إنجاز، مع إمكانية عرض تفاصيل كل يوم بالفترة (بدون الجمعة والسبت)</div>
      <div class="flex-between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px;">

          <label class="muted" style="font-size:12.5px;">من</label>
          <input type="date" id="stats-from" max="${today}" style="padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;">
          <label class="muted" style="font-size:12.5px;">إلى</label>
          <input type="date" id="stats-to" value="${today}" max="${today}" style="padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;">

  `;

  const d0 = new Date(today+'T12:00:00');
  d0.setDate(d0.getDate()-13);
  container.querySelector('#stats-from').value = d0.toISOString().slice(0,10);

  let employees = {};
  let reportUnsub = null;
  let lastAttendance = {};
  let lastDateStr = today;
  const dateInput = container.querySelector('#report-date');

  function loadEmployees(cb){
    const u = onSnapshot(collection(db,'employees'), qs=>{
      employees={}; qs.forEach(d=> employees[d.id]=d.data());
      const sel = container.querySelector('#stats-emp-filter');
      if(sel){

        sel.value = cur;
      }
      cb();
    }, err=>console.error(err));
    unsubList.push(u);
  }

  function dayStatus(dateStr, record){
    if(record && record.checkIn){
      const ciDate = record.checkIn.toDate ? record.checkIn.toDate() : new Date(record.checkIn);
      const hh = +new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo', hour:'2-digit', hour12:false}).format(ciDate);
      const mm = +new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo', minute:'2-digit'}).format(ciDate);
      const late = (hh>WORK_START_HOUR) || (hh===WORK_START_HOUR && mm>0);
      return late ? 'late' : 'present';
    }
    const now = cairoNow();
    if(dateStr===today && now.hour<WORK_START_HOUR) return 'pending';
    return 'absent';
  }

  function loadReportForDate(dateStr){
    if(reportUnsub){ reportUnsub(); reportUnsub=null; }
    const tbl = container.querySelector('#report-table');
    if(tbl) tbl.innerHTML = `<div class="muted" style="padding:14px;">جارِ التحميل...</div>`;
    reportUnsub = onSnapshot(query(collection(db,'attendance'), where('date','==',dateStr)), qs=>{
      const attendance = {};
      qs.forEach(d=>{ const r=d.data(); attendance[r.uid]=r; });
      lastAttendance = attendance; lastDateStr = dateStr;
      drawReport(dateStr, attendance);
    }, err=>console.error(err));
    unsubList.push(()=>{ if(reportUnsub) reportUnsub(); });
  }

  function drawReport(dateStr, attendance){
    const tbl = container.querySelector('#report-table');
    if(!tbl) return;
    const statusFilter = container.querySelector('#report-status-filter').value;
    const deptFilter = container.querySelector('#report-dept-filter').value;
    // المدير لا يظهر في سجل الحضور والانصراف
    const uids = Object.keys(employees).filter(uid=> employees[uid].role!=='admin');
    if(uids.length===0){ tbl.innerHTML = `<div class="empty-state">لا يوجد موظفون بعد</div>`; return; }
    let allDeptRows = uids.map(uid=>({uid, e:employees[uid], a:attendance[uid], status: dayStatus(dateStr, attendance[uid])}));
    if(deptFilter) allDeptRows = allDeptRows.filter(r=> r.e.department===deptFilter);
    // بطاقات إحصائية صغيرة (غير متأثرة بفلتر الحالة، فقط بفلتر القسم)
    const miniTotal = document.getElementById('mini-total');
    if(miniTotal){
      const presentCnt = allDeptRows.filter(r=> r.status==='present'||r.status==='late').length;
      const absentCnt = allDeptRows.filter(r=> r.status==='absent').length;
      miniTotal.textContent = allDeptRows.length;
      document.getElementById('mini-present').textContent = presentCnt;
      document.getElementById('mini-absent').textContent = absentCnt;
    }
    let rows = allDeptRows;
    if(statusFilter==='present') rows = rows.filter(r=> r.status==='present'||r.status==='late');
    if(statusFilter==='absent') rows = rows.filter(r=> r.status==='absent'||r.status==='pending');
    if(rows.length===0){ tbl.innerHTML = `<div class="empty-state">لا توجد نتائج مطابقة</div>`; return; }

    // ترتيب وتجميع حسب القسم عند عرض كل الأقسام معًا
    rows.sort((x,y)=> x.e.department.localeCompare(y.e.department,'ar') || x.e.name.localeCompare(y.e.name,'ar'));

    let bodyHtml = '';
    let curDept = null;
    rows.forEach(r=>{
      if(!deptFilter && r.e.department!==curDept){
        curDept = r.e.department;
        const cnt = rows.filter(x=>x.e.department===curDept).length;

          </div>
        </td>
      </tr>`;
    });

    tbl.innerHTML = `
      <table class="sticky-table">
        <thead><tr><th>الموظف</th><th>القسم</th><th>الحالة</th><th>وقت الحضور</th><th>وقت الانصراف</th><th>المهام</th><th>سبب الغياب</th><th>إجراءات</th></tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>
    `;
    tbl.querySelectorAll('.link-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const r = rows.find(x=>x.uid===b.dataset.uid);
        showTasksModal(r.e.name + ' — ' + fmtDate(dateStr), (r.a && r.a.tasks)||[], r.a && r.a.earlyLeaveReason);
      });
    });
    tbl.querySelectorAll('.save-reason-btn').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const uid = b.dataset.uid;
        const input = tbl.querySelector(`.absence-reason-input[data-uid="${uid}"]`);
        const val = input.value.trim();
        b.disabled=true; b.textContent='...';
        try{
          await setDoc(doc(db,'attendance',`${uid}_${dateStr}`), { uid, date: dateStr, absenceReason: val }, {merge:true});
          toast('تم حفظ سبب الغياب', 'ok');
        }catch(err){ console.error(err); toast('حدث خطأ أثناء الحفظ', 'err'); }
        b.disabled=false; b.textContent='حفظ';
      });
    });
    tbl.querySelectorAll('.edit-att-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const r = rows.find(x=>x.uid===b.dataset.uid);
        openEditAttendanceModal(r.uid, r.e.name, dateStr, r.a);
      });
    });
    tbl.querySelectorAll('.del-att-btn').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('هل أنت متأكد من حذف سجل حضور هذا الموظف لهذا اليوم؟ سيعود إلى حالة «غائب».')) return;
        try{
          await deleteDoc(doc(db,'attendance',`${b.dataset.uid}_${dateStr}`));
          toast('تم حذف السجل', 'ok');
        }catch(err){ console.error(err); toast('حدث خطأ أثناء الحذف', 'err'); }
      });
    });
  }

  dateInput.addEventListener('change', ()=> loadReportForDate(dateInput.value || today));
  container.querySelector('#report-today-btn').addEventListener('click', ()=>{
    dateInput.value = today;
    loadReportForDate(today);
  });
  container.querySelector('#report-status-filter').addEventListener('change', ()=> drawReport(lastDateStr, lastAttendance));
  container.querySelector('#report-dept-filter').addEventListener('change', ()=> drawReport(lastDateStr, lastAttendance));
  loadEmployees(()=> loadReportForDate(dateInput.value || today));

  container.querySelector('#stats-refresh-btn').addEventListener('click', async ()=>{
    const from = container.querySelector('#stats-from').value;
    const to = container.querySelector('#stats-to').value;
    const empFilter = container.querySelector('#stats-emp-filter').value;
    const statsTbl = container.querySelector('#stats-table');
    if(!from || !to || from>to){ toast('اختر فترة صحيحة', 'err'); return; }
    statsTbl.innerHTML = `<div class="muted" style="padding:14px;">جارِ الحساب...</div>`;
    try{
      const qs = await getDocs(query(collection(db,'attendance'), where('date','>=',from), where('date','<=',to)));
      const byUidDate = {};
      qs.forEach(d=>{ const r=d.data(); byUidDate[`${r.uid}_${r.date}`] = r; });

      const dates = [];
      let cur = new Date(from+'T12:00:00');
      const end = new Date(to+'T12:00:00');
      const now = cairoNow();
      while(cur<=end){
        const ds = cur.toISOString().slice(0,10);
        const dow = cur.getDay();
        const isFutureOrPendingToday = (ds===today && now.hour<WORK_START_HOUR) || ds>today;
        if(!WEEKEND_DAYS.includes(dow) && !isFutureOrPendingToday) dates.push(ds);
        cur.setDate(cur.getDate()+1);
      }

      let uids = Object.keys(employees).filter(uid=> employees[uid].role!=='admin');
      if(empFilter) uids = uids.filter(uid=> uid===empFilter);
      const stats = uids.map(uid=>{
        let late=0, absent=0, noWork=0;
        const days = dates.map(ds=>{
          const rec = byUidDate[`${uid}_${ds}`];
          const st = dayStatus(ds, rec);
          if(st==='absent') absent++;
          else if(st==='late') late++;
          const hasWork = rec && rec.tasks && rec.tasks.length>0;
          if((st==='present'||st==='late') && !hasWork) noWork++;
          return {date: ds, status: st, rec};
        });
        return {uid, name: employees[uid].name, dept: employees[uid].department, late, absent, noWork, days};
      }).sort((a,b)=> (b.absent+b.late) - (a.absent+a.late));

      if(stats.length===0){ statsTbl.innerHTML = `<div class="empty-state">لا يوجد موظفون مطابقون</div>`; return; }
      statsTbl.innerHTML = `
        <table class="sticky-table">
          <thead><tr><th>الموظف</th><th>القسم</th><th>أيام التأخير</th><th>أيام الغياب</th><th>أيام بدون إنجاز</th><th>التفاصيل</th></tr></thead>
          <tbody>${stats.map((s,i)=>`<tr>
            <td>${esc(s.name)}</td>
            <td><span class="badge-dept">${esc(s.dept)}</span></td>
            <td>${s.late ? `<span class="status-pill pill-warn">${s.late}</span>` : '0'}</td>
            <td>${s.absent ? `<span class="status-pill pill-bad">${s.absent}</span>` : '0'}</td>
            <td>${s.noWork ? `<span class="status-pill pill-neutral">${s.noWork}</span>` : '0'}</td>
            <td><button class="link-btn detail-stat-btn" data-idx="${i}">عرض كل الأيام</button></td>
          </tr>`).join('')}</tbody>
        </table>
        <div class="small-note" style="margin:10px;">عدد أيام العمل المحسوبة في الفترة: ${dates.length} يوم (باستثناء الجمعة والسبت)</div>
      `;
      statsTbl.querySelectorAll('.detail-stat-btn').forEach(b=>{
        b.addEventListener('click', ()=> showEmployeePeriodModal(stats[+b.dataset.idx]));
      });
    }catch(err){
      console.error(err);
      statsTbl.innerHTML = `<div class="empty-state">حدث خطأ أثناء حساب الإحصائيات</div>`;
    }
  });
}

/* عرض كل أيام موظف خلال فترة: الحضور والانصراف والمهام */
function showEmployeePeriodModal(stat){
  const statusLabel = {present:'حاضر', late:'حاضر (متأخر)', absent:'غائب', pending:'لم يحضر بعد'};
  const statusPill = {present:'pill-good', late:'pill-warn', absent:'pill-bad', pending:'pill-neutral'};
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box" style="max-width:640px;">
        <h3>أيام ${esc(stat.name)}</h3>
        <div class="modal-sub">${esc(stat.dept)} — ${stat.days.length} يوم عمل بالفترة المختارة</div>
        <div class="table-wrap" style="max-height:60vh;">
          <table>
            <thead><tr><th>التاريخ</th><th>الحالة</th><th>الحضور</th><th>الانصراف</th><th>المهام</th></tr></thead>
            <tbody>
              ${stat.days.map(d=>{
                const taskCount = d.rec && d.rec.tasks ? d.rec.tasks.length : 0;
                return `<tr>
                  <td>${fmtDate(d.date)}</td>
                  <td><span class="status-pill ${statusPill[d.status]}">${statusLabel[d.status]}</span></td>
                  <td>${fmtTime(d.rec && d.rec.checkIn)}</td>
                  <td>${fmtTime(d.rec && d.rec.checkOut)}</td>
                  <td>${taskCount ? `<button class="link-btn day-task-btn" data-date="${d.date}">${taskCount} مهمة</button>` : '<span class="muted">—</span>'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div class="modal-actions"><button class="btn btn-outline btn-block" id="ep-close-btn">إغلاق</button></div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector('#ep-close-btn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelectorAll('.day-task-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const d = stat.days.find(x=>x.date===b.dataset.date);
      showTasksModal(stat.name + ' — ' + fmtDate(d.date), (d.rec&&d.rec.tasks)||[], d.rec&&d.rec.earlyLeaveReason);
    });
  });
}

/* تعديل يدوي لسجل حضور/انصراف/مهام موظف من قبل الإدارة */
function openEditAttendanceModal(uid, name, dateStr, rec){
  function toLocalInputValue(ts){
    if(!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const parts = new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour12:false,hour:'2-digit',minute:'2-digit'}).formatToParts(d);
    const o={}; parts.forEach(p=>o[p.type]=p.value);
    return `${o.hour}:${o.minute}`;
  }
  const tasks = (rec && rec.tasks) ? rec.tasks.map(t=>t.text) : [];
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>تعديل سجل ${esc(name)}</h3>
        <div class="modal-sub">${fmtDate(dateStr)} — تعديل وقت الحضور والانصراف والمهام يدويًا</div>
        <div class="field"><label>وقت الحضور (HH:MM بتوقيت القاهرة)</label><input type="time" id="ea-checkin" value="${toLocalInputValue(rec&&rec.checkIn)}"></div>
        <div class="field"><label>وقت الانصراف (HH:MM بتوقيت القاهرة)</label><input type="time" id="ea-checkout" value="${toLocalInputValue(rec&&rec.checkOut)}"></div>
        <div class="field">
          <label>المهام</label>
          <div id="ea-tasks-list"></div>
          <button class="btn btn-outline btn-sm" id="ea-add-task" type="button">+ إضافة مهمة</button>
        </div>
        <div class="error-text" id="ea-err" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="ea-cancel">إلغاء</button>
          <button class="btn btn-primary" id="ea-save">حفظ التعديلات</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const list = overlay.querySelector('#ea-tasks-list');
  function addRow(v=''){
    const row = el(`<div class="task-input-row"><input type="text" class="ea-task-input" value="${esc(v)}" placeholder="اكتب المهمة..."><button type="button" class="remove-x">×</button></div>`);
    row.querySelector('.remove-x').addEventListener('click', ()=> row.remove());
    list.appendChild(row);
  }
  (tasks.length?tasks:['']).forEach(addRow);
  overlay.querySelector('#ea-add-task').addEventListener('click', ()=> addRow());
  overlay.querySelector('#ea-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelector('#ea-save').addEventListener('click', async ()=>{
    const errBox = overlay.querySelector('#ea-err');
    errBox.style.display='none';
    const ciVal = overlay.querySelector('#ea-checkin').value;
    const coVal = overlay.querySelector('#ea-checkout').value;
    const newTasks = [...overlay.querySelectorAll('.ea-task-input')].map(i=>i.value.trim()).filter(Boolean).map(t=>({text:t}));
    function toTimestamp(hhmm){
      if(!hhmm) return null;
      const [h,m] = hhmm.split(':').map(Number);
      // نبني وقتًا بتوقيت القاهرة لليوم المحدد
      const iso = `${dateStr}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;
      // تقريب: نفترض إزاحة +02:00/+03:00 حسب التوقيت الصيفي غير مطبق حاليًا في مصر، لذا +02:00 ثابتة
      const d = new Date(iso+'+02:00');
      return Timestamp.fromDate(d);
    }
    const btn = overlay.querySelector('#ea-save');
    btn.disabled=true; btn.textContent='جارِ الحفظ...';
    try{
      const payload = { uid, date: dateStr, tasks: newTasks };
      payload.checkIn = ciVal ? toTimestamp(ciVal) : null;
      payload.checkOut = coVal ? toTimestamp(coVal) : null;
      await setDoc(doc(db,'attendance',`${uid}_${dateStr}`), payload, {merge:true});
      toast('تم حفظ التعديلات', 'ok');
      overlay.remove();
    }catch(err){
      console.error(err);
      errBox.textContent='حدث خطأ أثناء الحفظ';
      errBox.style.display='block';
      btn.disabled=false; btn.textContent='حفظ التعديلات';
    }
  });
}

function showTasksModal(name, tasks, earlyReason){
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>مهام ${esc(name)}</h3>
        ${earlyReason ? `<div class="small-note" style="margin-bottom:12px;"><b>سبب الانصراف المبكر:</b> ${esc(earlyReason)}</div>` : ''}
        <div>${tasks.map(t=>`<div class="task-chip" style="display:block;margin-bottom:6px;">✓ ${esc(t.text)}</div>`).join('') || '<span class="muted">لا توجد مهام</span>'}</div>
        <div class="modal-actions"><button class="btn btn-outline btn-block" id="close-modal-btn">إغلاق</button></div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector('#close-modal-btn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
}

/* ---- إدارة المستخدمين ---- */
function renderAdminEmployees(container){
  container.innerHTML = `
    <div class="card">
      <div class="flex-between" style="margin-bottom:14px;">
        <h3 style="margin:0;">👥 المستخدمون</h3>
        <button class="btn btn-primary btn-sm btn-auto" id="add-user-btn">+ إضافة مستخدم</button>
      </div>
      <div class="filter-bar">
        <input type="text" id="emp-search" placeholder="ابحث بالاسم أو اسم المستخدم أو الهاتف...">
        <select id="emp-dept-filter">
          <option value="">كل الأقسام</option>
          ${DEPARTMENTS.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap" id="emp-table"><div class="muted" style="padding:14px;">جارِ التحميل...</div></div>
    </div>
  `;
  container.querySelector('#add-user-btn').addEventListener('click', openAddUserModal);

  let allEmps = [];
  function draw(){
    const search = normalizeDigits(container.querySelector('#emp-search').value.trim().toLowerCase());
    const deptFilter = container.querySelector('#emp-dept-filter').value;
    let rows = allEmps.slice();
    if(deptFilter) rows = rows.filter(r=>r.department===deptFilter);
    if(search) rows = rows.filter(r=> normalizeDigits([r.name,r.username,r.phone].join(' ')).toLowerCase().includes(search));
    const tbl = container.querySelector('#emp-table');
    if(rows.length===0){ tbl.innerHTML = `<div class="empty-state">لا توجد نتائج مطابقة</div>`; return; }
    // ترتيب وتجميع حسب القسم
    rows.sort((a,b)=> a.department.localeCompare(b.department,'ar') || a.name.localeCompare(b.name,'ar'));
    let body = '';
    let curDept = null;
    rows.forEach(r=>{
      if(!deptFilter && r.department!==curDept){
        curDept = r.department;
        const cnt = rows.filter(x=>x.department===curDept).length;
        body += `<tr class="dept-group-row"><td colspan="6">📁 ${esc(curDept)} (${cnt})</td></tr>`;
      }
      body += `<tr>
        <td>${esc(r.name)}</td>
        <td>${esc(r.username||'—')}</td>
        <td><span class="badge-dept">${esc(r.department)}</span></td>
        <td>${esc(r.phone||'—')}</td>
        <td>${r.role==='admin' ? '<span class="status-pill pill-good">مدير</span>' : 'موظف'}</td>
        <td><button class="btn btn-outline btn-sm edit-emp-btn" data-id="${r.id}">تعديل</button></td>
      </tr>`;
    });
    tbl.innerHTML = `<table class="sticky-table"><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>القسم</th><th>الهاتف</th><th>الدور</th><th></th></tr></thead>
      <tbody>${body}</tbody></table>`;
    tbl.querySelectorAll('.edit-emp-btn').forEach(b=>{
      b.addEventListener('click', ()=> openEditEmployeeModal(allEmps.find(r=>r.id===b.dataset.id)));
    });
  }

  const u = onSnapshot(collection(db,'employees'), qs=>{
    allEmps = []; qs.forEach(d=> allEmps.push({id:d.id, ...d.data()}));
    if(allEmps.length===0){ container.querySelector('#emp-table').innerHTML = `<div class="empty-state">لا يوجد مستخدمون بعد</div>`; return; }
    draw();
  }, err=>console.error(err));
  unsubList.push(u);
  container.querySelector('#emp-search').addEventListener('input', draw);
  container.querySelector('#emp-dept-filter').addEventListener('change', draw);
}

        <div class="field"><label>اسم المستخدم</label><input type="text" value="${esc(emp.username||'')}" disabled></div>
