        <div class="field"><label>رقم الهاتف</label><input type="tel" id="edit-phone" value="${esc(emp.phone||'')}"></div>
        <div class="field">
          <label>القسم *</label>
          <select id="edit-dept">${DEPARTMENTS.map(d=>`<option value="${esc(d)}" ${d===emp.department?'selected':''}>${esc(d)}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>الدور</label>
          <select id="edit-role">
            <option value="employee" ${emp.role!=='admin'?'selected':''}>موظف</option>
            <option value="admin" ${emp.role==='admin'?'selected':''}>مدير</option>
          </select>
        </div>
        <div class="small-note">كلمة المرور يغيّرها المستخدم من زر «حسابي». لو نسيها، اضغط الزر أدناه لتصفيرها إلى 123123.</div>
        <button class="btn btn-outline btn-block" id="reset-pass-btn" type="button" style="margin-top:10px;">🔁 تصفير كلمة المرور إلى 123123</button>
        <div class="error-text" id="edit-err" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" id="cancel-edit-btn">إلغاء</button>
          <button class="btn btn-primary" id="save-edit-btn">حفظ التعديلات</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  overlay.querySelector('#cancel-edit-btn').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#reset-pass-btn').addEventListener('click', async ()=>{
    if(!confirm(`سيتم تصفير كلمة مرور ${emp.name} إلى 123123. متابعة؟`)) return;
    const btn = overlay.querySelector('#reset-pass-btn');
    btn.disabled=true; btn.textContent='جارِ الإرسال...';
    try{
      /* لا يمكن لحساب المدير تغيير كلمة مرور مستخدم آخر مباشرة من المتصفح (قيود Firebase Auth).
         لذلك يتم تسجيل طلب هنا، وتحتاج Cloud Function صغيرة (admin.auth().updateUser) لتنفيذه فعليًا:
         exports.applyPasswordReset = functions.firestore.document('passwordResetRequests/{id}')
           .onCreate(async (snap)=>{ const d=snap.data(); await admin.auth().updateUser(d.uid,{password:d.newPassword}); await snap.ref.update({status:'done'}); }); */
      await setDoc(doc(collection(db,'passwordResetRequests')), {
        uid: emp.id, name: emp.name, newPassword: '123123',
        requestedBy: currentUser.uid, requestedAt: serverTimestamp(), status: 'pending'
      });
      toast('تم إرسال طلب تصفير كلمة المرور، سيتم تنفيذه تلقائيًا', 'ok');
    }catch(err){
      console.error(err);
      toast('حدث خطأ أثناء إرسال الطلب', 'err');
    }
    btn.disabled=false; btn.textContent='🔁 تصفير كلمة المرور إلى 123123';
  });
  overlay.querySelector('#save-edit-btn').addEventListener('click', async ()=>{
    const name = overlay.querySelector('#edit-name').value.trim();
    const phone = overlay.querySelector('#edit-phone').value.trim();
    const department = overlay.querySelector('#edit-dept').value;
    const role = overlay.querySelector('#edit-role').value;
    const errBox = overlay.querySelector('#edit-err');
    if(!name || !department){ errBox.textContent='من فضلك أكمل الاسم والقسم'; errBox.style.display='block'; return; }
    const btn = overlay.querySelector('#save-edit-btn');
    btn.disabled=true; btn.textContent='جارِ الحفظ...';
    try{
      await updateDoc(doc(db,'employees',emp.id), {name, phone, department, role});
      toast('تم تحديث بيانات المستخدم', 'ok');
      overlay.remove();
    }catch(err){
      console.error(err);
      errBox.textContent='حدث خطأ أثناء الحفظ';
      errBox.style.display='block';
      btn.disabled=false; btn.textContent='حفظ التعديلات';
    }
  });
}

/* ---- Admin: سجل كل الطلبات ---- */
function renderAdminRequestsLog(container){
  container.innerHTML = `
    <div class="card">
      <h3>📊 إحصائيات الموظفين (تحديث تلقائي)</h3>
      <div class="card-sub">لكل موظف: المراكز المسندة إليه، وإجمالي الطلبات وما تم منها</div>
      <div class="filter-bar filter-bar-oneline">
        <label class="muted" style="font-size:12.5px;">من</label>
        <input type="date" id="cards-from">
        <label class="muted" style="font-size:12.5px;">إلى</label>
        <input type="date" id="cards-to">
        <button class="btn btn-outline btn-sm" id="cards-all-time">كل الوقت</button>
      </div>
      <div class="emp-stat-grid" id="emp-stat-cards"><div class="muted">جارِ التحميل...</div></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <div class="flex-between" style="margin-bottom:6px;">
        <h3 style="margin:0;">🔍 سجل كل طلبات التقنين</h3>
        <button class="btn btn-outline btn-sm btn-auto" id="log-export-btn">📤 تصدير إكسيل</button>
      </div>
      <div class="card-sub">فلترة حسب الموظف والحالة، وبحث برقم الطلب أو أي جزء منه، وترتيب أبجدي — التصدير يعتمد على الفلاتر المطبقة حاليًا</div>
      <div class="filter-bar filter-bar-oneline">
        <select id="log-emp-filter"><option value="">كل الموظفين</option></select>
        <select id="log-status-filter">
          <option value="">كل الحالات</option>
          <option value="done">تم الإدخال</option>
          <option value="pending">لم يتم</option>
        </select>
        <select id="log-sort">
          <option value="default">ترتيب افتراضي</option>
          <option value="emp">ترتيب أبجدي — الموظف</option>
          <option value="center">ترتيب أبجدي — المركز</option>
        </select>
        <input type="text" id="log-search" placeholder="ابحث برقم الطلب أو أي بيانات...">
      </div>
      <div class="table-wrap" id="log-table"><div class="muted" style="padding:14px;">جارِ التحميل...</div></div>
    </div>
  `;

  let allRows = [];
  let employees = {};
  let lastColSet = [];
  let lastFilteredRows = [];

  function drawCards(){
    const cardsBox = container.querySelector('#emp-stat-cards');
    if(!cardsBox) return;
    const from = container.querySelector('#cards-from').value;
    const to = container.querySelector('#cards-to').value;
    let rows = allRows;
    if(from || to){
      rows = rows.filter(r=>{
        const d = String(r.date||'');
        if(from && d<from) return false;
        if(to && d>to) return false;
        return true;
      });
    }
    const byUid = {};
    rows.forEach(r=>{
      if(!byUid[r.uid]) byUid[r.uid] = {target:0, done:0, centers:new Set()};
      byUid[r.uid].target++;
      if(r.done) byUid[r.uid].done++;
      if(r.center) byUid[r.uid].centers.add(r.center);
    });
    const uids = Object.keys(byUid).filter(uid=> !employees[uid] || employees[uid].role!=='admin');
    if(uids.length===0){ cardsBox.innerHTML = `<div class="empty-state">لا توجد طلبات مسندة في هذه الفترة</div>`; return; }
    uids.sort((a,b)=> (employees[a]?.name||'').localeCompare(employees[b]?.name||'','ar'));
    cardsBox.innerHTML = uids.map(uid=>{
      const s = byUid[uid];
      const remain = s.target - s.done;
      const centersArr = [...s.centers].sort((a,b)=>a.localeCompare(b,'ar'));
      return `<div class="emp-stat-card">
        <div class="flex-between" style="align-items:flex-start;">
          <div>
            <div class="es-name">${esc(employees[uid]?.name || 'غير معروف')}</div>
            <div class="es-dept">${esc(employees[uid]?.department || '')}</div>
          </div>
          <button class="btn btn-outline btn-sm btn-auto emp-export-btn" data-uid="${esc(uid)}" title="تصدير طلبات هذا الموظف إلى إكسيل">📤 تصدير</button>
        </div>
        ${centersArr.length ? `<div class="es-centers">${centersArr.map(c=>`<span class="badge-dept">${esc(c)}</span>`).join('')}</div>` : ''}
        <div class="stat-row" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-box"><div class="num">${s.target}</div><div class="lbl">المستهدف</div></div>
          <div class="stat-box" style="background:var(--good-bg);"><div class="num" style="color:var(--good);">${s.done}</div><div class="lbl">تم إنجازه</div></div>
          <div class="stat-box" style="background:var(--bad-bg);"><div class="num" style="color:var(--bad);">${remain}</div><div class="lbl">المتبقي</div></div>
        </div>
        <div class="progress-bar" style="margin-top:10px;"><div style="width:${s.target?Math.round(s.done/s.target*100):0}%;"></div></div>
      </div>`;
    }).join('');
    cardsBox.querySelectorAll('.emp-export-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const uid = b.dataset.uid;
        const empRows = rows.filter(r=> r.uid===uid);
        if(empRows.length===0){ toast('لا توجد بيانات لتصديرها لهذا الموظف', 'err'); return; }
        const colSet = [];
        empRows.forEach(r=> Object.keys(r.data||{}).forEach(k=>{ if(!colSet.includes(k)) colSet.push(k); }));
        const empName = employees[uid]?.name || uid;
        exportRowsToExcel(empRows, colSet, `طلبات_${empName}_${todayCairoStr()}.xlsx`, employees);
      });
    });
  }

  function draw(){
    const empFilter = container.querySelector('#log-emp-filter').value;
    const statusFilter = container.querySelector('#log-status-filter').value;
    const sortMode = container.querySelector('#log-sort').value;
    const search = normalizeDigits(container.querySelector('#log-search').value.trim().toLowerCase());
    let rows = allRows.filter(r=> !empFilter || r.uid===empFilter);
    if(statusFilter==='done') rows = rows.filter(r=>r.done);
    if(statusFilter==='pending') rows = rows.filter(r=>!r.done);
    if(search){
      rows = rows.filter(r=>{
        const hay = [r.center||'', (employees[r.uid]&&employees[r.uid].name)||'', JSON.stringify(r.data||{})].join(' ');
        return normalizeDigits(hay).toLowerCase().includes(search);
      });
    }

    const tbl = container.querySelector('#log-table');
    if(rows.length===0){ tbl.innerHTML = `<div class="empty-state">لا توجد نتائج مطابقة</div>`; lastColSet=[]; lastFilteredRows=[]; return; }
    const colSet = [];
    rows.forEach(r=> Object.keys(r.data||{}).forEach(k=>{ if(!colSet.includes(k)) colSet.push(k); }));
    if(sortMode==='emp'){
      rows.sort((a,b)=> ((employees[a.uid]&&employees[a.uid].name)||'').localeCompare((employees[b.uid]&&employees[b.uid].name)||'','ar'));
    }else if(sortMode==='center'){
      rows.sort((a,b)=> String(a.center||'').localeCompare(String(b.center||''),'ar'));
    }else{
      rows.sort((a,b)=> (b.done?1:0) - (a.done?1:0));
    }
    lastColSet = colSet; lastFilteredRows = rows;
    tbl.innerHTML = `
      <table class="sticky-table">
        <thead><tr><th>الموظف</th><th>المركز</th>${colSet.map(c=>`<th>${esc(c)}</th>`).join('')}<th>الحالة</th><th>تاريخ الإسناد</th><th>تاريخ الإدخال</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr class="${r.done?'row-done':''}">
            <td>${esc((employees[r.uid]&&employees[r.uid].name)||'—')}</td>
            <td>${esc(r.center||'—')}</td>
            ${colSet.map(c=>`<td>${esc(r.data?r.data[c]:'')}</td>`).join('')}
            <td>${r.done ? '<span class="status-pill pill-good">تم</span>' : '<span class="status-pill pill-neutral">لم يتم</span>'}</td>
            <td>${fmtDate(r.date)}</td>
            <td>${r.doneAt ? fmtDateTime(r.doneAt) : '—'}</td>
          </tr>`).join('')}</tbody>
      </table>
    `;
  }

  const u1 = onSnapshot(collection(db,'employees'), qs=>{
    employees={}; qs.forEach(d=> employees[d.id]=d.data());
    const sel = container.querySelector('#log-emp-filter');
    if(!sel) return;
    const cur = sel.value;
    sel.innerHTML = `<option value="">كل الموظفين</option>` + Object.keys(employees).filter(uid=>employees[uid].role!=='admin').map(uid=>`<option value="${uid}">${esc(employees[uid].name)}</option>`).join('');
    sel.value = cur;
    draw(); drawCards();
  }, err=>console.error(err));
  unsubList.push(u1);

  const u2 = onSnapshot(collection(db,'tokeenRequests'), qs=>{
    allRows = []; qs.forEach(d=> allRows.push({id:d.id, ...d.data()}));
    draw(); drawCards();
  }, err=>console.error(err));
  unsubList.push(u2);

  container.querySelector('#log-emp-filter').addEventListener('change', draw);
  container.querySelector('#log-status-filter').addEventListener('change', draw);
  container.querySelector('#log-sort').addEventListener('change', draw);
  container.querySelector('#log-search').addEventListener('input', draw);
  container.querySelector('#cards-from').addEventListener('change', drawCards);
  container.querySelector('#cards-to').addEventListener('change', drawCards);
  container.querySelector('#cards-all-time').addEventListener('click', ()=>{
    container.querySelector('#cards-from').value='';
    container.querySelector('#cards-to').value='';
    drawCards();
  });
  container.querySelector('#log-export-btn').addEventListener('click', ()=>{
    if(lastFilteredRows.length===0){ toast('لا توجد بيانات لتصديرها', 'err'); return; }
    exportRowsToExcel(lastFilteredRows, lastColSet, `سجل_طلبات_التقنين_${todayCairoStr()}.xlsx`, employees);
  });
}

          <select id="up-center">

          </select>
          <input type="text" id="up-center-other" placeholder="اكتب اسم المركز" style="display:none;margin-top:8px;">
        </div>
        <div class="field">
          <label>الموظف *</label>
          <select id="up-emp"><option value="">-- اختر الموظف --</option></select>
        </div>
        <button class="btn btn-primary" id="up-submit-single-btn">رفع الطلبات للموظف</button>
      </div>

      <div id="up-multi-wrap" style="display:none;">
        <div class="flex-between" style="margin-bottom:10px;">
          <h3 style="margin:0;font-size:14px;">توزيع المراكز على الموظفين</h3>
        </div>
        <div id="up-center-chips"></div>
        <button class="btn btn-primary" id="up-submit-multi-btn" style="margin-top:10px;">توزيع الطلبات على الموظفين</button>

    const empSelect = container.querySelector('#up-emp');
    if(empSelect){
      const cur = empSelect.value;
      empSelect.innerHTML = `<option value="">-- اختر الموظف --</option>` +
        employeesList.map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.department)})</option>`).join('');
      if(cur) empSelect.value = cur;

      sel.innerHTML = `<option value="">-- اختر الموظف --</option>` +
        employeesList.map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.department)})</option>`).join('');

      container.querySelector('#up-center-other').style.display = (e.target.value==='__other__') ? 'block' : 'none';
    }
  });

  let parsedRows = [];
  let centersMap = {}; // center name -> rows
  let currentFile = null;
  let detectedCenterCol = null;

  function empSelectOptions(){
    return `<option value="">-- اختر الموظف --</option>` +
      employeesList.map(e=>`<option value="${e.id}">${esc(e.name)} (${esc(e.department)})</option>`).join('');
  }

  container.querySelector('#up-file').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    currentFile = file;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(json.length===0){ toast('الملف فارغ أو غير صالح', 'err'); return; }
        parsedRows = json;
        const cols = Object.keys(json[0]);

        container.querySelector('#up-req-field').innerHTML = cols.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
        container.querySelector('#up-reqfield-wrap').style.display='block';

        detectedCenterCol = detectCenterColumn(cols);
        centersMap = {};
        if(detectedCenterCol){
          parsedRows.forEach(row=>{
            const c = String(row[detectedCenterCol]||'').trim() || 'غير محدد';
            (centersMap[c] = centersMap[c]||[]).push(row);
          });
        }
        const centerNames = Object.keys(centersMap);
        const noteBox = container.querySelector('#up-detect-note');
        noteBox.style.display='block';

        const singleWrap = container.querySelector('#up-single-wrap');
        const multiWrap = container.querySelector('#up-multi-wrap');

        if(centerNames.length>1){
          // ملف مجمّع: أكثر من مركز — عرض توزيع
          noteBox.textContent = `تم العثور على ${json.length} صف بعمود المركز "${detectedCenterCol}" — عدد المراكز: ${centerNames.length}. وزّع كل مركز على الموظف المناسب (يمكن اختيار نفس الموظف لأكثر من مركز).`;
          singleWrap.style.display='none';
          multiWrap.style.display='block';
          container.querySelector('#up-center-chips').innerHTML = centerNames.map((c,i)=>`
            <div class="center-chip">
              <div>
                <div class="cc-name">${esc(c)}</div>
                <div class="cc-count">${centersMap[c].length} طلب</div>
              </div>
              <select class="dist-emp-select" data-center="${esc(c)}">${empSelectOptions()}</select>
            </div>
          `).join('');
        }else{
          // مركز واحد فقط (أو لم يتم التعرف على عمود المركز)
          const autoCenter = centerNames.length===1 ? centerNames[0] : '';
          noteBox.textContent = detectedCenterCol
            ? `تم العثور على ${json.length} صف، بمركز واحد: "${autoCenter}"`
            : `تم العثور على ${json.length} صف بالأعمدة: ${cols.join('، ')} — لم يتم العثور على عمود مركز، اكتب المركز يدويًا`;
          multiWrap.style.display='none';
          singleWrap.style.display='block';
          if(autoCenter){
            const centerSel = container.querySelector('#up-center');
            const opt = [...centerSel.options].find(o=>o.value===autoCenter);
            if(opt) centerSel.value = autoCenter;
            else{ centerSel.value='__other__'; container.querySelector('#up-center-other').style.display='block'; container.querySelector('#up-center-other').value = autoCenter; }
          }
        }
      }catch(err){
        console.error(err);
        toast('تعذر قراءة الملف، تأكد من الصيغة', 'err');
      }
    };
    reader.readAsArrayBuffer(file);
  });

  async function saveFileRecord(centersUsed, batchIds){
    if(!currentFile) return;
    let storagePath = null, downloadURL = null, storageOk = true;
    try{
      storagePath = `tokeenFiles/${Date.now()}_${currentFile.name}`;
      const sref = storageRef(storage, storagePath);
      await uploadBytes(sref, currentFile);
      downloadURL = await getDownloadURL(sref);
    }catch(err){
      console.error('storage upload error', err);
      storageOk = false;
      storagePath = null;
      downloadURL = null;
    }
    try{
      await setDoc(doc(collection(db,'tokeenFiles')), {
        fileName: currentFile.name, storagePath, downloadURL,
        uploaderUid: currentUser.uid, uploaderName: currentEmployee.name,
        uploadedAt: serverTimestamp(), rowCount: parsedRows.length, centers: centersUsed,
        batchIds: batchIds
      });
      if(!storageOk){
        toast('تم رفع الطلبات وتسجيل الملف في القائمة، لكن تعذر حفظ نسخة الملف نفسها للتنزيل (تحقق من إعدادات Firebase Storage)', 'err');
      }
    }catch(err){
      console.error('file record save error', err);
      toast('تم رفع الطلبات بنجاح، لكن حدث خطأ أثناء تسجيل الملف في قائمة الملفات المرفوعة', 'err');
    }
  }

  async function uploadRowsFor(uid, center, rows, reqField){
    const batchId = `b_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
    const today = todayCairoStr();
    const chunkSize = 450;
    for(let i=0;i<rows.length;i+=chunkSize){
      const chunk = rows.slice(i, i+chunkSize);
      const batch = writeBatch(db);
      chunk.forEach(row=>{
        const ref2 = doc(collection(db,'tokeenRequests'));
        batch.set(ref2, {
          uid, center, date: today, batchId, reqField,
          data: row, done:false, doneAt:null, doneDate:null, uploadedAt: serverTimestamp()
        });
      });
      await batch.commit();
    }
    return batchId;
  }

  container.querySelector('#up-submit-single-btn').addEventListener('click', async ()=>{
    const errBox = container.querySelector('#up-err');
    errBox.style.display='none';
    const uid = container.querySelector('#up-emp').value;
    let center = container.querySelector('#up-center').value;
    if(center==='__other__') center = container.querySelector('#up-center-other').value.trim();
    const reqField = container.querySelector('#up-req-field') ? container.querySelector('#up-req-field').value : '';
    if(!uid || !center || parsedRows.length===0 || !reqField){
      errBox.textContent = 'من فضلك أكمل كل الحقول وارفع ملف صالح';
      errBox.style.display='block';
      return;
    }
    const btn = container.querySelector('#up-submit-single-btn');
    btn.disabled=true; btn.textContent='جارِ الرفع...';
    try{
      const batchId = await uploadRowsFor(uid, center, parsedRows, reqField);
      await saveFileRecord([center], [batchId]);
      toast(`تم رفع ${parsedRows.length} طلب بنجاح`, 'ok');
      resetForm();
    }catch(err){
      console.error(err);
      errBox.textContent = 'حدث خطأ أثناء الرفع، حاول مرة أخرى';
      errBox.style.display='block';
    }
    btn.disabled=false; btn.textContent='رفع الطلبات للموظف';
  });

  container.querySelector('#up-submit-multi-btn').addEventListener('click', async ()=>{
    const errBox = container.querySelector('#up-err');
    errBox.style.display='none';
    const reqField = container.querySelector('#up-req-field') ? container.querySelector('#up-req-field').value : '';
    const selects = [...container.querySelectorAll('.dist-emp-select')];
    if(!reqField || selects.some(s=>!s.value)){
      errBox.textContent = 'من فضلك اختر عمود رقم الطلب وموظفًا لكل مركز';
      errBox.style.display='block';
      return;
    }
    const btn = container.querySelector('#up-submit-multi-btn');
    btn.disabled=true; btn.textContent='جارِ التوزيع والرفع...';
    try{
      const centersUsed = [];
      const batchIds = [];
      for(const sel of selects){
        const center = sel.dataset.center;
        const uid = sel.value;
        centersUsed.push(center);
        const bId = await uploadRowsFor(uid, center, centersMap[center], reqField);
        batchIds.push(bId);
      }
      await saveFileRecord(centersUsed, batchIds);
      toast(`تم توزيع ${parsedRows.length} طلب على ${selects.length} مركز بنجاح`, 'ok');
      resetForm();
    }catch(err){
      console.error(err);
      errBox.textContent = 'حدث خطأ أثناء الرفع، حاول مرة أخرى';
      errBox.style.display='block';
    }
    btn.disabled=false; btn.textContent='توزيع الطلبات على الموظفين';
  });

  function resetForm(){
    parsedRows = []; centersMap = {}; currentFile = null; detectedCenterCol = null;
    container.querySelector('#up-file').value='';
    container.querySelector('#up-detect-note').style.display='none';
    container.querySelector('#up-reqfield-wrap').style.display='none';
    container.querySelector('#up-single-wrap').style.display='none';
    container.querySelector('#up-multi-wrap').style.display='none';
    container.querySelector('#up-center').value='';
    container.querySelector('#up-center-other').style.display='none';
    container.querySelector('#up-center-other').value='';
    container.querySelector('#up-emp').value='';
  }

  /* ---- قائمة الملفات المرفوعة ---- */
  const uf = onSnapshot(query(collection(db,'tokeenFiles'), orderBy('uploadedAt','desc')), qs=>{
    const box = container.querySelector('#up-files-list');
    if(!box) return;
    const files = []; qs.forEach(d=> files.push({id:d.id, ...d.data()}));
    if(files.length===0){ box.innerHTML = `<div class="empty-state">لا توجد ملفات مرفوعة بعد</div>`; return; }
    box.innerHTML = files.map(f=>{
      const hasUrl = !!f.downloadURL;
      return `
      <div class="file-row">
        <div class="f-info">
          <div class="f-name" data-url="${esc(f.downloadURL||'')}" data-name="${esc(f.fileName||'ملف')}" ${hasUrl?'':'style="cursor:default;color:var(--sub);"'}>📄 ${esc(f.fileName||'ملف')}</div>
          <div class="f-meta">رفعه: ${esc(f.uploaderName||'—')} • ${f.uploadedAt?fmtDateTime(f.uploadedAt):'—'} • عدد الطلبات: ${f.rowCount||0}${f.centers&&f.centers.length?` • ${f.centers.map(esc).join('، ')}`:''}${hasUrl?'':' • <span style="color:var(--bad);">نسخة التنزيل غير متاحة</span>'}</div>
        </div>
        <div class="action-stack">
          <button class="btn btn-outline btn-sm dl-file-btn" data-url="${esc(f.downloadURL||'')}" data-name="${esc(f.fileName||'ملف')}" ${hasUrl?'':'disabled'}>⬇ تحميل</button>
          <button class="btn btn-danger btn-sm del-file-btn" data-id="${f.id}">حذف</button>
        </div>
      </div>
    `;}).join('');
    function downloadFile(url, name){
      if(!url){ toast('الرابط غير متاح', 'err'); return; }
      const a = document.createElement('a');
      a.href = url; a.download = name; a.target='_blank';
      document.body.appendChild(a); a.click(); a.remove();
    }
    box.querySelectorAll('.f-name').forEach(el2=> el2.addEventListener('click', ()=> downloadFile(el2.dataset.url, el2.dataset.name)));
    box.querySelectorAll('.dl-file-btn').forEach(b=> b.addEventListener('click', ()=> downloadFile(b.dataset.url, b.dataset.name)));
    box.querySelectorAll('.del-file-btn').forEach(b=>{
      b.addEventListener('click', ()=> confirmDeleteFile(files.find(f=>f.id===b.dataset.id)));
    });
  }, err=>{
    console.error('tokeenFiles listener error', err);
    const box = container.querySelector('#up-files-list');
    if(box) box.innerHTML = `<div class="empty-state">تعذر تحميل قائمة الملفات (${esc(err && err.code || 'خطأ')}) — على الأغلب قواعد أمان Firestore/Storage لا تسمح بالوصول إلى مجموعة tokeenFiles، راجع إعدادات المشروع.</div>`;
  });
  unsubList.push(uf);

  async function confirmDeleteFile(f){
    if(!f) return;
    const overlay = el(`
      <div class="modal-overlay">
        <div class="modal-box">
          <h3>حذف ملف: ${esc(f.fileName||'')}</h3>
          <div class="modal-sub" id="del-file-checking">جارِ التحقق من الطلبات المرتبطة بالملف...</div>
          <div class="modal-actions">
            <button class="btn btn-outline" id="dfc-cancel">إلغاء</button>
            <button class="btn btn-danger" id="dfc-confirm" disabled>تأكيد الحذف</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(overlay);
    overlay.querySelector('#dfc-cancel').addEventListener('click', ()=> overlay.remove());
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

    let linkedRequests = [];
    try{
      const batchIds = f.batchIds || [];
      if(batchIds.length){
        for(let i=0;i<batchIds.length;i+=10){
          const chunk = batchIds.slice(i,i+10);
          const qs = await getDocs(query(collection(db,'tokeenRequests'), where('batchId','in',chunk)));
          qs.forEach(d=> linkedRequests.push({id:d.id, ...d.data()}));
        }
      }
    }catch(err){ console.error(err); }

    const doneCount = linkedRequests.filter(r=>r.done).length;
    const sub = overlay.querySelector('#del-file-checking');
    if(linkedRequests.length===0){
      sub.innerHTML = `لم يتم العثور على طلبات مرتبطة بهذا الملف بشكل مؤكد. سيتم حذف الملف فقط.`;
    }else if(doneCount>0){
      sub.innerHTML = `⚠️ هذا الملف يحتوي على <b>${linkedRequests.length}</b> طلب، منها <b style="color:var(--bad);">${doneCount}</b> طلب تم إدخاله بالفعل من قبل الموظفين. حذف الملف سيحذف كل هذه الطلبات نهائيًا بما فيها ما تم إدخاله. هل أنت متأكد؟`;
    }else{
      sub.innerHTML = `سيتم حذف الملف وعدد ${linkedRequests.length} طلب مرتبط به (لم يتم إدخال أي منها بعد).`;
    }
    const confirmBtn = overlay.querySelector('#dfc-confirm');
    confirmBtn.disabled = false;

    confirmBtn.addEventListener('click', async ()=>{
      confirmBtn.disabled=true; confirmBtn.textContent='جارِ الحذف...';
      try{
        const chunkSize = 450;
        for(let i=0;i<linkedRequests.length;i+=chunkSize){
          const chunk = linkedRequests.slice(i,i+chunkSize);
          const batch = writeBatch(db);
          chunk.forEach(r=> batch.delete(doc(db,'tokeenRequests', r.id)));
          await batch.commit();
        }
        if(f.storagePath){ try{ await deleteObject(storageRef(storage, f.storagePath)); }catch(e){ console.warn(e); } }
        await deleteDoc(doc(db,'tokeenFiles', f.id));
        toast('تم حذف الملف والطلبات المرتبطة به', 'ok');
        overlay.remove();
      }catch(err){
        console.error(err);
        toast('حدث خطأ أثناء الحذف', 'err');
        confirmBtn.disabled=false; confirmBtn.textContent='تأكيد الحذف';
      }
    });
  }
}
</script>
</body>
</html>
